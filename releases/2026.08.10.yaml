# CloudsForge release manifest.
#
# WHAT THIS RELEASE IS: the boot-time secret guard, @cloudsforge/secrets, reaching the containers
# that actually run. The package was correct and committed for days and was in NO running image
# for the twelve services below -- micro-org #142.
#
# NOT generated by `cfctl release`: it refuses while any service repository has a dirty working
# tree, and `identity` and `trade` are both carrying another agent's in-flight work. That guard is
# about working trees; an IMAGE is built from a committed HEAD. So each of the twelve tags below
# was checked two ways instead: the tag exists in GHCR, and its digest is identical to that of the
# `sha-<HEAD>` tag of the same repository -- i.e. the published image really was built from the
# commit on main, not from somebody's tree.
#
# BUILT FROM WHAT IS RUNNING, not from 2026.08.9. That manifest named `nda` 1.0.0 and `notify`
# 1.1.0 while 1.1.0 and 1.2.0 were deployed by hand and healthy, so consuming it would have rolled
# two live services backwards -- the same trap it records for ledger one release earlier. Both are
# carried forward here at their running tags.
#
# HELD BACK DELIBERATELY, all four verified rather than assumed:
#   admin-api  1.1.0  The guard REFUSES its current ADMIN_API_SERVICE_TOKEN, which holds a JWT and
#                     not a `cfsc_` credential. Measured, not guessed: driving admin-api's own
#                     loadEnv against the live container environment exits 1 on both estates. It
#                     has no ServiceTokenProvider and presents the value verbatim as a bearer, so
#                     supplying a credential would pass the guard and then 401 every upstream call
#                     -- a loud failure traded for a silent one. Ships when the provider lands.
#   trade      1.0.0  micro-trade:1.1.0 has green CI and DOES NOT EXIST in GHCR, and the working
#                     tree is mid-change (`src/env.ts` is dirty). Pinning it would fail the pull
#                     gate; building it would name a working tree.
#   community  1.1.0  Both are being changed RIGHT NOW by other agents wiring ServiceTokenProvider,
#   tessera    1.1.0  and both fail the same way admin-api does: their `*_SERVICE_CREDENTIAL` holds
#                     a 701/718-byte JWT, which `assertServiceCredential` refuses by name. Measured
#                     against the live containers after tonight's restart, on both estates. Their
#                     working trees are mid-change, so an image built now would name a working tree.
#
# TEN secret-guard consumers are ALREADY correctly guarded in production and are untouched here:
# activity, aetherholm, billing, devplatform, ledger, mint, nda, policy, pricing, studio. Their
# `src/env.ts` is byte-identical to the copy inside their running image, and secrets 1.0.0 -> 1.2.0
# is a purely additive diff (`263a264,506`), so the `assertGeneratedSecret` they already run is
# byte-identical to the current one. Rebuilding them would ship no behaviour change and would
# restart ten healthy services for nothing.
#
# `indexer` is untouched on purpose: Litecoin sync is near its tip.
