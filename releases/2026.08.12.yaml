# CloudsForge release manifest.
#
# WHAT THIS RELEASE IS: two services that were never in a release at all, and one that prices
# Bitcoin-family withdrawals from confirmed blocks.
#
# ── THE PART THAT IS NOT A CHANGE TO ANY SERVICE ─────────────────────────────────────────────
#
# `pool` and `pool-web` have been running on mainnet for weeks and NO manifest has ever named
# them. Twelve files, `grep -c "name: pool"` is 0 in every one. They are not listed under
# `absent:` either, so the hole said nothing in either direction: the files did not claim the pool
# was out of the release, they simply never mentioned it.
#
# That is not a bookkeeping complaint. Both carry a `build:` in `docker-compose.estate.yml`, an
# unpinned service keeps it, and `docker compose up` therefore reaches for a builder. Deploying
# 2.5.19 to the app host on 2026-08-11 pulled all 48 images, passed `release-deploy.sh --dry-run`
# ("all 46 image(s) exist") and then died at the switch:
#
#     #1 [internal] load local bake definitions
#     unable to prepare context: path "/home/savvaniss/dev/cloudsforge/pool-web" not found
#     deploy failed
#
# The app host has five sibling repositories checked out, not 48. Compose refuses the whole `up`
# rather than half of it, so nothing moved and the estate was never at risk — but no release could
# be deployed to that host at all, which is where the estate now runs. micro-org#380.
#
# The two rows below are pinned at the images those containers are ALREADY running, verified by
# digest against the running container ids (`95728591cc67`, `295120ff4311`) rather than by tag —
# so this release records what is there instead of moving it. micro-deploy#59 makes the renderer
# REFUSE a release that leaves a buildable service unpinned, so the next service added to compose
# cannot repeat this quietly.
#
# ── AND THE SERVICE THAT DOES CHANGE ─────────────────────────────────────────────────────────
#
# `settlement` 2.5.20 (micro-settlement#22, micro-org#373 stage 2). `bitcoind 27.0` answers
# `estimatesmartfee` with `-32603 Fee estimation disabled` on every target, permanently — Core 25+
# only constructs an estimator when it accepts incoming transactions, and this node runs
# `blocksonly`. So Bitcoin-family withdrawals took the relay floor, and 1 sat/vB is not a
# transaction that gets refused, it is one that is relayed and then sits.
#
# `getblockstats` reads CONFIRMED blocks and answers fine under `blocksonly`. The adapter now
# takes the p90 across a 24-block trailing window of each block's 50th-percentile feerate, clamped
# between the relay floor and the ceiling custody enforces on the signature, cached per
# `network:tip` so the 24 calls are a per-block cost. A fractional `estimatesmartfee` answer is
# also rounded UP rather than truncated: 1,500 sat/kvB is 1.5/vB, and taking 1 pays a third under
# what the node just said was needed.
#
# NOTHING IS OPENED BY THIS. `SETTLEMENT_RPC_URLS` carries no `btc` key and `WALLET_FEE_QUOTES`
# names no BTC, so settlement still answers `no_endpoint` for Bitcoin by name — measured against
# the branch image on mainnet before this was cut, alongside `GET /v1/fees/ltc/mainnet/LTC`
# answering 141 litoshi, which is the unchanged 1/vB across a 141 vB spend. Litecoin's estimator
# has data again and keeps the estimator branch; the derivation is its fallback for the days it
# does not, which is the state that same node was in on 2026-08-09.
#
# ── WHAT IS NOT IN THIS RELEASE ──────────────────────────────────────────────────────────────
#
# Every other service is byte-identical to 2026.08.11 and is pinned to the same tag, deliberately.
# Restarting 43 healthy services to ship nothing is not a release, it is an outage with a version
# number.
