# CloudsForge release manifest.
#
# WHAT THIS RELEASE IS: the SECOND half of micro-org #229. 2026.08.10 got `@cloudsforge/secrets`
# into fifteen images. It also recorded, in its own header, that ten more consumers were "ALREADY
# correctly guarded in production ... their `src/env.ts` is byte-identical to the copy inside their
# running image". That claim was re-checked against the running containers before this release was
# cut, and it is WRONG for six of the ten. Measured, not argued -- `docker exec <container> cat
# /app/src/env.ts` diffed against the repository:
#
#     activity aetherholm devplatform policy    env.ts byte-identical      <- the claim holds
#     billing mint nda pricing studio emberkin  env.ts DIFFERS             <- the claim does not
#
# The four the claim holds for are STILL untouched here, and for the reason the old header gave:
# secrets 1.0.0 -> 1.2.0 is a purely additive diff (`263a264,506`, zero changed or deleted lines,
# re-measured), and those four call only `assertGeneratedSecret`, which is byte-identical across
# the two versions. Restarting a healthy service to ship nothing is not a fix.
#
# The six the claim does NOT hold for are the release. What was actually in their running images:
#
#     billing 1.1.0   env.ts calls assertServiceCredential 0 times; the repository calls it 3
#     mint    1.2.0   env.ts calls assertServiceCredential 0 times; the repository calls it 3
#     nda     1.1.0   env.ts calls assertServiceCredential 0 times; the repository calls it 2
#     studio  1.2.0   env.ts calls assertOpaqueSecret      0 times; the repository calls it
#     pricing 1.2.0   env.ts drifted from the repository
#     emberkin 1.0.0  NO @cloudsforge/secrets IN THE IMAGE AT ALL
#
# So `billing`, `mint` and `nda` each hold a live `cfsc_` credential and ran NO credential guard --
# the shape #229 names: a protection everyone believed was in force, which was not, and therefore
# worse than no guard because nobody was looking.
#
# NOTHING HERE WAS REBUILT except ledger. Every one of those six images ALREADY EXISTED in GHCR,
# built from the commit on main, and had simply never been pinned -- the previous release declined
# to ship them on the strength of the claim above. Each was verified two ways before it was named
# here: the tag pulls, and its digest is identical to the `sha-<HEAD>` tag of the same repository,
# so the image really was built from the commit named beside it and not from somebody's tree.
#
# LEDGER IS THE ONE REAL CHANGE, and it is #229 in its second shape: a guard that IS in the image
# and is the WRONG VERSION OF ITSELF. ledger 1.2.1's env.ts is byte-identical to the repository and
# does run a credential guard -- its OWN private copy, the one `@cloudsforge/secrets` was promoted
# from. That copy checks the JWT shape, the `cfsc_` prefix, the 32-byte floor and the entropy floor,
# and NOT the placeholder markers, so `cfsc_ci-only-NOT-a-real-credential-9xKq2mZ7vB` cleared all
# four of its checks. micro-runtime f01fe52 closed that hole in the shared copy; ledger never
# inherited the fix because ledger was not calling the shared copy. 1.2.2 deletes the private copy,
# calls the shared one, and pins the regression as a test.
#
# THE HYPHEN IS LIVE IN BOTH DIRECTIONS and no estate was inferred from the other. A credential body
# is base64url, and on these two networks `mint` carries a hyphen on mainnet and none on testnet
# while `nda` is the reverse -- so a "no hyphens" rule passes one estate and crash-loops the other,
# whichever way it is written. Every probe below was run separately per network.
#
# PREFLIGHT, and it is the whole of the evidence: every service and migrator on BOTH estates had its
# OWN `loadEnv` driven, inside the image THIS manifest pins, against the COMPOSE-RESOLVED
# environment the new container will receive -- not the running container's. Plus a CANARY of
# poisoned boots on the same images and the same environments, because a preflight that finds
# nothing is only meaningful if it can also find something.
#
# `EMBERKIN_SERVICE_TOKEN` is a 698-character JWT presented verbatim as a Bearer and is guarded by
# JWT SHAPE with deliberately no expiry check (#228). An expiry check there would crash-loop the
# service on every restart. It is not a defect and it was not "fixed".
#
# `indexer` is untouched on purpose: Litecoin sync is still ~120,000 blocks from its tip.
# `identity` and `notify` are untouched: another agent holds password-reset work in flight.
