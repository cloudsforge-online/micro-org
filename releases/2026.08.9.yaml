# CloudsForge release manifest.
#
# NOT generated by `cfctl release`, and the reason is recorded rather than hidden: cfctl
# refuses while ANY service repository has a dirty working tree, and `identity` is carrying
# another agent's in-flight work. That guard is about working trees; an IMAGE is built from a
# committed HEAD, and every tag below was verified to exist in GHCR before this file was
# written — which is the property the guard is a proxy for.
#
# Built from WHAT SHOULD BE RUNNING, not from the previous manifest. 2026.08.8 still named
# ledger 1.1.0 while 1.2.1 was deployed by hand and healthy, so consuming it would have rolled
# a live fix backwards.
#
# notify and nda are held at their last PUBLISHED version, not their committed one: both have
# red CI, so 1.1.1 and 1.1.0 were never published and naming them would break the deploy.
# notify 1.1.1 carries the #201 rate-limit fix and is blocked behind #202.
