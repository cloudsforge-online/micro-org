server {
  listen 8080;
  root /usr/share/nginx/html;

  # The SPA owns its routes; a deep link must not 404 on a hard refresh.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html is never cached, everything else is cached forever. The hashed asset names make
  # that safe, and it is what lets a new image take effect on the next page load rather than
  # whenever a browser happens to revalidate.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
