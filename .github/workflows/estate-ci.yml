name: estate-ci

# ══════════════════════════════════════════════════════════════════════════════════════════════════
# THE INVARIANTS THAT ARE TRUE OF THE ESTATE AND OF NO SINGLE REPOSITORY.
#
# service-ci.yml and web-ci.yml answer "is THIS repository right". Some of the estate's most
# expensive defects are not properties of a repository at all — they are properties of the
# relationship between two of them, and no per-repository job can see one, however good it is.
#
# The first of them, and the reason this file exists:
#
#   `micro-ledger` keys an account on `(subject, asset_code, purpose)` and NOT on its type, so
#   `ensureAccount` throws `AccountConflictError` when a caller names an existing account with a
#   different `type` (ledger/src/accounts.ts:125). Every service picks that type independently, in
#   its own source. When two disagree, whichever posts SECOND in production has EVERY entry refused
#   — not one entry, every entry, for as long as the disagreement stands. It is invisible to every
#   suite in the estate because each service tests against its own fake ledger, so nothing in CI has
#   ever put two real services against one real chart of accounts.
#
#   Three instances were found — micro-worlds, micro-emberkin and micro-settlement all debiting
#   `(platform, …, fees)` as `expense` against `revenue` in six other services — and all three were
#   found by a human reading a second repository for an unrelated reason. "Found incidentally, three
#   times" is not a search.
#
# `micro-conformance` holds the search (`src/ledgeraccounts.ts`): a TypeScript-compiler-API sweep,
# not a regex, because the account literals are spelled three different ways across the estate. It
# works and it is proven to go red. Its author recorded the limitation that made it nearly useless:
#
#   > No CI job anywhere has all services checked out — service-ci fetches only runtime+contracts —
#   > so the estate half is a local gate today.
#
# An estate-wide invariant that runs only when somebody remembers to run it locally is not a gate.
# This file is the job that has all services checked out.
#
# ──────────────────────────────────────────────────────────────────────────────────────────────────
# THE THREE MECHANISMS THAT WERE AVAILABLE, AND WHY THIS IS THE ONE
#
# 1. REJECTED — a job inside service-ci.yml, so every service's CI sweeps the estate.
#    It is the only shape that can BLOCK a merge without editing 55 repositories, and it is wrong
#    twice over. It would clone ~55 repositories on every push to any of them — roughly fifty times
#    the work for exactly the same answer, since the sweep's result depends on the estate and not on
#    which repository triggered it. And it makes micro-pricing's CI fail when micro-worlds is
#    unavailable, or when micro-worlds lands a bad account type: a red that the author of the pricing
#    pull request cannot fix, cannot explain and did not cause. beacon says what happens next
#    (beacon/src/estate.ts:15) — "a declared-but-skipping critical journey would refuse every release
#    for ever", and the fix everyone reaches for is to switch the gate off. An estate-wide check that
#    can block an unrelated author is a check with a one-week life expectancy.
#
# 2. REJECTED AS THE WHOLE ANSWER — a nightly schedule and nothing else.
#    It catches drift only after it has landed, and a nightly red that belongs to nobody is a red
#    that gets ignored; within a month it is wallpaper. The schedule is KEPT, because it is the only
#    trigger that exists without editing other repositories, but it is not left as a bare red: see
#    "WHERE A FAILURE LANDS" below.
#
# 3. NOT AVAILABLE — a job triggered by pushes to the repositories that matter.
#    Narrower and better, and a workflow in micro-org cannot see another repository's pushes without
#    that repository notifying it. Every service's CI already CALLS micro-org, but it calls with
#    `estate_token`, documented and provisioned as `contents:read`; making the estate's most
#    important gate depend on turning 55 read tokens into write tokens is a migration that fails
#    silently in every repository that has not done it yet — the exact "check that cannot fail" class
#    this estate keeps rediscovering. When a repository wants precision it can have it today:
#    `workflow_call` is declared below, and micro-conformance (which owns the checker) is the right
#    first caller, so that changing the checker re-sweeps the estate.
#
# So: ONE job, in the one repository that owns estate-wide invariants, on a schedule, on demand, and
# whenever this file itself changes.
#
# ──────────────────────────────────────────────────────────────────────────────────────────────────
# BLOCKS OR REPORTS
#
# It BLOCKS in micro-org — this job goes red, and micro-org is where an estate-wide invariant is
# owned and fixable. It blocks NO service's merge, because it is not called from any service's CI and
# must not be: nothing here is fixable by the author of an unrelated pull request.
#
# WHERE A FAILURE LANDS. A red run is a URL that expires and a notification nobody is on. So on a
# scheduled or pushed failure this job opens — or comments on — an issue in micro-org labelled
# `estate-invariant`, carrying the full report, and CLOSES it again when the sweep goes green. That
# is the difference between a nightly red and a nightly red with an owner, and it is the whole answer
# to objection 2 above.
#
# ──────────────────────────────────────────────────────────────────────────────────────────────────
# A JOB THAT SILENTLY REFUSES TO RUN IS A CHECK THAT CANNOT FAIL
#
# The sweep refuses a partial checkout (`MIN_SERVICES = 40`, ledgeraccounts.ts:508) precisely because
# an empty parent directory would otherwise report "0 disagreements" and pass. This job is built so
# that the refusal is never how we find out:
#
#   * The repository list is DERIVED from the GitHub API, never written down here. micro-org's own
#     tools/registry.ts lists 46 repositories and does not contain micro-emberkin — one of the three
#     repositories the account defect was actually found in. A hand-maintained list would have made
#     this job blind to the very defect it exists to catch, and would have reported green while doing
#     it. The count the API returns is asserted, and a clone that fails is fatal rather than skipped.
#   * A CANARY runs BEFORE the real sweep, on every run: a known-bad account type is injected into
#     the checked-out estate, and the job fails unless the sweep goes red AND names the injected file.
#     Exit-code-only grading is not enough — a broken checkout also exits non-zero, for the wrong
#     reason. This estate has already shipped a canary that graded an unchanged file, so the
#     injection is asserted written before and asserted deleted after.
#
# ──────────────────────────────────────────────────────────────────────────────────────────────────
# THE OTHER TWO INVARIANTS THIS JOB CARRIES
#
# Both were designed into the shape above and are a STEP each, not a new mechanism: the expensive
# part is having all fifty-five repositories on one disk, and that has already happened by the time
# the first verdict is read. Each is documented at its own step; in one line each —
#
#   2. THE SCOPE REGISTRY IS TOTAL. service-ci.yml proves demands ⊆ registry one repository at a
#      time. registry ⊆ demands needs the union of every gate in the estate, which no repository has;
#      contracts says so itself, above `isDeprecatedScope`: "Nothing proves the other direction,
#      because no checkout sees every gate."
#   3. THE TOPIC REGISTRY DESCRIBES WHAT SERVICES ACTUALLY SEND. identity's and notify's topics.ts
#      each reconcile one repository against the registry. The registry is not the estate: a
#      registered topic no producer emits, and an emitter no code calls, both pass every per-
#      repository check there is.
#
# A FAILURE IN ONE DOES NOT STOP THE OTHERS. Every verdict step is `if: always()`. The three have
# nothing to do with each other and share a checkout only because cloning it three times would be
# absurd; stopping at the first would turn "the estate is wrong in three ways" into three nights of
# work, and would let a broken sweep hide a real disagreement behind it. The canaries are `always()`
# for the same reason, and a canary failing does not suppress its own verdict: "does the machinery
# work" and "does the estate agree" are different questions and a run must answer both.
#
# ──────────────────────────────────────────────────────────────────────────────────────────────────
# WHAT THIS STILL CANNOT SEE
#
# ALL THREE: it reads `main`. A disagreement introduced on a branch is caught when it lands, not when
# it is proposed — the price of mechanism 3 being unavailable. And it reads SOURCE: what a service
# has already written to a production ledger, bus or token is outside every sweep here.
#
# LEDGER ACCOUNTS: everything ledgeraccounts.ts's own header lists — anything not written as a
# TypeScript object literal, and types decided at runtime.
#
# SCOPES: it sees gates whose demand service-ci.yml's derivation can resolve. It does not GUESS at
# the rest — an unresolvable demand fails the step, because a union with a hole in it reports live
# scopes as dead. It cannot see a scope demanded by something that is not a gate (a grant list, an
# operator console, a document), so "no gate demands it" is exactly what it claims and not "nothing
# uses it". Front ends are audited too and demand nothing today; if one ever gates in the browser,
# it is already in the union.
#
# TOPICS: it sees an emit as a `topic:` property or an `insert into outbox (topic, …) values ('…')`,
# resolving constants and object members. Both shapes are in the estate today and a third would fail
# the step rather than pass it — an unreadable emit is fatal, for the same reason as an unresolvable
# scope. It cannot see a topic assembled at runtime, and its reachability check is syntactic: it
# catches an exported emitter nothing references (`emitSessionRevoked`), and it does NOT prove the
# caller is itself reached — a chain of dead functions calling each other satisfies it. A real answer
# needs a call graph, and the honest note is cheaper than the false confidence.
#
# It also cannot judge a topic whose first segment names no service in the checkout: `web.page.viewed`
# is emitted by four browsers, and "no producer emits it" would be a confident falsehood. Those are
# printed as unjudged rather than passed silently.
#
# The CONSUMER TABLES of direction 3 are still read as literals with a quorum, and a rule table built
# out of constants is invisible to it. That is deliberate rather than overlooked: the record
# structures direction 4 reads are named (`UNPRODUCED_NOTIFICATIONS`, `AWAITING_REGISTRATION`) and so
# resolving identifiers inside them changes a known thing, while moving the quorum in fifty-six
# repositories on a guess changes an unknown number of verdicts in both directions.
#
# `tools/estate-topic-gaps.json` records the disagreements this sweep has found that micro-org cannot
# fix — with evidence, an owning repository, and now a `status` saying whether the finding is simply
# unfixed or DEFERRED with the condition that ends the deferral. It is a ratchet, not an exemption
# list: a new instance is red on the day it lands, and a recorded one that gets fixed is ALSO red
# until the record is deleted — five of the first nine went red that way within a day, which is the
# normal case rather than the exception. The file argues its own existence at the top, and records
# what the first nine taught it: that evidence can be wrong (the custody record said an export path
# "completed in silence" when it was emitting under a name nobody knew), and that one record
# suppresses a finding by `<kind>:<topic>` alone, so every absorbed finding is printed even where the
# file describes one.
# ══════════════════════════════════════════════════════════════════════════════════════════════════

on:
  # 06:17 UTC. Off the hour deliberately: the hour is where every cron in every estate piles up and
  # where GitHub's scheduler is most likely to delay or drop a run.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  # A change to this file re-proves the mechanism. Both halves matter: the pull request tells the
  # author whether the machinery still works, and the push tells the repository whether it works on
  # main, which is the only ref the schedule will ever use.
  push:
    branches: [main]
    # The checkers and the recorded gaps are part of the mechanism: a change to either changes what
    # this job asserts about the estate, so it re-proves itself the same way a change to the workflow
    # does. `service-ci.yml` is here because the scope step runs THAT file's derivation rather than a
    # copy of it — see "ONE DERIVATION" below — so editing it changes this job's answer too.
    paths:
      - '.github/workflows/estate-ci.yml'
      - '.github/workflows/service-ci.yml'
      - 'tools/estate-scopes.mjs'
      - 'tools/estate-topics.mjs'
      - 'tools/estate-topic-gaps.json'
  pull_request:
    paths:
      - '.github/workflows/estate-ci.yml'
      - '.github/workflows/service-ci.yml'
      - 'tools/estate-scopes.mjs'
      - 'tools/estate-topics.mjs'
      - 'tools/estate-topic-gaps.json'
  workflow_call:
    secrets:
      estate_token:
        description: >-
          A token with `contents:read` on every `micro-*` repository, and metadata read on the
          organisation so the repository list can be derived rather than written down. Falls back to
          this repository's own ESTATE_READ_TOKEN when the workflow runs in micro-org.
        required: false

# One sweep at a time. Two concurrent runs would answer the same question about the same estate and
# race each other for the issue below.
concurrency:
  group: estate-ci
  cancel-in-progress: false

jobs:
  # ONE JOB, ONE CHECKOUT, THREE INVARIANTS. Cloning the estate takes six seconds and three jobs
  # would clone it three times to answer three questions about the same bytes. More than the waste,
  # three checkouts are three chances to disagree about what "the estate" was at that moment.
  estate-invariants:
    name: The invariants that belong to the estate and to no repository in it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # For the issue that gives a nightly red an owner. A caller that does not grant this gets a
      # warning and a red job, never a silently missing issue.
      issues: write
    env:
      OWNER: cloudsforge-online
      ESTATE: ${{ github.workspace }}/estate
      # Below the 55 `micro-*` repositories that exist, far above any accidental subset — the same
      # reasoning as MIN_SERVICES, applied one layer earlier so a token that can see only two
      # repositories fails HERE, with a message that names the cause, rather than as "the sweep read
      # a partial checkout".
      MIN_REPOS: 45
    steps:
      # ────────────────────────────────────────────────────────────────────────────────────────────
      # The estate, derived and cloned. THE LIST IS NOT WRITTEN DOWN — see the header.
      #
      # Directories are named WITHOUT the `micro-` prefix, which is not cosmetic: the sweep's only
      # exclusion is `DEFAULT_EXCLUDED = ['conformance']`, and it matches on the directory name. A
      # checkout at `micro-conformance/` would put CANONICAL_ACCOUNTS — the chart itself, twenty
      # `{ subject, purpose, type }` literals — into the sweep as claims by a service that has never
      # posted a ledger entry, and manufacture disagreements out of the answer key. It also makes the
      # layout identical to a developer's own `cloudsforge-micro/`, so the command below is the same
      # command a human runs locally.
      # ────────────────────────────────────────────────────────────────────────────────────────────
      - name: Clone the estate
        env:
          GH_TOKEN: ${{ secrets.estate_token || secrets.ESTATE_READ_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::no estate token, so this job can see two repositories and would certify the estate from them"
            echo "Pass secrets.estate_token, or set ESTATE_READ_TOKEN on this repository."
            exit 1
          fi
          mkdir -p "$ESTATE"

          repos=$(gh api --paginate "orgs/${OWNER}/repos?per_page=100" \
                    --jq '.[] | select(.archived == false) | select(.name | startswith("micro-")) | .name' || true)
          printf '%s\n' "$repos" | sed '/^$/d' > "$RUNNER_TEMP/repos.txt"
          listed=$(grep -c . "$RUNNER_TEMP/repos.txt" || true)
          listed=${listed:-0}
          echo "the organisation lists ${listed} unarchived micro-* repositories"
          if [ "$listed" -lt "$MIN_REPOS" ]; then
            echo "::error::only ${listed} repositories listed, expected at least ${MIN_REPOS}"
            echo "The token cannot see the organisation. A sweep of what it CAN see would report"
            echo "'no disagreements' and be worthless — see MIN_SERVICES in ledgeraccounts.ts."
            exit 1
          fi

          # The token goes into git's config once, rather than into ~55 command lines and the logs
          # that quote them.
          git config --global "url.https://x-access-token:${GH_TOKEN}@github.com/.insteadOf" https://github.com/

          clone_one() {
            name="$1"
            dir="${ESTATE}/${name#micro-}"
            if git clone --depth 1 --single-branch --quiet "https://github.com/${OWNER}/${name}.git" "$dir" \
                 2>"${RUNNER_TEMP}/${name}.err"; then
              echo "ok       ${name}"
            else
              echo "FAILED   ${name}"
              sed 's/^/             /' "${RUNNER_TEMP}/${name}.err"
            fi
          }
          export -f clone_one
          export ESTATE OWNER RUNNER_TEMP
          # -P 8: the estate is ~150 MB at depth 1, most of it three asset repositories. Serial, that
          # is minutes of a job whose real work takes seconds.
          xargs -P 8 -I {} bash -c 'clone_one "$@"' _ {} < "$RUNNER_TEMP/repos.txt" \
            | sort | tee "$RUNNER_TEMP/clone.log"

          # A clone that failed is FATAL, never skipped. The sweep cannot tell "this repository holds
          # no account literals" from "this repository was not there", and the second one silently
          # subtracts from the denominator of every green result this job will ever print.
          failures=$(grep '^FAILED' "$RUNNER_TEMP/clone.log" || true)
          if [ -n "$failures" ]; then
            echo "::error::a repository in the estate could not be cloned, so the sweep would be partial"
            printf '%s\n' "$failures"
            exit 1
          fi

          cloned=$(ls -1 "$ESTATE" | grep -c . || true)
          cloned=${cloned:-0}
          echo "cloned ${cloned} repositories into ${ESTATE}"
          [ "$cloned" -ge "$MIN_REPOS" ] || { echo "::error::only ${cloned} checkouts on disk"; exit 1; }

      # The checker is `micro-conformance`, which the loop above has already cloned as
      # `estate/conformance` — the same directory the sweep then excludes from its own reading. No
      # special case, and no second copy of the checker to drift from the first.
      - uses: pnpm/action-setup@v4
        with:
          # Pinned for the same reason service-ci.yml pins it: there is no package.json in the
          # working directory for pnpm/action-setup to read a packageManager field out of.
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: estate/conformance/pnpm-lock.yaml
      - name: Install the checker
        working-directory: estate/conformance
        run: pnpm install --frozen-lockfile

      # ────────────────────────────────────────────────────────────────────────────────────────────
      # THE CHECKERS FOR THE OTHER TWO INVARIANTS, AT THE REVISION UNDER TEST.
      #
      # They live in `micro-org/tools/` rather than in micro-conformance, which owns the ledger sweep,
      # for one reason: at the time of writing micro-conformance belongs to another agent, and this
      # repository is the one I can change. `tools/compat.ts` and `tools/cfctl.ts` are estate-wide
      # checkers living here already, so it is not a new idea — but if conformance later adopts them,
      # this step is the only thing that changes.
      #
      # The subtlety worth the two steps below: the estate clone ABOVE already contains micro-org, as
      # `estate/org`, cloned from main. Running the checkers from there would mean that a pull request
      # changing a checker was graded by main's copy of it — a workflow that cannot test its own
      # change, which is the "check that cannot fail" shape all over again. So when this job runs in
      # micro-org it checks itself out at this run's ref and uses THAT. A `workflow_call` from another
      # repository cannot pin a ref in this one, so it gets main and is told so.
      # ────────────────────────────────────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4
        if: github.repository == 'cloudsforge-online/micro-org'
        with: { path: self }
      - name: Say which copy of the checkers is about to run
        run: |
          set -uo pipefail
          if [ -f "${GITHUB_WORKSPACE}/self/tools/estate-topics.mjs" ]; then
            echo "TOOLS=${GITHUB_WORKSPACE}/self" >> "$GITHUB_ENV"
            echo "checkers: this run's own ref (${GITHUB_SHA}) — a change to one is graded by itself"
          elif [ -f "${ESTATE}/org/tools/estate-topics.mjs" ]; then
            echo "TOOLS=${ESTATE}/org" >> "$GITHUB_ENV"
            echo "::warning::called from another repository, so the checkers are micro-org's main, not this run's ref"
          else
            echo "::error::no copy of the estate checkers anywhere — micro-org was not cloned and not checked out"
            exit 1
          fi

      # ────────────────────────────────────────────────────────────────────────────────────────────
      # ONE DERIVATION, NOT TWO.
      #
      # The scope step needs the union of every scope every gate demands. service-ci.yml already
      # derives that for a single repository, and it took three attempts to get right — inline
      # literals, sibling constants, wrapper third arguments, computed families, each shape missed by
      # a different earlier sweep. A second implementation here would drift from that one, and the
      # drift would be invisible: this step's verdicts are all of the form "NOTHING demands this
      # scope", which is exactly the sentence a derivation that quietly stopped seeing a demand shape
      # produces. So the script is extracted from service-ci.yml and run as-is, 55 times.
      #
      # If the heredoc markers ever move, this fails here with a message naming the cause, rather than
      # thirty steps later as "the registry is full of dead scopes".
      # ────────────────────────────────────────────────────────────────────────────────────────────
      - name: Take the scope derivation out of service-ci.yml
        run: |
          set -uo pipefail
          src="${TOOLS}/.github/workflows/service-ci.yml"
          out="${RUNNER_TEMP}/scope-audit.mjs"
          if [ ! -f "$src" ]; then
            echo "::error::no service-ci.yml at ${src}"
            exit 1
          fi
          awk "/<<'SCOPE_AUDIT_SCRIPT'/{f=1;next} /^ *SCOPE_AUDIT_SCRIPT\$/{f=0} f" "$src" \
            | sed 's/^          //' > "$out"
          lines=$(grep -c . "$out" || true)
          lines=${lines:-0}
          if [ "$lines" -lt 200 ]; then
            echo "::error::extracted ${lines} lines of scope audit from service-ci.yml, expected the whole script"
            echo "The heredoc markers (<<'SCOPE_AUDIT_SCRIPT' … SCOPE_AUDIT_SCRIPT) have moved or been renamed."
            echo "Fix the extraction — do NOT copy the script here, or the two derivations will drift."
            exit 1
          fi
          if ! node --check "$out"; then
            echo "::error::the extracted scope audit is not valid JavaScript — the de-indentation is wrong"
            exit 1
          fi
          grep -q 'scope-audit: ok' "$out" || {
            echo "::error::the extracted script does not look like the scope audit"
            exit 1
          }
          echo "ok: ${lines} lines of service-ci.yml's own derivation, parsed"

      # ────────────────────────────────────────────────────────────────────────────────────────────
      # THE CANARY. It runs before the verdict, on every run, and it is why a green from this job
      # means something.
      #
      # A known-bad account type — the exact defect found in worlds, emberkin and settlement — is
      # written into the checked-out estate, and the job fails unless the sweep goes red AND says the
      # injected file's name. Grading on the exit code alone would accept a red produced by a broken
      # checkout, an unresolvable import or a missing subcommand, which is to say it would accept
      # every way this job can quietly stop measuring the estate.
      #
      # The write is asserted before, and the deletion asserted after: this estate has already had a
      # canary that graded a file it never changed.
      # ────────────────────────────────────────────────────────────────────────────────────────────
      - name: The canary — this job can still go red
        working-directory: estate/conformance
        run: |
          set -uo pipefail
          canary="${ESTATE}/ledger/src/__estate_ci_canary.ts"
          if [ ! -d "${ESTATE}/ledger/src" ]; then
            echo "::error::micro-ledger has no src/ in this checkout, so the canary cannot be planted"
            exit 1
          fi
          cat > "$canary" <<'CANARY'
          // Written by estate-ci and deleted a few lines later. It is the defect found in
          // micro-worlds, micro-emberkin and micro-settlement: platform fee income debited as an
          // expense against the `revenue` six other services credit. If the sweep does not see this,
          // the sweep is not seeing the estate either.
          export const canary = { subject: 'platform', assetCode: 'EMBER', purpose: 'fees', type: 'expense' }
          CANARY
          if [ ! -s "$canary" ]; then
            echo "::error::the canary file was not written — a canary that grades an unchanged tree grades nothing"
            exit 1
          fi

          set +e
          node --import tsx src/cli.ts ledger-accounts --estate .. > "$RUNNER_TEMP/canary.txt" 2>&1
          code=$?
          set -e
          rm -f "$canary"
          if [ -e "$canary" ]; then
            echo "::error::the canary survived, so the real sweep below would judge a tree this job broke"
            exit 1
          fi

          if [ "$code" -eq 0 ]; then
            echo "::error::the sweep stayed GREEN with a known-bad account type injected — it is measuring nothing"
            cat "$RUNNER_TEMP/canary.txt"
            exit 1
          fi
          if ! grep -q '__estate_ci_canary.ts' "$RUNNER_TEMP/canary.txt"; then
            echo "::error::the sweep exited ${code} but never named the injected file — it went red for another reason"
            echo "A red for the wrong reason is how a check stops measuring what it claims to."
            cat "$RUNNER_TEMP/canary.txt"
            exit 1
          fi
          echo "ok: the sweep exited ${code} and named the injected account — the gate can fail"

      # `always()` so the estate still gets a verdict when the canary is what broke. The two answers
      # are different questions — "does the machinery work" and "does the estate agree" — and a run
      # that reports only the first is a run that hides the second.
      - name: The estate agrees on every ledger account type it states
        if: always()
        working-directory: estate/conformance
        run: |
          set -uo pipefail
          node --import tsx src/cli.ts ledger-accounts --estate .. 2>&1 | tee "$RUNNER_TEMP/report.txt"
          exit "${PIPESTATUS[0]}"

      # ════════════════════════════════════════════════════════════════════════════════════════════
      # INVARIANT 2 — THE SCOPE REGISTRY IS TOTAL.
      #
      # service-ci.yml proves DEMANDS ⊆ REGISTRY, one repository at a time, and that half is already
      # gated: a gate asking for a scope `@cloudsforge/contracts-auth` does not name fails that
      # repository's build, because identity refuses to mint an unknown scope (identity/src/env.ts:141).
      #
      # REGISTRY ⊆ DEMANDS is the half no repository can reach. From inside micro-pricing, a
      # registered scope nothing in micro-pricing demands is indistinguishable from one micro-wallet
      # enforces; fifty-five green builds say nothing about it. What it actually is, is a credential
      # identity will mint that opens nothing — and worse than useless, because the security review
      # that reads the registry to answer "what could a caller with this token do" gets a wrong
      # answer. contracts states the gap itself, above `isDeprecatedScope`: "Nothing proves the other
      # direction, because no checkout sees every gate."
      #
      # This is that checkout. The 2026-08-03 audit that found `notify:send` and `wallet:provision`
      # found them by hand; this is the same search, run nightly, by machine.
      # ════════════════════════════════════════════════════════════════════════════════════════════
      - name: The canary — the scope sweep can still go red, in both directions
        if: always()
        run: |
          set -uo pipefail
          registry="${ESTATE}/contracts/packages/auth/src/index.ts"
          gate="${ESTATE}/beacon/src/__estate_ci_scope_canary.ts"
          if [ ! -f "$registry" ]; then
            echo "::error::no scope registry in this checkout, so the canary cannot be planted"
            exit 1
          fi
          if [ ! -d "${ESTATE}/beacon/src" ]; then
            echo "::error::micro-beacon has no src/ here, so the demand half of the canary cannot be planted"
            exit 1
          fi
          if ! grep -q "'notify:send'" "$registry" || ! grep -q 'deprecated' "$registry"; then
            echo "::error::this canary demands a scope the registry marks deprecated, and notify:send is no longer one"
            echo "Pick another deprecated scope, or — if none is left — the second half of this canary"
            echo "has nothing to test and should be deleted deliberately rather than left to pass emptily."
            exit 1
          fi
          cp "$registry" "${RUNNER_TEMP}/auth-index.orig"

          # (a) a registered scope no gate demands — the direction only this checkout can see.
          # `sed -i` is deliberately not used: it means two different things on the two platforms this
          # step is run on — a runner and a developer's laptop reproducing a red — and the BSD form
          # would silently write a backup file into the estate under test.
          sed "s|^export const SCOPES = Object.freeze({|&\n  'canary:orphan': Object.freeze({ service: 'canary', description: 'Injected by estate-ci and removed four lines later.' }),|" \
            "${RUNNER_TEMP}/auth-index.orig" > "$registry"
          # (b) a gate demanding a scope the registry says is dead — the self-emptying direction.
          # The body is written at this file's own indentation ON PURPOSE: the YAML block scalar
          # strips exactly this much, so the file lands at column zero. Several checks in this estate
          # anchor on `^export`, and a heredoc indented one level further produces a file none of
          # them can see — a canary that plants something invisible grades nothing.
          cat > "$gate" <<'GATE'
          export function estateCiCanaryGate(principal: { readonly scopes: readonly string[] }): boolean {
          return principal.scopes.includes('notify:send')
          }
          GATE

          if ! grep -q 'canary:orphan' "$registry" || [ ! -s "$gate" ]; then
            echo "::error::the injections were not written — a canary that grades an unchanged tree grades nothing"
            exit 1
          fi

          set +e
          node "${TOOLS}/tools/estate-scopes.mjs" "$ESTATE" "${RUNNER_TEMP}/scope-audit.mjs" \
            > "${RUNNER_TEMP}/scope-canary.txt" 2>&1
          code=$?
          set -e
          cp "${RUNNER_TEMP}/auth-index.orig" "$registry"
          rm -f "$gate"
          if grep -q 'canary:orphan' "$registry" || [ -e "$gate" ]; then
            echo "::error::an injection survived, so the real sweep below would judge a tree this job broke"
            exit 1
          fi

          if [ "$code" -eq 0 ]; then
            echo "::error::the sweep stayed GREEN with a dead scope registered AND a dead scope demanded — it is measuring nothing"
            cat "${RUNNER_TEMP}/scope-canary.txt"
            exit 1
          fi
          # Exit code alone is not a grade: a partial checkout, an unreadable registry and a missing
          # node all exit non-zero. The sweep must NAME both things it was given.
          missed=0
          grep -q 'canary:orphan' "${RUNNER_TEMP}/scope-canary.txt" || { echo "::error::red, but never named the injected orphan scope"; missed=1; }
          grep -q '__estate_ci_scope_canary.ts' "${RUNNER_TEMP}/scope-canary.txt" || { echo "::error::red, but never named the injected gate demanding a deprecated scope"; missed=1; }
          if [ "$missed" -ne 0 ]; then
            echo "A red for the wrong reason is how a check stops measuring what it claims to."
            cat "${RUNNER_TEMP}/scope-canary.txt"
            exit 1
          fi
          echo "ok: the sweep exited ${code} and named both injections — this gate can fail in both directions"

      # `always()`, like the ledger verdict above and for the same reason, plus one this file did not
      # have before: THREE INVARIANTS, THREE ANSWERS, EVERY RUN. A disagreement about ledger account
      # types must not stop the estate being asked about its scopes — the two have nothing to do with
      # each other, they are read from one checkout only because cloning it twice would be silly, and
      # a run that reports the first failure and stops turns "the estate is wrong in three ways" into
      # three nights of work instead of one.
      - name: Every registered scope is demanded by a gate somewhere in the estate
        if: always()
        run: |
          set -uo pipefail
          node "${TOOLS}/tools/estate-scopes.mjs" "$ESTATE" "${RUNNER_TEMP}/scope-audit.mjs" 2>&1 \
            | tee "${RUNNER_TEMP}/scopes.txt"
          exit "${PIPESTATUS[0]}"

      # ════════════════════════════════════════════════════════════════════════════════════════════
      # INVARIANT 3 — THE TOPIC REGISTRY DESCRIBES WHAT SERVICES ACTUALLY SEND.
      #
      # `identity/src/topics.ts` and `notify/src/topics.ts` each reconcile their own source against
      # the shared registry, in both directions, with a self-emptying quarantine. They are the right
      # pattern and they share one blind spot: the REGISTRY is not the estate. Every one of those
      # checks answers "does this repository agree with the registry", and none can answer "does the
      # registry agree with the twenty repositories that emit".
      #
      # That gap is not theoretical here. notify held fifteen rules naming topics no producer emits;
      # eleven had a producer emitting a DIFFERENT name — `trade.bot.triggered` is really
      # created/started/paused, `market.offer.received` is `market.offer.made`,
      # `devplatform.apikey.created` is `devplatform.key.issued`. Each of those was one grep away in
      # another repository, and no CI job in the estate had both repositories on disk.
      #
      # REACHABILITY IS PART OF IT, and it belongs here rather than only in identity. `emitSessionRevoked`
      # was written, correct, registered, consumed by a CRITICAL notify rule — and called by nothing,
      # so the rule could never fire. Every name-based check passed, because the name was right. A
      # guard that proves a topic's spelling proves nothing about whether the emit is reached, and the
      # nineteen producers that never wrote identity's `unreferencedEmitters` have no such guard at
      # all. This step runs it against all of them. (Identity's first version of that check passed
      # while the function was still dead, because its own prose naming the function counted as a
      # reference. Comments are stripped here before anything is matched, and the checker's header
      # says so at the stripper.)
      # ════════════════════════════════════════════════════════════════════════════════════════════
      # THE THIRD INJECTION BELOW IS A REGRESSION TEST FOR THIS CHECKER, NOT FOR THE ESTATE.
      #
      # Direction 4 — "a record whose premise expired" — read the record structures with
      # `/'([a-z0-9_.]+)'/`, which needs the quotes to touch the name. notify recorded
      # `emits: 'trade.bot.created, trade.bot.started, trade.bot.paused'`, one literal naming three
      # topics trade really emits, and the comma meant it matched nothing: no members, no question
      # asked, and the sweep printed "everything else reconciles". A stale record hid behind that for
      # weeks, beside an identical record that happened to name one topic and was caught at once.
      #
      # That is this estate's signature defect — a check that cannot fail — living inside the check
      # written to catch it, and NO exit-code grading finds it, because the sweep was red the whole
      # time for other reasons. Only an injection whose absence from the output is the failure does.
      # So three shapes are planted in one record structure and all four names must be NAMED, each
      # on a line citing the injected file: a comma-joined list, a resolved constant (the shape every
      # producer already uses for its own emits) and a double-quoted literal (the scan saw one of
      # JavaScript's three quote styles). If any is skipped in silence again, this step is red.
      - name: The canary — the topic sweep can still go red, by name, by reachability and by record
        if: always()
        run: |
          set -uo pipefail
          registry="${ESTATE}/contracts/packages/events/src/index.ts"
          emitter="${ESTATE}/identity/src/__estate_ci_topic_canary.ts"
          record="${ESTATE}/notify/src/__estate_ci_record_canary.ts"
          if [ ! -f "$registry" ] || [ ! -d "${ESTATE}/identity/src" ]; then
            echo "::error::the events registry or micro-identity is missing from this checkout — the canary cannot be planted"
            exit 1
          fi
          if [ ! -d "${ESTATE}/notify/src" ]; then
            echo "::error::micro-notify has no src/ here, so the record half of the canary cannot be planted"
            exit 1
          fi
          cp "$registry" "${RUNNER_TEMP}/events-index.orig"

          # (a) a registered topic whose producer never emits it — identity.user.registered's defect,
          #     which cost the estate "your account was created" for the life of the service.
          sed "s|^export const TOPICS = Object.freeze({|&\n  'canary.estate.injected': Object.freeze({ producer: 'identity', payloadType: 'CanaryInjected', version: '1.0', keyedBy: 'user_id', description: 'Injected by estate-ci and removed a few lines later.' }),|" \
            "${RUNNER_TEMP}/events-index.orig" > "$registry"
          # (b) an emitter nothing calls — emitSessionRevoked's defect. The topic is real and spelled
          #     correctly ON PURPOSE: that is what makes it invisible to every name-based check.
          cat > "$emitter" <<'EMITTER'
          export function emitEstateCiCanary(emit: (event: { topic: string; key: string; payload: Record<string, unknown> }) => void): void {
          emit({ topic: 'identity.session.created', key: 'canary', payload: {} })
          }
          EMITTER
          # (c) a record structure saying three facts are unproduced, in the three shapes direction 4
          #     could not read. Every topic named here is one a live producer really emits, so each
          #     is a genuine stale record and direction 4 owes an answer about all four. None is in
          #     tools/estate-topic-gaps.json, so none can be absorbed as a recorded gap and pass.
          cat > "$record" <<'RECORD'
          const ESTATE_CI_CANARY_TOPIC = 'market.listing.sold'
          export const UNPRODUCED_NOTIFICATIONS = [
          { requirement: 'estate-ci canary, a comma-joined list', emits: 'identity.session.created, ledger.entry.posted' },
          { requirement: 'estate-ci canary, a resolved constant', emits: ESTATE_CI_CANARY_TOPIC },
          { requirement: 'estate-ci canary, a double-quoted literal', emits: "wallet.deposit.confirmed" },
          ]
          RECORD

          if ! grep -q 'canary.estate.injected' "$registry" || [ ! -s "$emitter" ] || [ ! -s "$record" ]; then
            echo "::error::the injections were not written — a canary that grades an unchanged tree grades nothing"
            exit 1
          fi

          set +e
          node "${TOOLS}/tools/estate-topics.mjs" "$ESTATE" "${TOOLS}/tools/estate-topic-gaps.json" \
            > "${RUNNER_TEMP}/topic-canary.txt" 2>&1
          code=$?
          set -e
          cp "${RUNNER_TEMP}/events-index.orig" "$registry"
          rm -f "$emitter" "$record"
          if grep -q 'canary.estate.injected' "$registry" || [ -e "$emitter" ] || [ -e "$record" ]; then
            echo "::error::an injection survived, so the real sweep below would judge a tree this job broke"
            exit 1
          fi

          if [ "$code" -eq 0 ]; then
            echo "::error::the sweep stayed GREEN with an unemitted registered topic, a dead emitter AND three stale records — it is measuring nothing"
            cat "${RUNNER_TEMP}/topic-canary.txt"
            exit 1
          fi
          missed=0
          grep -q 'canary.estate.injected' "${RUNNER_TEMP}/topic-canary.txt" || { echo "::error::red, but never named the injected registered-and-unemitted topic"; missed=1; }
          grep -q 'emitEstateCiCanary' "${RUNNER_TEMP}/topic-canary.txt" || { echo "::error::red, but never named the injected emitter that nothing calls"; missed=1; }
          # Each of the four must be named ON A LINE CITING THE INJECTED FILE. A bare name is not a
          # grade: `ledger.entry.posted` is quoted in a recorded gap's own evidence and would match a
          # run in which direction 4 read nothing at all.
          for topic in identity.session.created ledger.entry.posted market.listing.sold wallet.deposit.confirmed; do
            grep -q "${topic}: notify records at notify/src/__estate_ci_record_canary.ts" "${RUNNER_TEMP}/topic-canary.txt" \
              || { echo "::error::red, but direction 4 never named ${topic} from the injected record — it skipped a shape in silence"; missed=1; }
          done
          if [ "$missed" -ne 0 ]; then
            echo "A red for the wrong reason is how a check stops measuring what it claims to."
            cat "${RUNNER_TEMP}/topic-canary.txt"
            exit 1
          fi
          echo "ok: the sweep exited ${code} and named every injection — names, reachability AND the record structures are being measured"

      - name: The registry, the producers and the consumers agree about the bus
        if: always()
        run: |
          set -uo pipefail
          node "${TOOLS}/tools/estate-topics.mjs" "$ESTATE" "${TOOLS}/tools/estate-topic-gaps.json" 2>&1 \
            | tee "${RUNNER_TEMP}/topics.txt"
          exit "${PIPESTATUS[0]}"

      # ────────────────────────────────────────────────────────────────────────────────────────────
      # A red with an owner. See "WHERE A FAILURE LANDS" in the header: without this, the schedule's
      # entire output is a run record that ages out and an email nobody is on.
      #
      # Only on `schedule` and `push`. A pull request already reports to its author on the pull
      # request itself, and filing an issue per pull-request run is how a label becomes noise.
      # ────────────────────────────────────────────────────────────────────────────────────────────
      - name: File the failure against somebody
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # Each invariant's own report, whether or not it was the one that failed. A green report
          # beside a red one is what says which of the three is broken, and a run that pasted only
          # the failure would send the reader back to the log to find out.
          {
            echo "\`estate-ci\` failed: <${RUN_URL}>"
            echo
            echo "One of the invariants that belongs to the estate and to no repository in it is broken,"
            echo "or a sweep that reads them did. Nothing here is visible to any single repository's CI."
            echo
            echo "### Ledger account types"
            echo
            echo "Two services naming one \`(subject, asset_code, purpose)\` with two \`type\`s means the"
            echo "second to post in production has **every** entry refused — \`AccountConflictError\`,"
            echo "\`ledger/src/accounts.ts:125\`."
            echo
            echo '```'
            tail -c 30000 "$RUNNER_TEMP/report.txt" 2>/dev/null || echo "(no report — the step did not get that far, read the run)"
            echo '```'
            echo
            echo "### Scope registry totality"
            echo
            echo "A live scope no gate demands is a credential identity mints that opens nothing; a"
            echo "deprecated scope some gate demands is a registry statement that has stopped being true."
            echo
            echo '```'
            tail -c 30000 "$RUNNER_TEMP/scopes.txt" 2>/dev/null || echo "(no report — the step did not get that far, read the run)"
            echo '```'
            echo
            echo "### Topic registry reconciliation"
            echo
            echo "A registered topic no producer emits is a feature that reports itself as delivered."
            echo "So is an emitter nothing calls — that one was \`emitSessionRevoked\`, under a **critical**"
            echo "notify rule, for the life of the service."
            echo
            echo '```'
            tail -c 30000 "$RUNNER_TEMP/topics.txt" 2>/dev/null || echo "(no report — the step did not get that far, read the run)"
            echo '```'
          } > "$RUNNER_TEMP/issue.md"

          gh label create estate-invariant --repo "$REPO" --color B60205 \
            --description "An invariant that spans repositories, so no single repository's CI can see it" \
            --force > /dev/null 2>&1 || true

          open=$(gh issue list --repo "$REPO" --state open --label estate-invariant \
                   --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$REPO" --body-file "$RUNNER_TEMP/issue.md" \
              || echo "::warning::could not comment on issue #${open} — is issues:write granted?"
            echo "updated issue #${open}"
          else
            gh issue create --repo "$REPO" --label estate-invariant \
              --title "estate-ci: an invariant no repository can see is broken" \
              --body-file "$RUNNER_TEMP/issue.md" \
              || echo "::warning::could not open an issue — is issues:write granted?"
          fi

      - name: Close it when the estate agrees again
        if: success() && (github.event_name == 'schedule' || github.event_name == 'push')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          open=$(gh issue list --repo "$REPO" --state open --label estate-invariant \
                   --json number --jq '.[0].number // empty' 2>/dev/null || true)
          [ -n "$open" ] || { echo "ok: nothing open"; exit 0; }
          gh issue close "$open" --repo "$REPO" \
            --comment "The sweep is green again: <${RUN_URL}>" \
            || echo "::warning::could not close issue #${open}"

      # ────────────────────────────────────────────────────────────────────────────────────────────
      # WHAT A FOURTH INVARIANT WOULD COST, WRITTEN DOWN WHILE IT IS FRESH.
      #
      # Three steps, one checkout, one canary each. Adding a fourth is: a checker in `tools/`, a
      # canary that injects a violation and requires the sweep to NAME it, a verdict step with
      # `if: always()`, its report in the issue body, and its file in the `paths:` filter at the top
      # so a change to it re-proves itself. Nothing else in this file needs to change.
      #
      # The one found while writing the third, and deliberately NOT added here, so that it is not
      # lost: several services stamp the envelope's wire `version` as an INTEGER (`values (…, 1, …)`,
      # ledger/src/entries.ts:426 and its siblings) where `@cloudsforge/contracts-events` requires
      # `"major.minor"`. Those events are refused at the envelope and never delivered. It is a real
      # defect and it is NOT estate-wide: a producer's own repository depends on contracts-events and
      # can check its own outbox writes against it without seeing another repository at all. It
      # belongs in service-ci.yml or in each producer's suite, and putting it here would make this
      # job the place where per-repository checks are dumped — which is how an estate-wide gate
      # becomes a nightly red about somebody else's file.
      # ────────────────────────────────────────────────────────────────────────────────────────────
