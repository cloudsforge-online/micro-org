name: CI

# This repository's own CI. It cannot call service-ci.yml — it is not a service, it has no image
# and no database — so it is the one repository allowed a file of its own. `cfctl doctor` knows:
# the bespoke-CI check applies to kinds service, web, ops and library, and micro-org is 'org'.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: The machinery works
    runs-on: ubuntu-latest
    # CHECKED OUT AS `org`, NOT AS `micro-org`, AND THE NAME IS LOAD-BEARING.
    #
    # `cfctl` resolves every repository as a SIBLING NAMED BY ITS LOCAL NAME — `repoDir` is
    # `microRoot()/<row.name>` (tools/cfctl.ts) and `microRoot()` is the checkout's parent
    # (:69-72). GitHub's default layout is `/home/runner/work/micro-org/micro-org`, so the parent
    # held one directory called `micro-org`, which is a remote name and matches no registry row.
    # `doctor` correctly reported it as a repository on this disk that the registry does not name,
    # and failed — for a checkout layout, not for anything wrong with the estate.
    #
    # It had never been seen, because `pnpm test` failed first and the step never ran. When the
    # suite went green the step behind it went red the same hour.
    #
    # The fix gives the tool the layout it is written for rather than teaching the tool that
    # `micro-org` means `org`, which would make a genuinely unregistered checkout pass under any
    # name carrying the prefix. In this layout `doctor` audits a real estate that happens to have
    # one repository present, so a registry that lost its own `org` row still fails here.
    defaults:
      run:
        working-directory: org
    steps:
      - uses: actions/checkout@v4
        with: { path: org }
      - uses: pnpm/action-setup@v4
        with:
          # Pinned for the same reason service-ci.yml pins it (:163-169): package.json is in org/
          # now, and pnpm/action-setup looks in the working directory for the packageManager field.
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: org/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The compatibility checker is the only thing standing between an edited contract and a
      # runtime failure in a repository whose CI never sees the change. Its fixture pairs are the
      # specification of what 'additive' means.
      - run: pnpm test

      # The output is NOT sent to /dev/null. It used to be, and that is why this step failed with
      # exit 1 and not one line saying what it had found — a check whose failure carries no
      # diagnosis costs more than it saves, and this one cost an hour.
      - name: The tools run
        run: |
          set -euo pipefail
          node --import tsx tools/cfctl.ts list
          node --import tsx tools/cfctl.ts doctor
          echo "ok: cfctl list and doctor run"

      # A reusable workflow that does not parse is discovered by the repository that calls it,
      # which is the worst place to discover it: somebody else's red build, for a change they did
      # not make.
      - name: Every reusable workflow parses
        run: |
          set -euo pipefail
          for file in .github/workflows/*.yml; do
            docker run --rm -v "$PWD:/w" -w /w mikefarah/yq:4 '.' "$file" > /dev/null
            echo "ok: $file"
          done

      # Renovate reads this file on behalf of forty-three repositories. A preset that does not
      # parse means every one of them silently stops receiving contract bumps — the first
      # measured mitigation failing with no alarm attached to it.
      - name: The Renovate preset is valid JSON
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("renovate.json","utf8"))'
          echo "ok: renovate.json parses"

  hygiene:
    uses: ./.github/workflows/secret-hygiene.yml
    with:
      require-dockerignore: false
    permissions:
      contents: read
