name: web-ci

# The one CI file for every CloudsForge frontend.
#
# The check that matters here is the last one. The estate resolves API hosts at runtime from
# window.location, so a single image serves local, staging and production. That property is worth
# defending explicitly because it is trivially easy to lose — `import.meta.env.VITE_API_URL` is
# what every Vite tutorial reaches for — and expensive to get back.
#
# What is lost with it: the release manifest can no longer pin one image per frontend, because
# there is no longer one image. Promotion from staging to production stops being promotion and
# becomes a rebuild, which means the artifact that was tested is not the artifact that ships.

on:
  workflow_call:
    inputs:
      app:
        description: The frontend name, as in the registry — 'hub-web', 'site'.
        required: true
        type: string
      node-version:
        required: false
        default: '22'
        type: string
      package-manager:
        required: false
        default: pnpm
        type: string
      source-dir:
        required: false
        default: src
        type: string
      dockerfile:
        required: false
        default: Dockerfile
        type: string
      build-image:
        required: false
        default: true
        type: boolean
      base-path:
        description: >-
          Where this bundle is mounted INSIDE ITS OWN CONTAINER, when it is a folder on the apex
          rather than a surface with its own hostname — '/agora', '/market'. Empty for a surface
          that owns a hostname, which is the default and stays correct for every caller that has
          not moved.

          It is not cosmetic. `docs/apex-consolidation.md` bakes the mount in at build time
          (vite's `base:`) and serves it from an nginx whose every `location` carries it, so a
          mounted container answers `GET /` with a 404 — CORRECTLY — and this workflow's readiness
          loop would wait twenty seconds and then report a healthy image as a dead one.

          `deep-link-path` stays a ROUTER path and is prefixed with this, matching how each of
          those repositories separates the two in its own `routes.ts`. Do not write the mount into
          both: '/agora' plus '/agora/circles' probes '/agora/agora/circles'.
        required: false
        default: ''
        type: string
      deep-link-path:
        description: >-
          A route the app really has, checked to return 200 on a hard refresh — '/portfolio',
          '/products/create'. Leave empty to skip that half; the unknown-path 404 check always runs.
          It must be a REAL route: the check this replaced used an invented path and required 200,
          which is the opposite of the estate's honest-404 rule and could not be satisfied together
          with it.
        required: false
        default: ''
        type: string
    secrets:
      estate_token:
        description: >-
          A token with `contents:read` on micro-ui, so this workflow can check the design system out
          as a sibling. A caller passes it with an explicit `secrets:` block. Falls back to the job
          token, which succeeds only if micro-ui is public.
        required: false

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    # ────────────────────────────────────────────────────────────────────────────────────────────
    # THE APP AND THE DESIGN SYSTEM ARE SIBLINGS, because @cloudsforge/ui is resolved by
    # `link:../ui/packages/ui`, not by a registry.
    #
    # THIS IS WHY THIS WORKFLOW HAD NO CALLERS AT ALL. Every frontend in the estate — hub-web, site,
    # mint-web, market-web, trade-web, worlds-web, emberkin-web, explorer-web, devportal-web,
    # network-site, admin-web, foresight-web and web-template — consumes the
    # design system as `link:../ui/packages/ui`, and this workflow did ONE checkout and then
    # `pnpm install --frozen-lockfile`. A `link:` specifier is a symlink to a path: with no sibling
    # on disk it installs as a DANGLING link that resolves to nothing, so `Install` passes and
    # `Typecheck` then cannot find a single @cloudsforge/ui export. Not one frontend could have gone
    # green here, so each kept a bespoke copy and left a commented-out `uses:` behind saying it was
    # waiting for the design system to be published. Thirteen repositories were each carrying
    # 200-900 lines of CI over one missing checkout.
    #
    # It is the identical defect service-ci.yml was fixed for, and it takes the identical fix: the
    # app goes in `app/`, the design system beside it, and the SIBLING IS INSTALLED FIRST, because
    # `link:` resolves to the sibling's own node_modules, which must therefore already exist.
    #
    # The scoped GitHub Packages registry below is left in place and is still the clean end state.
    # It is unreachable today: the npm scope is @cloudsforge and the GitHub org is
    # cloudsforge-online, and GitHub Packages will only host a scope that matches the org.
    # ────────────────────────────────────────────────────────────────────────────────────────────
    steps:
      - uses: actions/checkout@v4
        with: { path: app }
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-ui
          path: ui
          token: ${{ secrets.estate_token || github.token }}
      - uses: pnpm/action-setup@v4
        if: inputs.package-manager == 'pnpm'
        with:
          # Pinned, because the app's package.json is in app/ now and pnpm/action-setup looks in
          # the working directory for a packageManager field. Every frontend is on pnpm@11.9.0.
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: app/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: '@cloudsforge'
      - name: Install the sibling design system
        # `link:` resolves to the sibling's OWN node_modules, so the design system must be installed
        # before the app is — without this, `tsc` cannot resolve ../ui's own imports (react,
        # react/jsx-runtime) when it typechecks the linked sources.
        if: inputs.package-manager == 'pnpm'
        run: |
          set -euo pipefail
          [ -f ui/pnpm-lock.yaml ] && pnpm --dir ui install --frozen-lockfile
      - name: Install
        working-directory: app
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.package-manager }}" = "npm" ]; then npm ci; else pnpm install --frozen-lockfile; fi
      - name: Typecheck
        working-directory: app
        run: ${{ inputs.package-manager }} run typecheck
      - name: Test
        working-directory: app
        run: ${{ inputs.package-manager }} run test
      - name: Build
        working-directory: app
        run: ${{ inputs.package-manager }} run build
      # A frontend that builds to nothing is a blank page, not a build failure. The previous
      # estate served SPAs from the API process and shipped an image with no dist in it.
      - name: The bundle exists
        working-directory: app
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html is missing after a successful build"; exit 1; }
          echo "ok: $(find dist -type f | wc -l | tr -d ' ') files in dist"

  runtime-hosts:
    name: One image serves every environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The `|| true` this step used to need — `git grep` exits 1 when it finds nothing, and a
      # `run:` block is `bash -e {0}`, so a clean repository killed its own check — is gone with
      # the shell. That defect and the one below it were the two halves of micro-org#303 and #38:
      # a check that could not pass, and a check that fails on its own explanation.
      #
      # Markup is scanned as well as TypeScript, because Vite substitutes in index.html too. `.md`
      # is not, as before; `.github/` is excluded so this file can quote the thing it forbids.
      - name: Nothing reads import.meta.env.VITE_*
        uses: cloudsforge-online/micro-org/.github/actions/source-scan@main
        with:
          paths: .
          pattern: 'import\.meta\.env\.VITE_[A-Z0-9_]+'
          extensions: ts,tsx,js,jsx,mjs,cjs,mts,cts,vue,svelte,html
          exclude-files: '^\.github/'
          title: ${{ inputs.app }} reads a build-time environment variable
          ok: 'ok: no build-time environment variables'
          guidance: |
            Vite inlines these at build time, so the bundle carries its environment and one image
            can no longer serve all of them. Resolve hosts at runtime from window.location
            (src/hosts.ts, cloudsforgeHosts()). If this genuinely must be known at build time,
            it is a compile-time constant, not an environment variable — write it down as one.

      # The same property from the other side: a build argument that reaches the bundle bakes an
      # environment into an artifact just as effectively, and is harder to spot in review.
      - name: The Dockerfile takes no build arguments that reach the bundle
        run: |
          set -uo pipefail
          [ -f "${{ inputs.dockerfile }}" ] || { echo "ok: no Dockerfile"; exit 0; }
          args=$(grep -nE '^\s*ARG\s+(VITE_|API_|.*_URL)' "${{ inputs.dockerfile }}" || true)
          if [ -n "$args" ]; then
            echo "::error::a build argument would bake an environment into the image:"
            echo "$args"
            exit 1
          fi
          echo "ok: no environment-shaped build arguments"

      # AD-21: product analytics is a service fed by the event bus, pseudonymised by construction.
      # A crypto platform sending user behaviour to a third-party ad network contradicts the
      # product's first principle, and a pixel cannot see the server-side funnels anyway.
      #
      # This one was the estate's best-primed candidate for the eighth occurrence of #303. A
      # comment saying "we deliberately load no googletagmanager tag — AD-21" is the natural way to
      # stop the next person adding one, and it would have failed the build of every frontend that
      # carried it. Strings are NOT blanked here, on purpose: the violation IS a string, a
      # `<script src="https://www.googletagmanager.com/…">`.
      - name: No third-party analytics tag
        uses: cloudsforge-online/micro-org/.github/actions/source-scan@main
        with:
          paths: .
          pattern: 'googletagmanager|google-analytics\.com|gtag\(|segment\.(com|io)/analytics|hotjar|mixpanel'
          extensions: ts,tsx,js,jsx,mjs,cjs,mts,cts,vue,svelte,html
          exclude-files: '^\.github/'
          title: a third-party analytics tag
          ok: 'ok: no third-party tags'
          guidance: |
            Product analytics is micro-analytics, fed by the event bus. AD-21. A crypto platform
            sending user behaviour to a third-party ad network contradicts the product's first
            principle, and a pixel cannot see the server-side funnels anyway.

      # ---------------------------------------------------------------- README --
      - name: The repository documents itself
        # TWELVE REPOSITORIES HAD NO README AT ALL — activity, billing, contracts, docs, identity,
        # indexer, ledger, mint, notify, policy, pricing and worlds — and every one of them was
        # green. Nothing anywhere asserted that a deployable explains itself, so the omission was
        # invisible exactly the way four frontends shipping with no favicon was invisible until
        # `brand-chrome.test.ts` existed.
        #
        # CALIBRATED AGAINST THE READMEs THAT ARE ALREADY GOOD, deliberately. Ten were measured
        # first: route tables and configuration tables are NOT universal — micro-lantern and
        # micro-emberkin document neither and are both strong — so requiring them would fail
        # correct work, which is how six guards in this estate came to fire on their own prose.
        # What every good one does have is substance and a way to run the thing. That is the bar.
        #
        # It is a floor, not a specification. A README that clears it can still be poor; one that
        # does not clear it is certainly missing.
        run: |
          set -uo pipefail
          if [ ! -f README.md ]; then
            echo "::error::this repository has no README.md"
            echo "A deployable that does not explain itself is one nobody can operate or extend."
            echo "The shape and the reasoning are in micro-org: templates/README.template.md"
            exit 1
          fi

          bytes=$(wc -c < README.md | tr -d ' ')
          if [ "$bytes" -lt 4000 ]; then
            echo "::error::README.md is ${bytes} bytes — a stub, not documentation"
            echo "The smallest genuinely-documented service in this estate is about 6 kB."
            exit 1
          fi

          # Every well-documented repository here says how to run and test it. It is the one
          # section that is universal, and the first thing a new reader needs.
          if ! grep -qiE 'pnpm (test|dev|install)|docker (run|compose)' README.md; then
            echo "::error::README.md never says how to run or test this repository"
            echo "Include the real commands, including the Postgres the suite needs."
            exit 1
          fi
          echo "ok: README.md is ${bytes} bytes and says how to run the repository"

  image:
    name: Docker image
    if: inputs.build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The design system is checked out as a NAMED BUILD CONTEXT, not into the source tree: the
      # estate's frontend Dockerfiles resolve their `link:` dependency with `COPY --from=uipkg`.
      # Without it the build fails at that first COPY — the image half of the same
      # `link:`-has-no-sibling defect the build job hit. Passing a context the Dockerfile does not
      # reference is harmless, so a frontend that has stopped using the design system pays nothing.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-ui
          path: ui-ctx
          token: ${{ secrets.estate_token || github.token }}
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          build-contexts: |
            uipkg=${{ github.workspace }}/ui-ctx
          # `push: false` is correct here for the same reason it is correct in service-ci.yml: this
          # job is a gate that must `load` the image to probe it, and the producer is the separate
          # publish-image.yml — separate because a caller granting `packages: read` cannot be
          # elevated by the workflow it calls, and asking would fail every caller at startup.
          push: false
          load: true
          tags: ${{ inputs.app }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image serves the SPA
        run: |
          set -euo pipefail
          BASE='${{ inputs.base-path }}'
          docker run -d --name ci-${{ inputs.app }} -p 127.0.0.1:8080:8080 ${{ inputs.app }}:ci
          for attempt in $(seq 1 20); do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$BASE/" || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "${code:-}" = "200" ] || { echo "::error::the image returned ${code:-no answer} for $BASE/"; docker logs --tail 60 ci-${{ inputs.app }}; exit 1; }
          # THIS CHECK USED TO DEMAND THE OPPOSITE OF THE ESTATE'S RULE, and it named the banned
          # directive in its own failure message. It requested the invented path
          # `/some/deep/route`, required 200, and told you to add `try_files … /index.html` — which
          # `web-template`'s nginx.conf forbids and its CI fails the build over, because answering
          # 200 for every address that does not exist is how an app stops having a 404 at all. Two
          # guards in this repository demanded opposite behaviour, so a frontend could satisfy one
          # or the other and never both. micro-hub-web declined to call this workflow for exactly
          # that reason rather than break its own 404, which was the right call.
          #
          # The property actually worth checking is BOTH halves, and they are different paths:
          # a route the app really has serves the shell with 200, and a route nobody has 404s.
          unknown=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$BASE/nothing-is-here-$RANDOM" || true)
          [ "$unknown" = "404" ] || {
            echo "::error::an unknown path returned $unknown, not 404"
            echo "Serve the shell through 'error_page 404 /index.html' so the app renders its own"
            echo "not-found page while the status code stays honest. Do NOT use try_files \$uri /index.html."
            exit 1
          }
          echo "ok: an unknown path 404s"

          if [ -n "${{ inputs.deep-link-path }}" ]; then
            deep=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$BASE${{ inputs.deep-link-path }}" || true)
            [ "$deep" = "200" ] || {
              echo "::error::the real route $BASE${{ inputs.deep-link-path }} returned $deep, not 200"
              echo "A route the app owns must survive a hard refresh. Add it to nginx.conf's location list."
              exit 1
            }
            echo "ok: $BASE${{ inputs.deep-link-path }} survives a hard refresh"
          else
            echo "note: no deep-link-path given, so no real route was checked on a hard refresh"
          fi

          # ── AND WHEN A BUNDLE IS MOUNTED, THE ROOT MUST BE EMPTY ────────────────────────────
          #
          # Two probes that exist only for a folder, and both assert a 404. Behind the gateway
          # neither address ever reaches this container — the apex root is micro-site's and the
          # apex robots.txt is micro-site's — so they are invisible in production and immediate
          # under `docker run`, which is where a wrong `base:` or a wrong `COPY` destination shows
          # up first. A mounted image that answers 200 on `/` has been copied to the document root
          # and will shadow the marketing site the moment it is deployed.
          if [ -n "$BASE" ]; then
            for path in / /robots.txt; do
              at_root=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$path" || true)
              [ "$at_root" = "404" ] || {
                echo "::error::this bundle is mounted at $BASE and still answers $at_root for $path"
                echo "Check 'base:' in vite.config.ts, the COPY destination in Dockerfile, and every"
                echo "location in nginx.conf. A mounted image serving / would shadow the apex."
                exit 1
              }
            done
            echo "ok: / and /robots.txt are 404 — the mount does not leak to the root"
          fi
      - name: Down
        if: always()
        run: docker rm -f ci-${{ inputs.app }} || true

  # ══════════════════════════════════════════════════════════════════════════════════════════════
  # WHO BREAKS WHEN THIS REPOSITORY MERGES — micro-org#304. The same job service-ci.yml carries,
  # for the same reason, and a frontend is on both ends of it: `site/test/estate-claims.test.ts`
  # reads seven siblings, and micro-org's own `test/cross-repo.test.ts` reads `hub-web` and `site`.
  #
  # The whole argument — why the sweep runs in micro-org rather than here, why a failure to
  # dispatch warns instead of failing, why only a merge to main asks — is written at the top of
  # micro-org's `cross-repo.yml`, which is the file that answers this request. Kept as a copy of
  # service-ci.yml's job rather than a call, because a reusable workflow calling a reusable
  # workflow cannot pass this one what it needs without every caller declaring it; the two copies
  # are held identical by `test/cross-repo.test.ts`, which compares the two steps line by line and
  # fails if either the event type or one payload field drifts.
  # ══════════════════════════════════════════════════════════════════════════════════════════════
  downstream:
    name: Ask micro-org to run the checks that read this repository
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the cross-repository sweep
        env:
          GH_TOKEN: ${{ secrets.estate_token || github.token }}
          UPSTREAM: ${{ inputs.app }}
          MERGED_SHA: ${{ github.sha }}
          MERGED_BY: ${{ github.actor }}
          MERGED_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          status=0
          gh api -X POST "repos/cloudsforge-online/micro-org/dispatches" \
            -f "event_type=upstream-merged" \
            -f "client_payload[repo]=$UPSTREAM" \
            -f "client_payload[sha]=$MERGED_SHA" \
            -f "client_payload[actor]=$MERGED_BY" \
            -f "client_payload[run]=$MERGED_RUN" \
            > /dev/null 2>"$RUNNER_TEMP/dispatch.err" || status=$?

          if [ "$status" -eq 0 ]; then
            echo "ok: micro-org will run every check that reads '${UPSTREAM}' at ${MERGED_SHA}"
            exit 0
          fi

          echo "::warning::could not ask micro-org to check the repositories that read '${UPSTREAM}'"
          echo "The estate token needs contents:write on cloudsforge-online/micro-org to send a"
          echo "repository_dispatch. Until it has it, the sweep runs on micro-org's nightly schedule"
          echo "instead of on this merge — micro-org#304."
          sed 's/^/  /' "$RUNNER_TEMP/dispatch.err" 2>/dev/null || true
