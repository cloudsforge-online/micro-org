name: permprobe-called

# TEMPORARY. Answers one question with a run rather than with a recollection:
#
#   Can a REUSABLE workflow that asks for `packages: write` get it, when the job that
#   called it granted only `packages: read`?
#
# Every one of the estate's 35 callers grants exactly `contents: read` + `packages: read`,
# so the answer decides whether `push: true` can be switched on in micro-org alone.
#
# It creates no package and pushes nothing: it asks GHCR's token endpoint for a
# pull,push-scoped token and prints only the `actions` array GHCR grants back. The
# bearer token itself is never printed.

on:
  workflow_call:
    inputs:
      label:
        required: true
        type: string

jobs:
  probe:
    name: ${{ inputs.label }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: What actions does GHCR grant this token?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          scope="repository:${GITHUB_REPOSITORY_OWNER}/micro-org:pull,push"
          body=$(curl -s -u "x:${GH_TOKEN}" "https://ghcr.io/token?service=ghcr.io&scope=${scope}")
          jwt=$(printf '%s' "$body" | jq -r '.token // empty')
          if [ -z "$jwt" ]; then
            echo "no token issued: $(printf '%s' "$body" | jq -c 'del(.token)')"
            exit 0
          fi
          payload=$(printf '%s' "$jwt" | cut -d. -f2)
          # base64url -> base64, padded.
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          payload="${payload}$(printf '=%.0s' $(seq 1 $pad 2>/dev/null) 2>/dev/null)"
          decoded=$(printf '%s' "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null || true)
          echo "granted access: $(printf '%s' "$decoded" | jq -c '.access' 2>/dev/null || echo 'undecodable')"
