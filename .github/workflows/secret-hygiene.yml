name: secret-hygiene

# Ported from the checks that were hand-copied into eleven CI files, plus the ones that were in
# some of them and not others — which is the drift this repository exists to stop.
#
# These are cheap and they catch the failure that cannot be undone. A secret pushed to a public
# repository is compromised the moment it lands: it is in the fork network, in the event feed, in
# somebody's mirror, and rotating it is the only remedy. A grep before the push is free.
#
# ONE RULE FOR EVERY STEP IN THIS FILE: a search that finds nothing must not fail the step.
#
# `git grep` and `grep` both exit 1 when they match nothing, GitHub runs each `run:` block as
# `bash -e {0}`, and `set -uo pipefail` does not turn `-e` off — so `hits=$(git grep …)` aborts the
# step the moment the repository is clean. Three of the checks below were written that way and
# therefore failed on every clean repository in the estate, which is to say: on every repository,
# because a repository with a committed secret fails them too. They had never passed anywhere.
#
# Every capture is now wrapped in `|| true` and the verdict is the `if` that follows it. Anything
# added here must do the same.
#
# A SECOND RULE, AND IT IS THE MORE IMPORTANT ONE: NO STEP IN THIS FILE MAY PRINT A MATCHED VALUE.
#
# Two of the steps below used to `echo "$hits"`, where `$hits` was grep output carrying the whole
# matching line — which is to say, the credential. So the single run in which either check ever did
# its job would have copied a live credential out of a file and into a GitHub Actions log: an
# artefact with a wider audience than the file it came from, retained on its own schedule, and not
# somewhere anybody thinks to rotate. A detector that discloses what it detects converts a contained
# mistake into a distributed one, and this file is called by every service repository in the estate,
# so it would have done that automatically, on every push, for ever (micro-org #218).
#
# The report is therefore `path:line`, a TRUNCATED SHA-256 of the value, and a character count.
# That is enough to open the right file, to tell two findings apart, and to confirm a rotation
# landed by comparing digests — without anybody pasting a secret anywhere. It is how
# `deploy/scripts/check-secret-hygiene.py` already correlates, for the same reason. A finding is
# actionable from its LOCATION; nothing downstream of this file needs its VALUE.
#
# The private-key step is exempt only because it never had the defect: `git grep -l` prints file
# names and never content. Anything added here must use the `report_finding` shape below.

on:
  workflow_call:
    inputs:
      require-dockerignore:
        description: Set false for a repository that ships no Dockerfile.
        required: false
        default: true
        type: boolean

jobs:
  hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .env must never be tracked by git
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git"
            echo "Remove it from the index, rotate everything in it, and add it to .gitignore."
            exit 1
          fi
          echo "ok: .env is not tracked"

      - name: No API tokens committed
        # `|| true` IS LOAD-BEARING AND IS THE WHOLE REASON THIS STEP HAS EVER PASSED.
        #
        # `git grep` exits 1 when it finds nothing, GitHub runs every `run:` block as
        # `bash -e {0}`, and `set -uo pipefail` does not turn `-e` off. So on a repository with no
        # secrets in it the assignment below aborted the step before the `if` was reached: the
        # check failed, silently, with no annotation, and the only path that ever reached the
        # reporting logic was the one where a credential really had been committed.
        #
        # That is to say: this check failed on every clean repository in the estate and had never
        # passed anywhere. A guard that is red on correct code is a guard people learn to ignore,
        # and this one is in front of the failure that cannot be undone — a pushed secret is
        # compromised the moment it lands.
        run: |
          set -uo pipefail
          # sk-proj- (OpenAI), ghp_/gho_/ghs_ (GitHub), AKIA (AWS). Examples and this workflow's
          # own patterns are excluded, or the check reports itself.
          pattern='sk-proj-[A-Za-z0-9_-]{20,}|gh[pos]_[A-Za-z0-9]{36,}|AKIA[0-9A-Z]{16}'
          hits=$(git grep -nIE "$pattern" \
                 -- . ':!*.example' ':!*.md' ':!.github/workflows/*' || true)
          if [ -n "$hits" ]; then
            # THE VALUE IS NEVER PRINTED. These patterns match REAL vendor credential formats, so
            # anything reaching this branch is by definition live — which makes this the one step
            # in the estate where echoing the match would disclose a working key. See the header.
            echo "::error::possible committed credential (value withheld deliberately):"
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              path=${line%%:*}
              rest=${line#*:}
              lineno=${rest%%:*}
              content=${rest#*:}
              # The TOKEN, not the line around it: a source line can carry context worth keeping out
              # of a log too, and hashing the whole line would make the digest depend on unrelated
              # edits, so the same key in two places would not correlate.
              #
              # `|| true` for the fourth time in this file, and here it guards TWO ways of exiting
              # non-zero without anything being wrong: `grep` finding nothing, and `head -1` closing
              # the pipe on a match — a SIGPIPE upstream that `pipefail` turns into a failed
              # assignment and `bash -e` turns into a dead step. `$content` always contains a match
              # by construction, which is exactly the reasoning that keeps producing this bug.
              value=$(printf '%s' "$content" | grep -oE "$pattern" | head -1 || true)
              # The vendor, so the finding names who to call. A format prefix is a public constant
              # and discloses nothing: it is the difference between "rotate something" and "rotate
              # this AWS key now".
              case "$value" in
                sk-proj-*) vendor='OpenAI' ;;
                gh[pos]_*) vendor='GitHub' ;;
                AKIA*)     vendor='AWS' ;;
                *)         vendor='unknown' ;;
              esac
              digest=$(printf '%s' "$value" | sha256sum | cut -c1-12)
              echo "  ${path}:${lineno}  ${vendor}  sha256:${digest}…  (${#value} characters)"
            done <<< "$hits"
            echo "Open each file at that line. It is compromised already: rotate FIRST — with the"
            echo "vendor named above — then rewrite history. Rewriting first only hides it."
            exit 1
          fi
          echo "ok: no committed API tokens found"

      - name: A private key is never a file in a repository
        run: |
          set -uo pipefail
          # `|| true` for the same reason as the step above: no match is exit 1, and `bash -e`
          # would kill the step on exactly the repositories that deserve to pass.
          hits=$(git grep -nIlE 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY' -- . ':!*.example' ':!*.md' || true)
          if [ -n "$hits" ]; then
            echo "::error::a private key block in: $hits"
            exit 1
          fi
          echo "ok: no private keys"

      - name: .dockerignore excludes env files
        if: inputs.require-dockerignore
        run: |
          set -uo pipefail
          if [ ! -f .dockerignore ]; then
            echo "::error::no .dockerignore, so COPY . . puts .env inside the image"
            exit 1
          fi
          missing=''
          grep -qxE '\.env' .dockerignore || missing="$missing .env"
          grep -qxE '\.env\.\*' .dockerignore || missing="$missing .env.*"
          grep -qxE '\.git' .dockerignore || missing="$missing .git"
          if [ -n "$missing" ]; then
            echo "::error::.dockerignore does not exclude:$missing"
            echo "Without these, COPY . . ships the secrets and the whole history into the image."
            exit 1
          fi
          echo "ok: .dockerignore excludes env files and .git"

      # An example file exists so people copy it. If it carries a real value, they copy that too,
      # and the value ends up in every developer's environment and in CI logs.
      - name: The example env file carries no values
        # The allowlist recognised `changeme` and not `CHANGE_ME`, so five services — billing,
        # ledger, notify, pricing and settlement — failed this check on placeholders that are
        # unmistakably placeholders (`CHANGE_ME_TO_32_RANDOM_CHARACTERS`,
        # `REPLACE-with-openssl-rand-hex-24`). None of them had ever run it; the whole estate's CI
        # was unreachable, which is how three separate guards got to be wrong at once.
        #
        # A guard that fails on correct code does not get fixed, it gets bypassed — and this one
        # guards the file people copy their real secrets into, so bypassing it is expensive. The
        # match is therefore on the SHAPE of a placeholder rather than one spelling of one word,
        # and it is deliberately anchored to placeholder vocabulary: a value that does not say it
        # is fake is still treated as real, which is the behaviour worth keeping.
        run: |
          set -uo pipefail
          [ -f .env.example ] || { echo "ok: no .env.example"; exit 0; }

          # Values that are self-evidently not secrets: a local address, a shell reference, or a
          # word whose entire job is to say "put something here".
          #
          # `postgres://` is NOT on this list, though it used to be. A bare scheme allowlist meant
          # `DB_URL=postgres://real:Pa55w0rd@prod.internal:5432/ledger` passed — a production DSN
          # carrying its own password, waved through by the check whose entire purpose is catching
          # that. A local DSN still passes, via `local_only` below, because its host says it is
          # local; a remote one now has to say it is a placeholder.
          benign='=(localhost|127\.0\.0\.1|http://|https://|\$\{)'
          placeholder='=.*(change[ _-]?me|replace|to[ _-]?be[ _-]?set|placeholder|example|your[ _-]|<[a-z]|todo|xxx|\.\.\.)'
          # A value made only of local URLs, which is how a JSON-valued variable such as
          # SETTLEMENT_RPC_URLS declares a development default.
          local_only='^[^=]*=[^=]*(localhost|127\.0\.0\.1)'

          # An EMPTY collection. `IDENTITY_SERVICE_TOKEN_GRANTS={}` is the safe default for
          # "which service may hold which scope" — granting nothing — and its name matches
          # *TOKEN* so the rule above flagged it. An empty JSON object or array cannot be a
          # credential: there is nothing in it. Narrow on purpose — `{}` and `[]` and nothing
          # else, so a populated JSON value is still read as a value.
          empty_json='=(\{\}|\[\])$'

          # `|| true` around the whole pipeline, for the third time in this file: every `grep` in
          # it exits 1 when it filters everything out, which is precisely what a correct
          # .env.example does, and `pipefail` propagates that to the assignment.
          filled=$(grep -nE '^[A-Z_]*(SECRET|TOKEN|PASSWORD|KEY|DSN|URL)[A-Z_]*=.+' .env.example \
                   | grep -viE "$benign" \
                   | grep -viE "$placeholder" \
                   | grep -viE "$local_only" \
                   | grep -viE "$empty_json" || true)
          if [ -n "$filled" ]; then
            # THE VALUE IS NEVER PRINTED, for the reason in the header — and most sharply here.
            # Every line reaching this branch is one this check could NOT recognise as a placeholder,
            # which is the definition of "a real credential somebody pasted in and forgot". Echoing
            # them republished exactly the values the step exists to catch.
            #
            # The variable NAME is printed and is not a disclosure: it is already in the file, it is
            # what the operator has to go and rotate, and a finding that named neither the line nor
            # the key would be one nobody could act on.
            echo "::error::.env.example has values where it should have empty keys or a placeholder:"
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              lineno=${line%%:*}
              content=${line#*:}
              name=${content%%=*}
              value=${content#*=}
              digest=$(printf '%s' "$value" | sha256sum | cut -c1-12)
              echo "  .env.example:${lineno}  ${name}  sha256:${digest}…  (${#value} characters)"
            done <<< "$filled"
            echo "A placeholder must say it is one — CHANGE_ME, REPLACE_WITH_…, <your-token> — so that"
            echo "this check can tell it apart from a real credential somebody pasted in and forgot."
            echo "If any value above is real: it is in git history, so rotate it rather than edit it."
            exit 1
          fi
          echo "ok: .env.example declares names, not values"
