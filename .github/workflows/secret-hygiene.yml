name: secret-hygiene

# Ported from the checks that were hand-copied into eleven CI files, plus the ones that were in
# some of them and not others — which is the drift this repository exists to stop.
#
# These are cheap and they catch the failure that cannot be undone. A secret pushed to a public
# repository is compromised the moment it lands: it is in the fork network, in the event feed, in
# somebody's mirror, and rotating it is the only remedy. A grep before the push is free.
#
# ONE RULE FOR EVERY STEP IN THIS FILE: a search that finds nothing must not fail the step.
#
# `git grep` and `grep` both exit 1 when they match nothing, GitHub runs each `run:` block as
# `bash -e {0}`, and `set -uo pipefail` does not turn `-e` off — so `hits=$(git grep …)` aborts the
# step the moment the repository is clean. Three of the checks below were written that way and
# therefore failed on every clean repository in the estate, which is to say: on every repository,
# because a repository with a committed secret fails them too. They had never passed anywhere.
#
# Every capture is now wrapped in `|| true` and the verdict is the `if` that follows it. Anything
# added here must do the same.
#
# A SECOND RULE, AND IT IS THE MORE IMPORTANT ONE: NO STEP IN THIS FILE MAY PRINT A MATCHED VALUE.
#
# Two of the steps below used to `echo "$hits"`, where `$hits` was grep output carrying the whole
# matching line — which is to say, the credential. So the single run in which either check ever did
# its job would have copied a live credential out of a file and into a GitHub Actions log: an
# artefact with a wider audience than the file it came from, retained on its own schedule, and not
# somewhere anybody thinks to rotate. A detector that discloses what it detects converts a contained
# mistake into a distributed one, and this file is called by every service repository in the estate,
# so it would have done that automatically, on every push, for ever (micro-org #218).
#
# The report is therefore `path:line`, a TRUNCATED SHA-256 of the value, and a character count.
# That is enough to open the right file, to tell two findings apart, and to confirm a rotation
# landed by comparing digests — without anybody pasting a secret anywhere. It is how
# `deploy/scripts/check-secret-hygiene.py` already correlates, for the same reason. A finding is
# actionable from its LOCATION; nothing downstream of this file needs its VALUE.
#
# The private-key step is exempt only because it never had the defect: `git grep -l` prints file
# names and never content. Anything added here must use the `report_finding` shape below.
#
# ── A THIRD RULE, ADDED AFTER THE ESTATE ADMINISTRATOR'S PASSWORD WAS PUBLISHED ────────────────
#
# Every step above this line reads a FILE THAT IS ONLY EVER A CONTAINER FOR SECRETS — `.env`,
# `.env.example`, `.dockerignore` — or looks for a vendor format that is unmistakable on sight.
# None of them reads a SCRIPT. So none of them ever saw
#
#     ADMIN_PASSWORD=${ADMIN_PASSWORD:-correct-horse-battery-staple-42}
#
# which sat in `deploy/scripts/estate-bootstrap.sh` in a PUBLIC repository while mainnet was
# bootstrapped without setting the variable — making that literal the estate administrator's real
# password. Measured 2026-08-09: `POST https://api.cloudsforge.online/v1/auth/login` returned 200
# with `roles: ["player","admin"]`. One request, composable by anyone who read the file
# (micro-org #276, fixed in micro-deploy #13).
#
# It survived review because of its comment — "a throwaway operator for a throwaway environment" —
# which describes the ACCOUNT'S INTENT and says nothing about the environment the script runs in,
# and that script bootstraps a laptop and mainnet with the same line. The rule the incident
# produced is the last step in this file: A DEFAULT THAT IS ONLY SAFE IN SOME ENVIRONMENTS DOES
# NOT BELONG IN A SCRIPT THAT RUNS IN ALL OF THEM, so a credential-shaped literal standing in for
# a credential-named variable is refused wherever it is written.
#
# THAT STEP IS CALIBRATED AGAINST THE ESTATE RATHER THAN INVENTED. It was run over all 69
# repositories in the estate before it shipped and the exemptions below are the ones that
# measurement forced; the numbers are in the step's own header. A guard that is red on correct
# code gets bypassed, and three of the guards in this very file had that shape.

on:
  workflow_call:
    inputs:
      require-dockerignore:
        description: Set false for a repository that ships no Dockerfile.
        required: false
        default: true
        type: boolean

jobs:
  hygiene:
    name: Secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .env must never be tracked by git
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git"
            echo "Remove it from the index, rotate everything in it, and add it to .gitignore."
            exit 1
          fi
          echo "ok: .env is not tracked"

      - name: No API tokens committed
        # `|| true` IS LOAD-BEARING AND IS THE WHOLE REASON THIS STEP HAS EVER PASSED.
        #
        # `git grep` exits 1 when it finds nothing, GitHub runs every `run:` block as
        # `bash -e {0}`, and `set -uo pipefail` does not turn `-e` off. So on a repository with no
        # secrets in it the assignment below aborted the step before the `if` was reached: the
        # check failed, silently, with no annotation, and the only path that ever reached the
        # reporting logic was the one where a credential really had been committed.
        #
        # That is to say: this check failed on every clean repository in the estate and had never
        # passed anywhere. A guard that is red on correct code is a guard people learn to ignore,
        # and this one is in front of the failure that cannot be undone — a pushed secret is
        # compromised the moment it lands.
        run: |
          set -uo pipefail
          # sk-proj- (OpenAI), ghp_/gho_/ghs_ (GitHub), AKIA (AWS). Examples and this workflow's
          # own patterns are excluded, or the check reports itself.
          pattern='sk-proj-[A-Za-z0-9_-]{20,}|gh[pos]_[A-Za-z0-9]{36,}|AKIA[0-9A-Z]{16}'
          hits=$(git grep -nIE "$pattern" \
                 -- . ':!*.example' ':!*.md' ':!.github/workflows/*' || true)
          if [ -n "$hits" ]; then
            # THE VALUE IS NEVER PRINTED. These patterns match REAL vendor credential formats, so
            # anything reaching this branch is by definition live — which makes this the one step
            # in the estate where echoing the match would disclose a working key. See the header.
            echo "::error::possible committed credential (value withheld deliberately):"
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              path=${line%%:*}
              rest=${line#*:}
              lineno=${rest%%:*}
              content=${rest#*:}
              # The TOKEN, not the line around it: a source line can carry context worth keeping out
              # of a log too, and hashing the whole line would make the digest depend on unrelated
              # edits, so the same key in two places would not correlate.
              #
              # `|| true` for the fourth time in this file, and here it guards TWO ways of exiting
              # non-zero without anything being wrong: `grep` finding nothing, and `head -1` closing
              # the pipe on a match — a SIGPIPE upstream that `pipefail` turns into a failed
              # assignment and `bash -e` turns into a dead step. `$content` always contains a match
              # by construction, which is exactly the reasoning that keeps producing this bug.
              value=$(printf '%s' "$content" | grep -oE "$pattern" | head -1 || true)
              # The vendor, so the finding names who to call. A format prefix is a public constant
              # and discloses nothing: it is the difference between "rotate something" and "rotate
              # this AWS key now".
              case "$value" in
                sk-proj-*) vendor='OpenAI' ;;
                gh[pos]_*) vendor='GitHub' ;;
                AKIA*)     vendor='AWS' ;;
                *)         vendor='unknown' ;;
              esac
              digest=$(printf '%s' "$value" | sha256sum | cut -c1-12)
              echo "  ${path}:${lineno}  ${vendor}  sha256:${digest}…  (${#value} characters)"
            done <<< "$hits"
            echo "Open each file at that line. It is compromised already: rotate FIRST — with the"
            echo "vendor named above — then rewrite history. Rewriting first only hides it."
            exit 1
          fi
          echo "ok: no committed API tokens found"

      - name: A private key is never a file in a repository
        run: |
          set -uo pipefail
          # `|| true` for the same reason as the step above: no match is exit 1, and `bash -e`
          # would kill the step on exactly the repositories that deserve to pass.
          hits=$(git grep -nIlE 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY' -- . ':!*.example' ':!*.md' || true)
          if [ -n "$hits" ]; then
            echo "::error::a private key block in: $hits"
            exit 1
          fi
          echo "ok: no private keys"

      - name: .dockerignore excludes env files
        if: inputs.require-dockerignore
        run: |
          set -uo pipefail
          if [ ! -f .dockerignore ]; then
            echo "::error::no .dockerignore, so COPY . . puts .env inside the image"
            exit 1
          fi
          missing=''
          grep -qxE '\.env' .dockerignore || missing="$missing .env"
          grep -qxE '\.env\.\*' .dockerignore || missing="$missing .env.*"
          grep -qxE '\.git' .dockerignore || missing="$missing .git"
          if [ -n "$missing" ]; then
            echo "::error::.dockerignore does not exclude:$missing"
            echo "Without these, COPY . . ships the secrets and the whole history into the image."
            exit 1
          fi
          echo "ok: .dockerignore excludes env files and .git"

      # An example file exists so people copy it. If it carries a real value, they copy that too,
      # and the value ends up in every developer's environment and in CI logs.
      - name: The example env file carries no values
        # The allowlist recognised `changeme` and not `CHANGE_ME`, so five services — billing,
        # ledger, notify, pricing and settlement — failed this check on placeholders that are
        # unmistakably placeholders (`CHANGE_ME_TO_32_RANDOM_CHARACTERS`,
        # `REPLACE-with-openssl-rand-hex-24`). None of them had ever run it; the whole estate's CI
        # was unreachable, which is how three separate guards got to be wrong at once.
        #
        # A guard that fails on correct code does not get fixed, it gets bypassed — and this one
        # guards the file people copy their real secrets into, so bypassing it is expensive. The
        # match is therefore on the SHAPE of a placeholder rather than one spelling of one word,
        # and it is deliberately anchored to placeholder vocabulary: a value that does not say it
        # is fake is still treated as real, which is the behaviour worth keeping.
        run: |
          set -uo pipefail
          [ -f .env.example ] || { echo "ok: no .env.example"; exit 0; }

          # Values that are self-evidently not secrets: a local address, a shell reference, or a
          # word whose entire job is to say "put something here".
          #
          # `postgres://` is NOT on this list, though it used to be. A bare scheme allowlist meant
          # `DB_URL=postgres://real:Pa55w0rd@prod.internal:5432/ledger` passed — a production DSN
          # carrying its own password, waved through by the check whose entire purpose is catching
          # that. A local DSN still passes, via `local_only` below, because its host says it is
          # local; a remote one now has to say it is a placeholder.
          benign='=(localhost|127\.0\.0\.1|http://|https://|\$\{)'
          placeholder='=.*(change[ _-]?me|replace|to[ _-]?be[ _-]?set|placeholder|example|your[ _-]|<[a-z]|todo|xxx|\.\.\.)'
          # A value made only of local URLs, which is how a JSON-valued variable such as
          # SETTLEMENT_RPC_URLS declares a development default.
          local_only='^[^=]*=[^=]*(localhost|127\.0\.0\.1)'

          # An EMPTY collection. `IDENTITY_SERVICE_TOKEN_GRANTS={}` is the safe default for
          # "which service may hold which scope" — granting nothing — and its name matches
          # *TOKEN* so the rule above flagged it. An empty JSON object or array cannot be a
          # credential: there is nothing in it. Narrow on purpose — `{}` and `[]` and nothing
          # else, so a populated JSON value is still read as a value.
          empty_json='=(\{\}|\[\])$'

          # `|| true` around the whole pipeline, for the third time in this file: every `grep` in
          # it exits 1 when it filters everything out, which is precisely what a correct
          # .env.example does, and `pipefail` propagates that to the assignment.
          filled=$(grep -nE '^[A-Z_]*(SECRET|TOKEN|PASSWORD|KEY|DSN|URL)[A-Z_]*=.+' .env.example \
                   | grep -viE "$benign" \
                   | grep -viE "$placeholder" \
                   | grep -viE "$local_only" \
                   | grep -viE "$empty_json" || true)
          if [ -n "$filled" ]; then
            # THE VALUE IS NEVER PRINTED, for the reason in the header — and most sharply here.
            # Every line reaching this branch is one this check could NOT recognise as a placeholder,
            # which is the definition of "a real credential somebody pasted in and forgot". Echoing
            # them republished exactly the values the step exists to catch.
            #
            # The variable NAME is printed and is not a disclosure: it is already in the file, it is
            # what the operator has to go and rotate, and a finding that named neither the line nor
            # the key would be one nobody could act on.
            echo "::error::.env.example has values where it should have empty keys or a placeholder:"
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              lineno=${line%%:*}
              content=${line#*:}
              name=${content%%=*}
              value=${content#*=}
              digest=$(printf '%s' "$value" | sha256sum | cut -c1-12)
              echo "  .env.example:${lineno}  ${name}  sha256:${digest}…  (${#value} characters)"
            done <<< "$filled"
            echo "A placeholder must say it is one — CHANGE_ME, REPLACE_WITH_…, <your-token> — so that"
            echo "this check can tell it apart from a real credential somebody pasted in and forgot."
            echo "If any value above is real: it is in git history, so rotate it rather than edit it."
            exit 1
          fi
          echo "ok: .env.example declares names, not values"

      # ──────────────────────────────────────────────────────────────────────────────────────────
      # A CREDENTIAL-SHAPED DEFAULT IS A CREDENTIAL. This is the step the header's third rule is
      # about; read that first, because the reasoning is there and only the calibration is here.
      #
      # WHAT IT REFUSES
      #   ${FOO_PASSWORD:-literal}   and FOO_PASSWORD=${FOO_PASSWORD:-literal}   (sh, compose, yml)
      #   process.env.FOO_SECRET || 'literal'   env['FOO_TOKEN'] ?? "literal"    (js, ts, mjs)
      #   FOO_PASSWORD="literal"    const password = 'literal'    { password: 'literal' }
      # …for names carrying PASSWORD / PASSWD / PASSPHRASE / SECRET / TOKEN / CREDENTIAL / APIKEY,
      # plus KEY and PASS where the name is an environment variable. All five forms fire on the
      # single line #276 is about.
      #
      # WHAT IT MEASURES, BEFORE IT SHIPPED — every repository in the estate, 2026-08-09:
      #
      #   micro-deploy at the commit BEFORE its fix   9 findings, every one the published password
      #                                               (including two the issue had not found:
      #                                               erasure-drill.sh and a second site in
      #                                               ember-seed.js)
      #   micro-deploy at the commit AFTER its fix    1 — and it is a real one, see below
      #   micro-beacon, micro-ui                      4, all four sites named in #276 items 1 & 2
      #   all 69 repositories, current HEAD           6, every one a true positive, zero false
      #
      # Those six are the four #276 sites that are still open, plus two defaults nobody had
      # reported: `deploy/compose/docker-compose.telemetry.yml` binds Grafana's admin password to
      # `local-dev-only` and argues in its own comment that the operator plane is loopback-only,
      # and `pool/scripts/regtest-mweb.sh` writes a regtest node's RPC password in the clear and
      # argues that a placeholder which looks like a secret is how a string gets copied somewhere
      # it matters. Both arguments may well be right, and both are exactly what the allow marker
      # is for: the check does not decide they are wrong, it decides they have to be said on the
      # line, where the next reader sees them.
      #
      # The exemptions below are what took that number from 102 to 6, and each is answering a real
      # line rather than an imagined one. The one exemption NOT taken is worth as much as the ones
      # that were: a value saying it is a throwaway does not get a pass, because "throwaway" is the
      # word that put an administrator's password on the public internet.
      #
      # HOW TO ANSWER A FINDING. Best: delete the default and refuse an unset variable, which is
      # what `estate-bootstrap.sh` now does. Otherwise write, on the line or the line above it,
      #
      #     # secret-hygiene: allow <at least forty characters saying why this one is safe>
      #
      # A MARKER WITH NO REASON IS ITSELF A FINDING. A mute you can paste without thinking is a
      # mute that gets pasted without thinking, and then this step protects nothing.
      # ──────────────────────────────────────────────────────────────────────────────────────────
      - name: No credential-shaped default in a script
        run: |
          set -uo pipefail

          # `$RUNNER_TEMP` on a runner, a scratch directory anywhere else, so that `micro-org`'s
          # own suite can run THESE EXACT BYTES rather than a copy of them that can drift.
          # `test/secret-hygiene.test.ts` extracts this whole block and feeds it fixtures.
          scratch=${RUNNER_TEMP:-$(mktemp -d)}
          cat > "$scratch/credential-default-audit.awk" <<'CREDENTIAL_DEFAULT_AUDIT'
          # Split camelCase and punctuation into SCREAMING_SNAKE words, so that ONE vocabulary judges
          # `adminPassword`, `ADMIN_PASSWORD` and `admin-password`. Two spellings of one rule is how the
          # `.env.example` step came to recognise `changeme` and not `CHANGE_ME` and fail five services.
          function norm(n,   i, c, p, out) {
            out = ""; p = ""
            for (i = 1; i <= length(n); i++) {
              c = substr(n, i, 1)
              if (c ~ /[A-Z]/ && p ~ /[a-z0-9]/) out = out "_"
              if (c ~ /[A-Za-z0-9]/) out = out c; else out = out "_"
              p = c
            }
            return toupper(out)
          }

          # `envvar` is 1 when the name is an ENVIRONMENT VARIABLE and 0 when it is a program identifier.
          # Two words differ between those vocabularies, and both differences are measured, not guessed.
          #
          #   KEY   In env-var naming `*_KEY` is credential vocabulary. In JS it overwhelmingly is not:
          #         across the estate it produced `ACCESS_KEY = 'cf.accessToken'` in seventeen frontends,
          #         `CONSENT_STORAGE_KEY`, `CHAIN_KEY`, `KEY_REUSE_CODE` and `const KEY = 'emberkin.prefs'`
          #         — twenty-five browser-storage and lease keys, and NOT ONE credential. So a bare KEY
          #         counts only in env-var vocabulary; in code it must be QUALIFIED (API_KEY, PRIVATE_KEY,
          #         SIGNING_KEY), which still catches everything a credential is ever called.
          #   PASS  Same shape. `PG_PASS=` is a password; `pass: 'provenance'` in conformance's analyser is
          #         which pass of the analyser produced the record.
          function is_cred(n, envvar,   u) {
            u = "_" norm(n) "_"
            if (u ~ /_(PASSWORD|PASSWORDS|PASSWD|PASSPHRASE|SECRET|SECRETS|TOKEN|TOKENS|CREDENTIAL|CREDENTIALS|APIKEY)_/) return 1
            if (envvar && u ~ /_(KEY|KEYS|PASS)_/) return 1
            if (u ~ /_(API|APP|SECRET|PRIVATE|SIGNING|SIGNATURE|ENCRYPTION|ENCRYPT|MASTER|CIPHER|HMAC|AES|RSA|JWT|SSH|GPG|PGP|LICENCE|LICENSE|AUTH|SERVICE|ADMIN|ROOT)_(KEY|KEYS)_/) return 1
            return 0
          }

          # A name whose LAST word says the thing beside it is an IDENTIFIER — a header, a column, a prefix,
          # an env-var name. custody's `TOKEN_PROGRAM_ID = 'Tokenkeg…'` is a public Solana program address
          # and devplatform's `CLIENT_SECRET_PREFIX = 'cfcs'` is a format constant printed in its own docs.
          function name_is_identifier(n,   u) {
            u = norm(n)
            return (u ~ /_(ID|IDS|ADDRESS|PREFIX|SUFFIX|ENV|VAR|VARS|FILE|PATH|DIR|NAME|NAMES|HEADER|FIELD|COLUMN|ALGO|ALGORITHM|KIND|TYPE|LENGTH|LEN|COUNT|TTL|SECONDS|MS|URL|URLS|PATTERN|REGEX|LABEL|SCOPE|SCOPES|CODE|USAGE|EVENT|TOPIC)$/)
          }

          # A name that says the literal beside it is REFUSED rather than used. THIS ONE IS NOT OPTIONAL:
          # the fix for #276 put `PUBLISHED_DEFAULT='correct-horse-battery-staple-42'` into
          # `estate-bootstrap.sh` on purpose, so the script can compare against the published value and
          # refuse it. A check that fails the code that fixes the bug is worse than no check.
          function name_is_denial(n,   u) {
            u = "_" norm(n) "_"
            return (u ~ /_(PUBLISHED|REFUSED|REJECTED|FORBIDDEN|BANNED|COMPROMISED|LEAKED|REVOKED|DENY|DENIED|DENYLIST|BLOCKED|BAD|WEAK|INSECURE)_/)
          }

          # What the VALUE has to look like before a credential-named variable holding it is a finding.
          # Everything here was forced by a real line in the estate; the alternative to each was a red build
          # on correct code.
          function benign(v) {
            # `${ADMIN_PASSWORD:-}` IS THE CORRECT PATTERN and is what #276 replaced the default with.
            if (v == "") return "empty-default"
            # A default that names another variable moves the question, it does not answer it with a secret:
            # `${ADMIN_PASSWORD:-${ESTATE_ADMIN_PASSWORD:-}}` in `estate-verify.sh`.
            if (index(v, "$") > 0) return "names-another-variable"
            # An English sentence. notify's `password_changed: 'your password was changed'`. No secret in
            # this estate contains a space: they travel through compose env files and shell interpolation.
            if (v ~ /[ \t]/) return "prose-not-a-credential"
            # `${CF_VERIFY_TOKEN_CLIFF_SECONDS:-600}` is a TTL.
            if (v ~ /^[0-9]+$/ || v ~ /^[0-9]+\.[0-9]+$/) return "numeric"
            if (v ~ /^(true|false|yes|no|on|off|null|none|nil)$/) return "boolean"
            # `${CF_MINER_KEYS:-/home/malf/…/miner-keys}` is a bind-mount source, not a key.
            if (v ~ /^[~\/]/ || v ~ /^\.\.?\//) return "filesystem-path"
            if (v ~ /^https?:\/\// || v ~ /localhost/ || v ~ /127\.0\.0\.1/ || v ~ /0\.0\.0\.0/) return "url-or-loopback"
            # `@generate` — the estate's established sentinel asking service-ci.yml for a fresh
            # `openssl rand -base64 48` per run, so CI holds a real secret rather than a string claiming to
            # be one (micro-org #142). Refusing it would push people back to the literal it replaced.
            if (v ~ /^@[a-z]/) return "generated-sentinel"
            # THE SAME PLACEHOLDER VOCABULARY THE `.env.example` STEP ALREADY USES, deliberately — one
            # spelling of "this is not a value" for the whole file. It is what clears compose's
            # `${SETTLEMENT_SERVICE_TOKEN:-estate-placeholder-token-0000000000000000}`, which every service
            # refuses at boot.
            if (tolower(v) ~ /change[ _-]?me|replace|to[ _-]?be[ _-]?set|placeholder|example|your[ _-]|todo|xxx|\.\.\./) return "placeholder-vocabulary"
            if (v ~ /^<[A-Za-z]/) return "placeholder-vocabulary"
            # Below identity's own minimum password length, so nothing this short is a credential any
            # service in the estate would accept. `PG_PASS=test` against a throwaway container is the case.
            if (length(v) < 8) return "too-short-to-be-a-credential"
            # identity's `LEGACY_KEY_SECRET = 'IDENTITY_KEY_SECRET'` holds the NAME of a variable.
            if (v ~ /^[A-Z][A-Z0-9_]*$/) return "names-a-variable"
            if (v ~ /^0[xX][0-9a-fA-F]+$/) return "hex-identifier"
            # A value that asserts it will be REJECTED: worlds' `token: 'not-this-platforms-token'` exists
            # to prove a forged credential gets a 401. NOTE WHAT IS NOT ON THIS LIST — `fake-`, `dummy-`,
            # `test-`, `throwaway-`. Those assert the value is UNIMPORTANT, which is precisely the reasoning
            # ("a throwaway operator for a throwaway environment") that put the administrator's password in
            # a public repository. Only "this will be refused" is self-evidently safe; "this does not
            # matter" is a claim about an environment the file cannot see.
            if (tolower(v) ~ /^(not|invalid|forged|expired|revoked|bogus|unissued)[-_]/) return "self-declared-refusable"
            return ""
          }

          # THE ESTATE PUTS THROWAWAY CREDENTIALS IN FIXTURES ON PURPOSE and there are about a hundred of
          # them: `const SECRET = 'K2sN4vQ8xR1wB6tY9zL3mF7hC5jD0pA4'` appears in nine services' suites,
          # `contracts/packages/auth/src/index.test.ts` needs a real-looking password to test the rules that
          # reject bad ones, and a `smoke-env:` block hands CI throwaway values by design. Exempting them by
          # PATH rather than by marker is the only honest option: an inline marker on a hundred fixture
          # lines is a reflex, not a decision, and a reflex marker is how a check stops meaning anything.
          #
          # service-ci.yml's rule 1 already draws the line in the same place ("skip tests, where naming a
          # foreign variable is the point"), so this is the estate's existing convention, not a new one.
          function path_exempt(f) {
            # This file's own patterns, and every caller's workflows, quote the shapes they forbid. The
            # committed-token step above excludes `.github/workflows/*` for exactly this reason.
            if (f ~ /(^|\/)\.github\/workflows\//) return "workflow-source"
            if (f ~ /\.(test|spec)\.[A-Za-z]+$/) return "test-file"
            if (f ~ /(^|\/)(test|tests|__tests__|__mocks__|e2e|mocks|testdata)\//) return "test-tree"
            if (f ~ /(^|\/)testsupport\./) return "test-support"
            if (f ~ /(^|\/)(testhelpers|testfixtures)\.[A-Za-z]+$/) return "test-support"
            # `.env.example` has its own step, with its own placeholder rules.
            if (f ~ /\.example($|\.)/) return "example-file"
            return ""
          }
          # NOTE WHAT IS DELIBERATELY ABSENT: a bare `fixtures.ts` is NOT exempt. beacon's
          # `src/browser/fixtures.ts` is named like a fixture and is not one — it registers REAL accounts on
          # the REAL estate, and it carried the published password (micro-org #276 item 1). A name is not a
          # location. Only a test PATH, or a file that imports a test runner, is treated as test code.

          function qlit(s, i,   q, out, c) {
            q = substr(s, i, 1); i++; out = ""
            while (i <= length(s)) {
              c = substr(s, i, 1)
              if (c == "\\") { out = out substr(s, i, 2); i += 2; continue }
              if (c == q) return out
              out = out c; i++
            }
            return out
          }

          # -1 when the marker is absent, otherwise the LENGTH OF THE REASON written beside it.
          #
          # AN ALLOW MARKER MUST CARRY A REASON OR IT IS NOT AN ALLOW MARKER. A bare mute is a reflex —
          # people paste it without reading, and then the check protects nothing. Forty characters is the
          # same floor `service-ci.yml`'s scope-exemption file already applies to the same kind of decision,
          # so the estate has one answer to "how much writing is a decision". A marker with a short reason
          # is itself a finding: silently ignoring it would let the reflex back in.
          function allow_reason(s,   k, r) {
            k = index(s, MARKER)
            if (k == 0) return -1
            r = substr(s, k + length(MARKER))
            sub(/^[^A-Za-z0-9]*/, "", r)
            sub(/[^A-Za-z0-9.)]*$/, "", r)
            return length(r)
          }

          function report(kind, name, val,   seen) {
            seen = FN ":" LN ":" name ":" kind
            if (done[seen]) return
            done[seen] = 1
            if (benign(val) != "") return
            if (path_exempt(FN) != "") return
            if (name_is_identifier(name)) return
            if ((kind == "assign" || kind == "js-const") && name_is_denial(name)) return
            if (istest) return
            if (acc_allowed) return
            # The VALUE is the last field and is never printed by the shell below — it exists on this line
            # only so the digest can be computed from it. See this file's header.
            printf "%s\t%d\t%s\t%s\t%d\t%s\n", FN, LN, kind, name, length(val), val
            hits++
          }

          # One LOGICAL line: comments already stripped, continuations already joined.
          function scan(s,   i, j, k, p, q, c, nm, rest, val, depth, op, t) {
            # FORM 1 — parameter-expansion default: ${FOO_PASSWORD:-literal}. The shape from #276, and the
            # one compose files use too, which is why *.yml is scanned.
            if (!(inheredoc && hdquoted)) {
              i = 1
              while (i <= length(s) - 3) {
                if (substr(s, i, 2) == "${") {
                  j = i + 2; nm = ""
                  while (j <= length(s) && substr(s, j, 1) ~ /[A-Za-z0-9_]/) { nm = nm substr(s, j, 1); j++ }
                  if (substr(s, j, 2) == ":-" && nm != "" && is_cred(nm, 1)) {
                    # Brace-depth counted, so `${A:-${B:-}}` yields a value containing `$` and is cleared by
                    # `names-another-variable` rather than truncated into a literal that looks like one.
                    j += 2; depth = 1; val = ""
                    while (j <= length(s)) {
                      c = substr(s, j, 1)
                      if (c == "{") depth++
                      if (c == "}") { depth--; if (depth == 0) break }
                      val = val c; j++
                    }
                    report("shell-default", nm, val)
                  }
                  i = j
                }
                i++
              }
            }

            if (isjs) {
              # FORM 2 — the JS equivalent: process.env.FOO_PASSWORD || 'literal', env['X'] ?? "literal".
              i = 1
              while (i <= length(s)) {
                k = index(substr(s, i), "env")
                if (k == 0) break
                p = i + k - 1
                rest = substr(s, p + 3); nm = ""
                if (substr(rest, 1, 1) == ".") {
                  j = 2
                  while (j <= length(rest) && substr(rest, j, 1) ~ /[A-Za-z0-9_]/) { nm = nm substr(rest, j, 1); j++ }
                  rest = substr(rest, j)
                } else if (substr(rest, 1, 1) == "[") {
                  q = substr(rest, 2, 1)
                  if (q == "'" || q == "\"") {
                    nm = qlit(rest, 2); j = 2 + length(nm) + 2
                    if (substr(rest, j, 1) == "]") j++
                    rest = substr(rest, j)
                  }
                }
                # An env-var name, whatever the language reading it — so KEY and PASS count here.
                if (nm != "" && is_cred(nm, 1)) {
                  sub(/^[ \t]*/, "", rest)
                  op = substr(rest, 1, 2)
                  if (op == "||" || op == "??") {
                    rest = substr(rest, 3); sub(/^[ \t]*/, "", rest)
                    q = substr(rest, 1, 1)
                    if (q == "'" || q == "\"" || q == "`") report("js-fallback", nm, qlit(rest, 1))
                  }
                }
                i = p + 3
              }

              # FORM 4 — a declaration bound to a literal: const password = 'literal'.
              t = s; sub(/^[ \t]*/, "", t)
              if (t ~ /^(export[ \t]+)?(const|let|var)[ \t]/) {
                sub(/^export[ \t]+/, "", t); sub(/^(const|let|var)[ \t]+/, "", t)
                nm = ""; j = 1
                while (j <= length(t) && substr(t, j, 1) ~ /[A-Za-z0-9_$]/) { nm = nm substr(t, j, 1); j++ }
                rest = substr(t, j); sub(/^[ \t]*(:[^=]*)?/, "", rest)
                if (substr(rest, 1, 1) == "=" && substr(rest, 2, 1) != "=" && nm != "" && is_cred(nm, 0)) {
                  rest = substr(rest, 2); sub(/^[ \t]*/, "", rest)
                  q = substr(rest, 1, 1)
                  if (q == "'" || q == "\"" || q == "`") report("js-const", nm, qlit(rest, 1))
                }
              }

              # FORM 5 — an object property bound to a literal: { password: 'literal' }. This is how a
              # credential is actually handed to an HTTP call in this estate, and it is the shape beacon's
              # `journeys.ts` and `fixtures.ts` used to register thousands of real accounts on mainnet with
              # the published password. Without it, two of the four sites in #276 item 1 go unseen.
              t = s; sub(/^[ \t]*/, "", t)
              sub(/^[{,][ \t]*/, "", t)
              nm = ""
              if (substr(t, 1, 1) == "'" || substr(t, 1, 1) == "\"") {
                nm = qlit(t, 1); j = length(nm) + 3
                # A QUOTED key carrying a dot, colon or slash is a namespaced identifier, not a variable:
                # identity's `'identity.password.reset_requested': 'resetUrl'` maps an event topic to the
                # field to scrub. A topic name is public by construction — it is in the contracts package.
                if (nm ~ /[.:\/]/) nm = ""
              }
              else { j = 1; while (j <= length(t) && substr(t, j, 1) ~ /[A-Za-z0-9_$]/) { nm = nm substr(t, j, 1); j++ } }
              rest = substr(t, j); sub(/^[ \t]*/, "", rest)
              if (substr(rest, 1, 1) == ":" && nm != "" && is_cred(nm, 0)) {
                rest = substr(rest, 2); sub(/^[ \t]*/, "", rest)
                q = substr(rest, 1, 1)
                if (q == "'" || q == "\"" || q == "`") report("js-property", nm, qlit(rest, 1))
              }
            } else if (!inheredoc) {
              # FORM 3 — a shell assignment to a literal: FOO_PASSWORD="literal".
              t = s; sub(/^[ \t]*/, "", t)
              sub(/^(export|readonly|local|declare)[ \t]+/, "", t)
              if (t ~ /^[A-Za-z_][A-Za-z0-9_]*=/) {
                j = index(t, "="); nm = substr(t, 1, j - 1); rest = substr(t, j + 1)
                if (is_cred(nm, 1)) {
                  q = substr(rest, 1, 1)
                  if (q == "'" || q == "\"") val = qlit(rest, 1)
                  else { val = rest; sub(/[ \t].*$/, "", val) }
                  report("assign", nm, val)
                }
              }
            }
          }

          function flush() {
            if (acc == "") return
            LN = acc_line
            scan(acc)
            acc = ""
          }

          BEGIN { MARKER = "secret-hygiene: allow" }

          FNR == 1 {
            flush()
            FN = FILENAME
            sub(/^\.\//, "", FN)
            isjs = (FN ~ /\.(ts|tsx|js|jsx|mjs|cjs)$/)
            inblock = 0; inheredoc = 0; hd = ""; hdquoted = 0; prev_ok = 0
            acc = ""; acc_allowed = 0; joins = 0
            # A FILE THAT IMPORTS A TEST RUNNER IS TEST CODE, whatever it is named or wherever it sits.
            # `market/scripts/verify.ts` and `worlds/scripts/verify.ts` are harnesses living under
            # `scripts/`; both import `../src/testsupport.ts` and both hold a fixture secret.
            istest = 0
            if (isjs) {
              while ((getline probe < FILENAME) > 0) {
                if (probe ~ /(from|require)[ \t]*\(?[ \t]*['"][^'"]*(node:test|vitest|testsupport|test-support|@playwright\/test)/) { istest = 1; break }
              }
              close(FILENAME)
            }
          }

          {
            raw = $0
            rl = allow_reason(raw)
            # A BARE MARKER IS A FINDING ONLY WHERE A MARKER WOULD DO SOMETHING. In a path-exempt file
            # it does nothing, so complaining about it is noise — and worse than noise: measured on
            # this repository, the unguarded version of this branch failed micro-org on FOUR lines,
            # every one of them a file DESCRIBING the marker. Two were in this very step (the awk
            # `MARKER =` definition and the guidance text that tells a reader what to write) and two
            # were in `test/fixtures/` demonstrating what a bare mute looks like. That is the estate's
            # most repeated defect — a guard that fires on its own documentation — and it would have
            # shipped to sixty-nine repositories at once. The fixtures still assert this finding,
            # because the suite runs the checker with its working directory INSIDE the fixture
            # directory, where those files are not on a test path.
            if (rl >= 0 && rl < MIN_REASON && path_exempt(FN) == "") {
              printf "%s\t%d\t%s\t%s\t%d\t%s\n", FN, FNR, "allow-without-reason", "-", 0, ""
              hits++
            }

            # ---- COMMENTS ARE STRIPPED BEFORE ANYTHING IS MATCHED --------------------------------------
            #
            # This is not a nicety. The FIXED `estate-bootstrap.sh` quotes the exact defective line in the
            # comment explaining why it is gone, so a checker that read raw text would fail the file that
            # fixes the bug it checks for — and six guards in this estate have already fired on their own
            # documentation and been "fixed" by deleting the prose. `test/workflow-shell.test.ts` exists
            # because that happened twelve times.
            #
            # Full-line comments only. A trailing `#` cannot be told from a `#` inside a quoted string
            # without a shell parser, and guessing wrong SUPPRESSES findings, which is the direction a
            # security check must never guess in.
            skip = 0
            line = raw
            if (isjs) {
              if (inblock) {
                if (index(line, "*/") > 0) { inblock = 0; line = substr(line, index(line, "*/") + 2) } else skip = 1
              }
              if (!skip) {
                t = line; sub(/^[ \t]*/, "", t)
                if (t ~ /^\/\//) skip = 1
                else if (t ~ /^\*/) skip = 1
                else if (t ~ /^\/\*/ && index(line, "*/") == 0) { inblock = 1; skip = 1 }
              }
            } else {
              t = line; sub(/^[ \t]*/, "", t)
              if (t ~ /^#/) skip = 1
            }

            # ---- A HEREDOC BODY IS DATA, NOT SHELL -----------------------------------------------------
            # `gateway-cert.sh` writes an openssl extension file containing `keyUsage=critical,…`. That is
            # not an assignment in a script. A parameter expansion inside an UNQUOTED heredoc still is,
            # because the shell still expands it, so only `<<'EOF'` suppresses form 1 as well.
            if (!skip && !isjs && inheredoc) {
              t2 = line; sub(/^[ \t]*/, "", t2)
              if (t2 == hd) { inheredoc = 0; skip = 1 }
            }
            if (!skip && !isjs && !inheredoc && match(line, /<<-?[ \t]*['"]?[A-Za-z_][A-Za-z0-9_]*['"]?/)) {
              hdtok = substr(line, RSTART, RLENGTH)
              sub(/^<<-?[ \t]*/, "", hdtok)
              hdquoted = (hdtok ~ /^['"]/)
              gsub(/['"]/, "", hdtok)
              hd = hdtok
              pending_heredoc = 1
            }

            if (!skip) {
              if (acc == "") { acc_line = FNR; acc_allowed = prev_ok; joins = 0 }
              acc_allowed = acc_allowed || (rl >= MIN_REASON)
              t = line; sub(/[ \t]+$/, "", t)
              if (acc == "") acc = t; else { sub(/^[ \t]+/, "", t); acc = acc " " t }
              joins++
              # A LOGICAL LINE IS JUDGED WHOLE, exactly as `test/workflow-shell.test.ts` insists a multi-line
              # pipeline is. `ui/scripts/footer-audit.ts` spreads one `??` chain over four lines and puts
              # the published password on the last of them; a line-at-a-time reader sees none of it.
              #
              # The continuation tokens are per-language, and that matters for the REPORT as much as for
              # the match. A trailing `:` continues a property in TypeScript, but in YAML it OPENS a
              # mapping — so counting it there would fold `environment:` together with the line beneath
              # it and send the reader to the parent key instead of to the credential. Shell has only
              # `||` and a trailing backslash; `=` and `:` end nothing there.
              if (joins < 8 && ((isjs && acc ~ /(\|\||\?\?|=|:|\\)$/) || (!isjs && acc ~ /(\|\||\\)$/))) { } else flush()
            } else {
              flush()
            }

            prev_ok = (rl >= MIN_REASON)
            if (pending_heredoc) { inheredoc = 1; pending_heredoc = 0 }
          }

          END { flush(); if (hits > 0) exit 1 }
          CREDENTIAL_DEFAULT_AUDIT

          # `-print0` and `-0`: a path with a space in it must not become two paths, and this list
          # is what decides which files are examined at all — losing one loses the check.
          find . \
            \( -name .git -o -name node_modules -o -name dist -o -name build -o -name coverage \
               -o -name .next -o -name vendor -o -name .turbo -o -name target -o -name Pods \) -prune -o \
            -type f \( -name '*.sh' -o -name '*.bash' -o -name '*.yml' -o -name '*.yaml' \
               -o -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \
               -o -name '*.mjs' -o -name '*.cjs' -o -name 'Makefile' -o -name 'Dockerfile*' \) \
            -print0 > "$scratch/credential-default-files" || true

          # THE GUARD THIS FILE'S HEADER IS ABOUT, in a third shape: `xargs` with an EMPTY list
          # runs `awk` once with no file arguments, and `awk` with no file arguments reads stdin —
          # so a repository with nothing to scan would hang the job rather than pass it. `-r` would
          # fix it on GNU and not on BSD, where this is also run.
          if [ ! -s "$scratch/credential-default-files" ]; then
            echo "ok: no shell or JavaScript sources to scan"
            exit 0
          fi

          # `|| true` for the same reason as every other capture in this file, and here it is not
          # theoretical: the script exits 1 the moment it has something to say, which is exactly
          # when the assignment must survive. THE VERDICT IS THE `if` BELOW, never an exit code.
          #
          # LC_ALL=C because the estate's comments are full of em dashes and BSD awk aborts mid-file
          # on a multibyte sequence in `toupper` — silently scanning only part of a repository.
          findings=$(LC_ALL=C xargs -0 awk -v MIN_REASON=40 \
                     -f "$scratch/credential-default-audit.awk" \
                     < "$scratch/credential-default-files" || true)

          if [ -n "$findings" ]; then
            # THE VALUE IS NEVER PRINTED. It travels from awk to `sha256` through a pipe and is
            # never echoed, per this file's header — and the case for that is at its sharpest here,
            # because a finding from this step is by construction a credential somebody committed.
            echo "::error::a credential-shaped literal is standing in for a credential (value withheld):"
            sha256() { if command -v sha256sum >/dev/null 2>&1; then sha256sum; else shasum -a 256; fi; }
            while IFS=$'\t' read -r path lineno kind name len value; do
              [ -n "$path" ] || continue
              if [ "$kind" = "allow-without-reason" ]; then
                echo "  ${path}:${lineno}  an allow marker with no reason beside it — say why, in 40 characters or more"
                continue
              fi
              digest=$(printf '%s' "$value" | sha256 | cut -c1-12)
              echo "  ${path}:${lineno}  ${kind}  ${name}  sha256:${digest}…  (${len} characters)"
            done <<< "$findings"
            echo
            echo "Each line above binds a credential-named variable to a literal. If this repository is"
            echo "public, that literal is public. Delete the default and refuse the unset variable —"
            echo "deploy/scripts/estate-bootstrap.sh is the worked example — or, if the value really is"
            echo "safe, say why on the line above it:  # secret-hygiene: allow <reason, 40+ characters>"
            echo "If any value above was ever deployed, it is spent: rotate it before you edit the file."
            exit 1
          fi
          echo "ok: no credential-shaped defaults"
