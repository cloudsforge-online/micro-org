name: service-ci

# The one CI file for every CloudsForge service.
#
# WHY it is reusable rather than copied: the previous estate had eleven near-identical CI files
# and they had already drifted — different Node versions, different secret checks, one repository
# whose image job never ran. With one repository per service that becomes forty copies, and a
# cross-cutting CI fix becomes forty pull requests. The measured target in
# docs/ecosystem/03-repository-responsibilities.md §5 is **zero bespoke CI files**, and this is
# the file that makes zero achievable.
#
# The `rules` job below is the other half of the argument. Repository walls used to enforce the
# boundaries in 03 §2 for free — a service physically could not read another's tables when they
# were in one tree with one reviewer. Split apart, those boundaries survive only if something
# checks them. Each check names the failure it prevents, because a rule whose cost is not stated
# gets argued with at 5pm on a Friday.

on:
  workflow_call:
    inputs:
      service:
        description: The service name, as in the registry — 'ledger', 'hub-api'.
        required: true
        type: string
      database-env-var:
        description: The ONE database variable this service may read. Defaults to <SERVICE>_DATABASE_URL.
        required: false
        default: ''
        type: string
      port:
        required: false
        default: 8080
        type: number
      node-version:
        required: false
        default: '22'
        type: string
      package-manager:
        description: pnpm or npm. npm only for a repository that genuinely ships a package-lock.json.
        required: false
        default: pnpm
        type: string
      source-dir:
        required: false
        default: src
        type: string
      dockerfile:
        required: false
        default: Dockerfile
        type: string
      build-image:
        required: false
        default: true
        type: boolean
      postgres:
        description: >-
          Start a Postgres service container for the test job and export its DSN as this service's
          declared database variable. Default true, because fifteen of the estate's services have
          database-backed suites and this workflow shipped without any way to run them — every one
          of those repositories would have had a CI that could not execute its own tests. A service
          with genuinely no database sets this false and pays nothing.
        required: false
        default: true
        type: boolean
      postgres-version:
        description: Must match production. A suite that passes on a version nobody runs proves nothing.
        required: false
        default: '16'
        type: string
      migrate-command:
        description: >-
          How to run the one-shot migrator INSIDE the built image, for the startup smoke test. The
          image ships no package manager, so this is a bare interpreter line, not a script name.
          The estate convention is `node --import tsx src/migrator.ts`; a published service that
          runs compiled output overrides it with `node dist/migrator.js`.
        required: false
        default: node --import tsx src/migrator.ts
        type: string
      smoke-env:
        description: >-
          Extra `KEY=VALUE` lines (one per line) the startup smoke test passes to both the migrator
          and the service container. A service whose `env.ts` validates its configuration at import
          — every service in this estate does — exits before it serves `/livez` unless the variables
          it declares are present, so the smoke test could never boot it on the database alone. These
          are CI-only non-secrets: a throwaway token that clears a length check, a JWKS URL that is
          never dialled because `/livez` needs no identity. Never a real credential.
        required: false
        default: ''
        type: string
    secrets:
      estate_token:
        description: >-
          A token with `contents:read` on micro-runtime and micro-contracts, so this workflow can
          check them out as siblings. The estate resolves @cloudsforge/* through `link:../runtime`
          rather than a registry — the npm scope (@cloudsforge) does not match the GitHub org
          (cloudsforge-online), so GitHub Packages cannot host these packages, and every service
          therefore consumes the runtime as a sibling checkout the way the bespoke workflows did.
          A caller passes it with `secrets: inherit`. Falls back to the job token, which succeeds
          only if the sibling repositories are public.
        required: false

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    # The suites in this estate test against a real Postgres deliberately — deferred constraint
    # triggers, `FOR UPDATE SKIP LOCKED` leases and advisory locks are the things most worth
    # proving, and not one of them exists in a fake. A workflow with no database could therefore
    # run only the suites that prove the least.
    services:
      postgres:
        # A service container has no `if:`. An EMPTY image is the supported way to declare one
        # conditionally — the runner skips a service whose image expression evaluates to '', so a
        # service that sets `postgres: false` starts no container and waits for nothing.
        image: ${{ inputs.postgres && format('postgres:{0}', inputs.postgres-version) || '' }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          # `ci_test`, not `ci`. Every testsupport.ts in the estate refuses a DSN whose name does
          # not match /test/i — a deliberate guard against a suite that truncates tables pointing
          # at something real. A database called `ci` would be rejected by that guard and the
          # suite would skip, which is the failure this whole block exists to end.
          POSTGRES_DB: ci_test
        ports: ['5432:5432']
        # Without this the first test connects before Postgres is accepting, and the failure looks
        # like a flaky suite rather than a race with the container.
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # ────────────────────────────────────────────────────────────────────────────────────────────
    # THE SERVICE AND THE RUNTIME ARE SIBLINGS, because @cloudsforge/* is resolved by
    # `link:../runtime/packages/*`, not by a registry.
    #
    # This workflow first tried a single checkout with a scoped GitHub Packages registry — the clean
    # end state, and unreachable today: the npm scope is @cloudsforge and the GitHub org is
    # cloudsforge-online, and GitHub Packages will only host a scope that matches the org, so nothing
    # can be published there. A `link:` dependency, meanwhile, is a symlink to a path — with no
    # sibling on disk it installs as a DANGLING link that resolves to nothing, which is why `Install`
    # passed and `Typecheck` then could not find a single @cloudsforge module. Every service in the
    # estate is built this way, so the workflow could not have typechecked any of them.
    #
    # So the service goes in `service/`, the runtime and contracts beside it, and the siblings are
    # installed FIRST — `link:` resolves to the sibling's own node_modules, which must therefore
    # exist before the service install runs.
    # ────────────────────────────────────────────────────────────────────────────────────────────
    steps:
      - uses: actions/checkout@v4
        with: { path: service }
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-runtime
          path: runtime
          token: ${{ secrets.estate_token || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-contracts
          path: contracts
          token: ${{ secrets.estate_token || github.token }}
      - uses: pnpm/action-setup@v4
        if: inputs.package-manager == 'pnpm'
        with:
          # Pinned, because the service's package.json is in service/ now and pnpm/action-setup
          # looks in the working directory for the packageManager field. Every service in the
          # estate is on pnpm@11.9.0.
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: service/pnpm-lock.yaml
      - name: Install the sibling runtime and contracts
        # `link:` resolves to a sibling's OWN node_modules, so the siblings must be installed before
        # the service is. This is the price of `link:`, and it is the same order the bespoke
        # workflows used before this one existed.
        if: inputs.package-manager == 'pnpm'
        run: |
          set -euo pipefail
          [ -f runtime/pnpm-lock.yaml ] && pnpm --dir runtime install --frozen-lockfile
          [ -f contracts/pnpm-lock.yaml ] && pnpm --dir contracts install --frozen-lockfile
      - name: Install
        working-directory: service
        run: |
          if [ "${{ inputs.package-manager }}" = "npm" ]; then
            npm ci
          else
            pnpm install --frozen-lockfile
          fi
      - name: Typecheck
        working-directory: service
        run: ${{ inputs.package-manager }} run typecheck

      - name: Test
        working-directory: service
        # The DSN is exported under the service's OWN variables, resolved exactly as the `rules`
        # job resolves them. A generic DATABASE_URL alone would not do: every suite in this estate
        # reads `<SERVICE>_TEST_DATABASE_URL` and skips when it is absent.
        #
        # THAT SKIP IS WHY THIS STEP IS SHAPED LIKE THIS. Before the service container existed,
        # the variable was never set, so every database-backed test in fifteen services skipped
        # and CI went green. Green while proving nothing is materially worse than red: the estate
        # believed its ledger's deferred constraints, its custody overdraft trigger and its
        # settlement lease were covered by CI, and not one of those assertions had executed there.
        # So the run is checked for the skip afterwards and the build fails if it happened.
        env:
          CI_DSN: postgres://ci:ci@127.0.0.1:5432/ci_test
          SERVICE: ${{ inputs.service }}
          DECLARED: ${{ inputs.database-env-var }}
          NEEDS_DB: ${{ inputs.postgres }}
        run: |
          set -uo pipefail
          if [ "$NEEDS_DB" = "true" ]; then
            want="$DECLARED"
            if [ -z "$want" ]; then
              want="$(printf '%s' "$SERVICE" | tr '[:lower:]-' '[:upper:]_')_DATABASE_URL"
            fi
            # The suite's variable is the declared one with _TEST_ in it: LEDGER_DATABASE_URL ->
            # LEDGER_TEST_DATABASE_URL. Both are exported, because migration helpers read the
            # first and testsupport.ts reads the second.
            test_var="${want/_DATABASE_URL/_TEST_DATABASE_URL}"
            echo "database exported as ${want} and ${test_var}"
            export "$want=$CI_DSN"
            export "$test_var=$CI_DSN"
            export DATABASE_URL="$CI_DSN"
          fi

          set -o pipefail
          ${{ inputs.package-manager }} run test 2>&1 | tee /tmp/test-output.txt
          status=$?

          if [ "$NEEDS_DB" = "true" ]; then
            if grep -qiE 'set [A-Z_]*TEST_DATABASE_URL|database tests are disabled' /tmp/test-output.txt; then
              echo "::error::the database-backed tests SKIPPED — CI would have gone green without running them"
              echo "The suite could not see a usable DSN. It must contain 'test' in the database name;"
              echo "check that this service reads <SERVICE>_TEST_DATABASE_URL and that inputs.service matches."
              exit 1
            fi
          fi
          exit $status

  rules:
    name: The rules that repository walls used to enforce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rule 1 — a service owns exactly one database and reads no other.
      #
      # The estate's most valuable property is that no service reads another's tables. It held
      # because it was awkward to break, not because anything stopped you. A second connection
      # string in a repository is the first step of every distributed monolith ever built, and
      # once one service reads another's schema, neither can migrate independently again.
      - name: One database, and only its own
        env:
          SERVICE: ${{ inputs.service }}
          DECLARED: ${{ inputs.database-env-var }}
        run: |
          set -uo pipefail
          src="${{ inputs.source-dir }}"
          want="$DECLARED"
          if [ -z "$want" ]; then
            want="$(printf '%s' "$SERVICE" | tr '[:lower:]-' '[:upper:]_')_DATABASE_URL"
          fi
          [ -d "$src" ] || { echo "::error::${src}/ does not exist"; exit 1; }

          # Every *_DATABASE_URL / *_DB_URL style variable the source reads.
          #
          # Comment bodies are stripped first. The check used to grep raw source, so writing
          # `LEDGER_DATABASE_URL` inside a comment explaining why this service does NOT read the
          # ledger's database failed the build — the rule fired on its own rationale. That is the
          # same defect the web template's nginx guard had, and it has the same consequence:
          # engineers learn to delete the explanation rather than write it, and the codebase loses
          # precisely the comments that make a boundary survive a reviewer who was not there when
          # it was drawn. A rule that punishes documenting the rule is worse than no rule.
          # MULTI-LINE blocks matter more than line comments here: this estate documents every
          # boundary in a `/** ... */` header, which is exactly where a sibling service's variable
          # name gets written down. A stripper that only handled `//` would miss the common case.
          strip_comments() {
            awk '
              { line = $0; out = ""
                while (length(line) > 0) {
                  if (inblock) {
                    i = index(line, "*/")
                    if (i == 0) { line = ""; break }
                    inblock = 0; line = substr(line, i + 2); continue
                  }
                  b = index(line, "/*"); l = index(line, "//")
                  if (l > 0 && (b == 0 || l < b)) { out = out substr(line, 1, l - 1); line = ""; break }
                  if (b > 0) { out = out substr(line, 1, b - 1); line = substr(line, b + 2); inblock = 1; continue }
                  out = out line; line = ""
                }
                print out
              }' "$1"
          }

          # Test files are excluded, exactly as the hard-coded-DSN check below already excludes
          # them. A test is where a service legitimately NAMES another service's variable — to
          # prove it is ignored. micro-market has precisely that test, and had to assemble the name
          # from `['LEDGER','DATABASE','URL'].join('_')` to get past this check: the rule forced a
          # test that agrees with the rule to obscure what it asserts. Two of the three defects
          # found in this file were this same shape, a check that reads text rather than meaning.
          stripped=$(mktemp -d)
          while IFS= read -r f; do
            mkdir -p "$stripped/$(dirname "$f")"
            strip_comments "$f" > "$stripped/$f"
          done < <(find "$src" -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' \) \
                     ! -name '*.test.*' ! -name '*.spec.*' -print)

          read_vars=$(grep -rhoE '[A-Z][A-Z0-9_]*_(DATABASE_URL|DB_URL|POSTGRES_URL)' "$stripped" 2>/dev/null | sort -u || true)
          # A service's own TEST database is its own database. The check compared against `$want`
          # by exact string, so `LEDGER_TEST_DATABASE_URL` — which every testsupport.ts in the
          # estate reads, by construction — counted as "another service's database" and failed the
          # build. Rule 1 as written rejected all fifteen services it was meant to protect, and
          # nobody had noticed because no repository's CI had run this workflow yet.
          #
          # The rule's actual intent is a PREFIX question: does this source read a database
          # belonging to a service that is not this one? So the comparison is on the namespace.
          prefix="${want%_DATABASE_URL}"
          others=$(printf '%s\n' "$read_vars" \
                   | grep -vxE "${prefix}_(TEST_)?(DATABASE_URL|DB_URL|POSTGRES_URL)" \
                   | grep -v '^$' || true)
          if [ -n "$others" ]; then
            echo "::error::${SERVICE} reads a database that is not its own: $(echo "$others" | tr '\n' ' ')"
            echo "Rule 1: a service owns exactly one database and reads no other. The answer to needing"
            echo "another service's data is an HTTP call typed by a published contract, never a second DSN."
            exit 1
          fi

          # A hard-coded DSN bypasses the variable check entirely, and is also a credential in a
          # repository. Tests and examples are exempt; they point at throwaway databases.
          literals=$(grep -rnE '(postgres|postgresql|mysql)://[a-zA-Z0-9_]+:' "$src" 2>/dev/null \
                     | grep -vE '\.(test|spec)\.[jt]s' | grep -v 'example' || true)
          if [ -n "$literals" ]; then
            echo "::error::a connection string is written into the source:"
            echo "$literals"
            exit 1
          fi
          echo "ok: reads $want and nothing else"

      # Rule 2 — no service imports another service's source.
      #
      # With one repository per service this is physically true on day one. It stops being true
      # the first time a 'shared helper' is convenient: a path import into a sibling checkout, or
      # a package in the @cloudsforge scope that is really a service's internals. The answer is a
      # package in micro-runtime, or duplication. Never a cross-repo path import.
      - name: No cross-service source imports
        run: |
          set -uo pipefail
          src="${{ inputs.source-dir }}"
          failed=0

          # A relative import climbing three or more levels has left this repository.
          escapes=$(grep -rnE "from '(\.\./){3,}" "$src" 2>/dev/null || true)
          if [ -n "$escapes" ]; then
            echo "::error::an import escapes this repository:"
            echo "$escapes"
            failed=1
          fi

          # A path import naming another checkout by name.
          siblings=$(grep -rnE "from '[^']*(repos|micro)/[a-z0-9-]+/(src|services|packages)" "$src" 2>/dev/null || true)
          if [ -n "$siblings" ]; then
            echo "::error::an import reaches into another repository's checkout:"
            echo "$siblings"
            failed=1
          fi

          # The @cloudsforge scope is for published contracts and runtime libraries only. This
          # list is the same one in micro-org tools/registry.ts (ALLOWED_SCOPED_PACKAGES); cfctl
          # doctor checks package.json against it, and this checks the imports.
          allowed='contracts-auth|contracts-money|contracts-chain|contracts-market|contracts-worlds|contracts-create|contracts-events|contracts-devplatform|telemetry|http|jobs|auth|db|lifecycle|policy-client|ui|ui-charts|sdk|cli|hearth-node'
          # Quoted only. An unquoted @cloudsforge/x in prose is a comment naming a package, and a
          # check that cannot tell those apart is a check people learn to work around by
          # rewording comments.
          scoped=$(grep -rhoE "['\"]@cloudsforge/[a-z0-9-]+['\"]" "$src" 2>/dev/null | tr -d "'\"" | sort -u || true)
          # `|| true` for the reason given at rule 1: a filter that removes everything exits 1,
          # and removing everything is what a compliant service looks like.
          bad=$(printf '%s\n' "$scoped" | grep -vE "^@cloudsforge/($allowed)$" | grep -v '^$' || true)
          if [ -n "$bad" ]; then
            echo "::error::not a published contract or runtime package: $(echo "$bad" | tr '\n' ' ')"
            echo "A cross-service import wearing a package name is still a cross-service import."
            failed=1
          fi

          [ "$failed" = "0" ] || exit 1
          echo "ok: no cross-service source imports"

      # Rule 4 — every service exposes /livez, /readyz and /metrics.
      #
      # Three endpoints because they answer three different questions to three different callers.
      # A service that serves one /health for all of them cannot be drained: the load balancer
      # cannot be told to stop sending traffic without the orchestrator also deciding the process
      # is dead and restarting it mid-drain.
      - name: /livez, /readyz and /metrics are all served
        run: |
          set -uo pipefail
          src="${{ inputs.source-dir }}"
          missing=''
          for route in /livez /readyz /metrics; do
            grep -rqF "$route" "$src" 2>/dev/null || missing="$missing $route"
          done
          if [ -n "$missing" ]; then
            echo "::error::${{ inputs.service }} does not serve:$missing"
            echo "/livez is static (is the process alive). /readyz checks Postgres, JWKS and every declared"
            echo "upstream (should it get traffic). /metrics is Prometheus text format. AD-17, rule 4."
            exit 1
          fi
          echo "ok: all three are served"

      # Rule 9 — secrets are per-service, and env_file fan-out is banned.
      #
      # The estate's highest-severity finding and close to free to fix: every container received
      # every secret in the file, so a compromise of the marketing site handed over the custody
      # master secret. A repository declares the variables it needs; the deploy provides exactly
      # those.
      - name: No env_file fan-out
        run: |
          set -uo pipefail
          files=$(git ls-files | grep -E '(docker-)?compose.*\.ya?ml$' || true)
          [ -n "$files" ] || { echo "ok: no compose files in this repository"; exit 0; }
          bad=''
          for file in $files; do
            hits=$(grep -nE "env_file:\s*\.?/?\.env\s*$|^\s*-\s*\.?/?\.env\s*$" "$file" || true)
            [ -n "$hits" ] && bad="$bad\n$file:\n$hits"
          done
          if [ -n "$bad" ]; then
            echo "::error::a compose file hands this container the whole estate's .env"
            printf '%b\n' "$bad"
            echo "Name the variables, or point at .env.${{ inputs.service }}. Rule 9."
            exit 1
          fi
          echo "ok: no env_file fan-out"

      # `.env.example` states the port the service actually defaults to.
      #
      # Not pedantry: `.env.example` is what a person copies to `.env` before running the thing.
      # `micro-notify` shipped `PORT=4600` while `src/env.ts` defaulted to 4012, and
      # `micro-settlement` shipped `PORT=4008` — the port `micro-custody` and `micro-indexer` both
      # bind — while its own code defaulted to 4000. Copying that file verbatim put three services
      # on one port, and the file and the code disagreed with no note saying which was right.
      #
      # This checks agreement, NOT any particular number. A service is free to choose any port; it
      # is not free to document a different one than it uses. If the example deliberately differs,
      # the right move is to say so in the file — and then this fails, which is the conversation.
      - name: The example config states the port the code actually uses
        run: |
          set -uo pipefail
          [ -f .env.example ] || { echo "ok: no .env.example"; exit 0; }
          [ -f src/env.ts ] || { echo "ok: no src/env.ts"; exit 0; }

          # The declared default, read out of the integer() call rather than from a comment.
          coded=$(grep -oE "'PORT', *[0-9]+" src/env.ts | grep -oE '[0-9]+$' | head -1 || true)
          # The example's value, ignoring commented-out lines and any *_PORT (SMTP_PORT et al).
          example=$(grep -E '^PORT=[0-9]+' .env.example | head -1 | cut -d= -f2 || true)

          if [ -z "$coded" ] || [ -z "$example" ]; then
            echo "ok: nothing to compare (coded='${coded:-none}' example='${example:-none}')"
            exit 0
          fi
          if [ "$coded" != "$example" ]; then
            echo "::error::.env.example says PORT=${example}, but src/env.ts defaults to ${coded}"
            echo "A person copies .env.example to .env and runs the service. Whichever is right,"
            echo "they must agree — micro-notify said 4600 and meant 4012, and micro-settlement"
            echo "said 4008, which is a port two other services bind."
            exit 1
          fi
          echo "ok: .env.example and src/env.ts agree on PORT=${coded}"

      # Rule 8 — every background timer is a leased job.
      #
      # setInterval doing domain work is correct with exactly one replica and wrong with two:
      # both timers fire, both claim the same work, and for a withdrawal that means two
      # signatures against one nonce, which loses a payment permanently. The lease key names the
      # contended resource, not the row.
      - name: No setInterval doing domain work
        run: |
          set -uo pipefail
          src="${{ inputs.source-dir }}"
          # A call, not a mention: 'setInterval(' rather than 'setInterval', and never on a line
          # that is a comment. The rule has to be explainable in a comment without the comment
          # failing the build.
          hits=$(grep -rnE 'setInterval\s*\(' "$src" 2>/dev/null \
                 | grep -vE '\.(test|spec)\.[jt]s' \
                 | grep -vE ':[0-9]+:\s*(//|\*|/\*)' \
                 | grep -v 'cfctl-allow setInterval' || true)
          if [ -n "$hits" ]; then
            echo "::error::setInterval in ${{ inputs.service }}:"
            echo "$hits"
            echo ""
            echo "Rule 8: background work is a leased job claimed FOR UPDATE SKIP LOCKED"
            echo "(@cloudsforge/jobs). If this timer genuinely does no domain work — a metrics"
            echo "flush, a cache sweep — mark the line 'cfctl-allow setInterval' and say why."
            exit 1
          fi
          echo "ok: no unmarked setInterval"

      # ---------------------------------------------------------------- README --
      - name: The repository documents itself
        # TWELVE REPOSITORIES HAD NO README AT ALL — activity, billing, contracts, docs, identity,
        # indexer, ledger, mint, notify, policy, pricing and worlds — and every one of them was
        # green. Nothing anywhere asserted that a deployable explains itself, so the omission was
        # invisible exactly the way four frontends shipping with no favicon was invisible until
        # `brand-chrome.test.ts` existed.
        #
        # CALIBRATED AGAINST THE READMEs THAT ARE ALREADY GOOD, deliberately. Ten were measured
        # first: route tables and configuration tables are NOT universal — micro-lantern and
        # micro-emberkin document neither and are both strong — so requiring them would fail
        # correct work, which is how six guards in this estate came to fire on their own prose.
        # What every good one does have is substance and a way to run the thing. That is the bar.
        #
        # It is a floor, not a specification. A README that clears it can still be poor; one that
        # does not clear it is certainly missing.
        run: |
          set -uo pipefail
          if [ ! -f README.md ]; then
            echo "::error::this repository has no README.md"
            echo "A deployable that does not explain itself is one nobody can operate or extend."
            echo "The shape and the reasoning are in micro-org: templates/README.template.md"
            exit 1
          fi

          bytes=$(wc -c < README.md | tr -d ' ')
          if [ "$bytes" -lt 4000 ]; then
            echo "::error::README.md is ${bytes} bytes — a stub, not documentation"
            echo "The smallest genuinely-documented service in this estate is about 6 kB."
            exit 1
          fi

          # Every well-documented repository here says how to run and test it. It is the one
          # section that is universal, and the first thing a new reader needs.
          if ! grep -qiE 'pnpm (test|dev|install)|docker (run|compose)' README.md; then
            echo "::error::README.md never says how to run or test this repository"
            echo "Include the real commands, including the Postgres the suite needs."
            exit 1
          fi
          echo "ok: README.md is ${bytes} bytes and says how to run the repository"

  image:
    name: Docker image
    if: inputs.build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # ────────────────────────────────────────────────────────────────────────────────────────────
    # THE NINTH DEFECT: this smoke test could not have passed for any service in the estate.
    #
    # It started the image with a DSN pointing at 127.0.0.1:5432 — where, under `docker run`'s
    # default bridge network, NOTHING listens, because that address is the container itself and no
    # Postgres was ever started for this job — and then waited thirty seconds for a `/livez` the
    # container could never serve. Every service here asserts its schema at boot (`index.ts` calls
    # `assertSchemaAtLeast` and exits otherwise, deliberately) and validates its environment at
    # import (`env.ts` exits on a missing variable), so with no database and none of its declared
    # env the process exits long before it binds a socket. Like the eight defects before it, this
    # one survived only because no repository had pushed and run the job.
    #
    # The fix gives the smoke test what a real service is entitled to expect: the same Postgres the
    # test job gets, reached over host networking, migrated with the image's own one-shot migrator,
    # and the service's declared configuration via `smoke-env`. A service with no database
    # (postgres:false) keeps the old bridge-network path and needs none of it.
    # ────────────────────────────────────────────────────────────────────────────────────────────
    services:
      postgres:
        image: ${{ inputs.postgres && format('postgres:{0}', inputs.postgres-version) || '' }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # The runtime and contracts are checked out as NAMED BUILD CONTEXTS, not into the source tree:
      # the estate's Dockerfiles resolve their `link:` dependencies with `COPY --from=runtimepkgs`
      # (and, where a service uses money contracts, `--from=contractspkgs`). Without them the build
      # fails at the first COPY — the image half of the same `link:`-has-no-sibling defect the build
      # job hit. Passing a context the Dockerfile does not reference is harmless.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-runtime
          path: runtime-ctx
          token: ${{ secrets.estate_token || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-contracts
          path: contracts-ctx
          token: ${{ secrets.estate_token || github.token }}
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          build-contexts: |
            runtimepkgs=${{ github.workspace }}/runtime-ctx
            contractspkgs=${{ github.workspace }}/contracts-ctx
          push: false
          load: true
          tags: ${{ inputs.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A built image proves the Dockerfile parses. It does not prove the image can START, and
      # 'container is unhealthy' with no logs is the shape of silent failure this estate has been
      # bitten by more than once. So: give it a database and its declared config, migrate, start it,
      # and read the endpoint the load balancer reads.
      - name: The image migrates, starts and answers /livez
        env:
          NEEDS_DB: ${{ inputs.postgres }}
          DECLARED: ${{ inputs.database-env-var }}
          SERVICE: ${{ inputs.service }}
          PORT: ${{ inputs.port }}
          MIGRATE: ${{ inputs.migrate-command }}
          SMOKE_ENV: ${{ inputs.smoke-env }}
        run: |
          set -uo pipefail
          image="${SERVICE}:ci"
          name="ci-${SERVICE}"

          # The declared database variable, defaulted the same way every other job defaults it.
          dbvar="$DECLARED"
          if [ -z "$dbvar" ]; then
            dbvar="$(printf '%s' "$SERVICE" | tr '[:lower:]-' '[:upper:]_')_DATABASE_URL"
          fi

          # The service's declared configuration, one `-e` per non-empty line.
          env_args=()
          while IFS= read -r line; do
            [ -n "$line" ] && env_args+=(-e "$line")
          done <<< "$SMOKE_ENV"
          env_args+=(-e "PORT=${PORT}")

          net=(-p "127.0.0.1:${PORT}:${PORT}")
          if [ "$NEEDS_DB" = "true" ]; then
            dsn="postgres://ci:ci@127.0.0.1:5432/ci_test"
            # HOST networking so the container reaches the Postgres SERVICE on the runner's
            # 127.0.0.1:5432. Bridge networking is exactly what put 127.0.0.1 inside the container,
            # where nothing listened — the heart of this defect. `-p` is meaningless under host mode,
            # so it is dropped in favour of the port binding directly on the host.
            net=(--network host)
            env_args+=(-e "${dbvar}=${dsn}")
            echo "migrating the schema the service will assert, using the image's own migrator"
            docker run --rm --network host "${env_args[@]}" "$image" $MIGRATE
          fi

          docker run -d --name "$name" "${net[@]}" "${env_args[@]}" "$image"

          for attempt in $(seq 1 30); do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/livez" || true)
            [ "$code" = "200" ] && { echo "ok: /livez answered after ${attempt}s"; exit 0; }
            # A container that has already exited will never answer; stop waiting and show why.
            docker ps --format '{{.Names}}' | grep -qx "$name" || break
            sleep 1
          done
          echo "::error::the image never answered /livez"
          docker logs --tail 80 "$name" || true
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker logs --tail 100 "ci-${{ inputs.service }}" || true
      - name: Down
        if: always()
        run: docker rm -f "ci-${{ inputs.service }}" || true
