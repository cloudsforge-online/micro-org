name: service-ci

# The one CI file for every CloudsForge service.
#
# WHY it is reusable rather than copied: the previous estate had eleven near-identical CI files
# and they had already drifted — different Node versions, different secret checks, one repository
# whose image job never ran. With one repository per service that becomes forty copies, and a
# cross-cutting CI fix becomes forty pull requests. The measured target in
# docs/ecosystem/03-repository-responsibilities.md §5 is **zero bespoke CI files**, and this is
# the file that makes zero achievable.
#
# The `rules` job below is the other half of the argument. Repository walls used to enforce the
# boundaries in 03 §2 for free — a service physically could not read another's tables when they
# were in one tree with one reviewer. Split apart, those boundaries survive only if something
# checks them. Each check names the failure it prevents, because a rule whose cost is not stated
# gets argued with at 5pm on a Friday.

on:
  workflow_call:
    inputs:
      service:
        description: The service name, as in the registry — 'ledger', 'hub-api'.
        required: true
        type: string
      database-env-var:
        description: The ONE database variable this service may read. Defaults to <SERVICE>_DATABASE_URL.
        required: false
        default: ''
        type: string
      port:
        required: false
        default: 8080
        type: number
      node-version:
        required: false
        default: '22'
        type: string
      package-manager:
        description: pnpm or npm. npm only for a repository that genuinely ships a package-lock.json.
        required: false
        default: pnpm
        type: string
      source-dir:
        required: false
        default: src
        type: string
      dockerfile:
        required: false
        default: Dockerfile
        type: string
      build-image:
        required: false
        default: true
        type: boolean
      postgres:
        description: >-
          Start a Postgres service container for the test job and export its DSN as this service's
          declared database variable. Default true, because fifteen of the estate's services have
          database-backed suites and this workflow shipped without any way to run them — every one
          of those repositories would have had a CI that could not execute its own tests. A service
          with genuinely no database sets this false and pays nothing.
        required: false
        default: true
        type: boolean
      postgres-version:
        description: Must match production. A suite that passes on a version nobody runs proves nothing.
        required: false
        default: '16'
        type: string
      migrate-command:
        description: >-
          How to run the one-shot migrator INSIDE the built image, for the startup smoke test. The
          image ships no package manager, so this is a bare interpreter line, not a script name.
          The estate convention is `node --import tsx src/migrator.ts`; a published service that
          runs compiled output overrides it with `node dist/migrator.js`.
        required: false
        default: node --import tsx src/migrator.ts
        type: string
      smoke-env:
        description: >-
          Extra `KEY=VALUE` lines (one per line) the startup smoke test passes to both the migrator
          and the service container. A service whose `env.ts` validates its configuration at import
          — every service in this estate does — exits before it serves `/livez` unless the variables
          it declares are present, so the smoke test could never boot it on the database alone. These
          are CI-only non-secrets: a throwaway token, a JWKS URL that is never dialled because
          `/livez` needs no identity. Never a real credential.

          `KEY=@generate` asks for a fresh `openssl rand -base64 48`, per run, thrown away after.
          Use it for anything @cloudsforge/secrets guards — the seven aliases of the estate's event
          bus HMAC key — because that guard has no CI exemption on purpose (micro-org #142). A
          throwaway string that clears a length check is exactly what it refuses.

          `KEY=@credential` mints a `cfsc_` + 43-character base64url SERVICE CREDENTIAL, for a slot
          held to `assertServiceCredential`. `KEY=@token` mints a JWT SHAPE, for the slots that
          still read a ten-minute minted token and present it verbatim as a Bearer. Three
          directives because there are three shapes, and THE VARIABLE'S NAME DOES NOT SETTLE WHICH:
          measured on the live estate, `SETTLEMENT_SERVICE_TOKEN` holds a `cfsc_` credential while
          `MARKET_SERVICE_TOKEN` holds a JWT. Read the service's `env.ts` and match its guard.
        required: false
        default: ''
        type: string
    secrets:
      estate_token:
        description: >-
          A token with `contents:read` on micro-runtime and micro-contracts, so this workflow can
          check them out as siblings. The estate resolves @cloudsforge/* through `link:../runtime`
          rather than a registry — the npm scope (@cloudsforge) does not match the GitHub org
          (cloudsforge-online), so GitHub Packages cannot host these packages, and every service
          therefore consumes the runtime as a sibling checkout the way the bespoke workflows did.
          A caller passes it with `secrets: inherit`. Falls back to the job token, which succeeds
          only if the sibling repositories are public.
        required: false

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    # The suites in this estate test against a real Postgres deliberately — deferred constraint
    # triggers, `FOR UPDATE SKIP LOCKED` leases and advisory locks are the things most worth
    # proving, and not one of them exists in a fake. A workflow with no database could therefore
    # run only the suites that prove the least.
    services:
      postgres:
        # A service container has no `if:`. An EMPTY image is the supported way to declare one
        # conditionally — the runner skips a service whose image expression evaluates to '', so a
        # service that sets `postgres: false` starts no container and waits for nothing.
        image: ${{ inputs.postgres && format('postgres:{0}', inputs.postgres-version) || '' }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          # `ci_test`, not `ci`. Every testsupport.ts in the estate refuses a DSN whose name does
          # not match /test/i — a deliberate guard against a suite that truncates tables pointing
          # at something real. A database called `ci` would be rejected by that guard and the
          # suite would skip, which is the failure this whole block exists to end.
          POSTGRES_DB: ci_test
        ports: ['5432:5432']
        # Without this the first test connects before Postgres is accepting, and the failure looks
        # like a flaky suite rather than a race with the container.
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # ────────────────────────────────────────────────────────────────────────────────────────────
    # THE SERVICE AND THE RUNTIME ARE SIBLINGS, because @cloudsforge/* is resolved by
    # `link:../runtime/packages/*`, not by a registry.
    #
    # This workflow first tried a single checkout with a scoped GitHub Packages registry — the clean
    # end state, and unreachable today: the npm scope is @cloudsforge and the GitHub org is
    # cloudsforge-online, and GitHub Packages will only host a scope that matches the org, so nothing
    # can be published there. A `link:` dependency, meanwhile, is a symlink to a path — with no
    # sibling on disk it installs as a DANGLING link that resolves to nothing, which is why `Install`
    # passed and `Typecheck` then could not find a single @cloudsforge module. Every service in the
    # estate is built this way, so the workflow could not have typechecked any of them.
    #
    # So the service goes in `service/`, the runtime and contracts beside it, and the siblings are
    # installed FIRST — `link:` resolves to the sibling's own node_modules, which must therefore
    # exist before the service install runs.
    # ────────────────────────────────────────────────────────────────────────────────────────────
    steps:
      - uses: actions/checkout@v4
        with: { path: service }
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-runtime
          path: runtime
          token: ${{ secrets.estate_token || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-contracts
          path: contracts
          token: ${{ secrets.estate_token || github.token }}
      - uses: pnpm/action-setup@v4
        if: inputs.package-manager == 'pnpm'
        with:
          # Pinned, because the service's package.json is in service/ now and pnpm/action-setup
          # looks in the working directory for the packageManager field. Every service in the
          # estate is on pnpm@11.9.0.
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: service/pnpm-lock.yaml
      - name: Install the sibling runtime and contracts
        # `link:` resolves to a sibling's OWN node_modules, so the siblings must be installed before
        # the service is. This is the price of `link:`, and it is the same order the bespoke
        # workflows used before this one existed.
        if: inputs.package-manager == 'pnpm'
        run: |
          set -euo pipefail
          [ -f runtime/pnpm-lock.yaml ] && pnpm --dir runtime install --frozen-lockfile
          [ -f contracts/pnpm-lock.yaml ] && pnpm --dir contracts install --frozen-lockfile
      - name: Install
        working-directory: service
        run: |
          if [ "${{ inputs.package-manager }}" = "npm" ]; then
            npm ci
          else
            pnpm install --frozen-lockfile
          fi
      - name: Typecheck
        working-directory: service
        run: ${{ inputs.package-manager }} run typecheck

      # ─────────────────────────────────────────────────────────────────────────────────────────
      # Every scope this service's gates demand exists in the contracts registry.
      #
      # The registry knew 14 scopes while the estate's services gated on ~30 more. identity
      # fail-fasts on any grant naming an unknown scope (identity/src/env.ts), so a scope
      # missing from the registry is a service-to-service surface no identity-issued token can
      # ever reach — and every suite stays green regardless, because each mints its own fake
      # principals. Three audit sweeps each missed a different shape — inline literals, sibling
      # constants, wrapper third arguments, computed families — which is why this DERIVES the
      # demands rather than sampling them with a grep. Anything it cannot resolve fails the
      # build loudly. A repository may exempt a scope in scope-exemptions.json at its root,
      # with a reason of at least forty characters: an exemption without a reason is a hole
      # (the NON_NOTIFYING_TOPICS pattern). The checker is mutation-tested in micro-org's own
      # CI (test/workflow-shell.test.ts): a gate demanding an unregistered scope is injected
      # into a fixture, the run asserted red, and the fixture asserted to have actually changed
      # before the grade counts — this estate has had a canary that graded an unchanged file.
      - name: Every scope this service demands is registered
        env:
          SRC: ${{ inputs.source-dir }}
        run: |
          set -uo pipefail
          cat > "$RUNNER_TEMP/scope-audit.mjs" <<'SCOPE_AUDIT_SCRIPT'
          // scope-audit: every scope a service's gates demand must be in the contracts registry.
          //
          // Derivation, not grep. Three audit sweeps each had a different blind spot — inline literals,
          // helper-resolved constants, wrapper third arguments, computed families — so this walks the
          // demand graph: seed on the primitives a service token is actually matched against, propagate
          // through named wrappers whose parameter flows into a seed, and refuse loudly on any shape it
          // cannot close. An unresolvable demand FAILS the build; silence is how the registry got 30
          // scopes behind.
          //
          // usage: node scope-audit.mjs <source-dir> <contracts-auth-index.ts> [exemptions.json]
          import { readFileSync, readdirSync, statSync, existsSync } from 'node:fs'
          import { join } from 'node:path'

          const [, , srcDir, contractsIndex, exemptionsPath] = process.argv
          if (!srcDir || !contractsIndex) {
            console.error('usage: scope-audit.mjs <source-dir> <contracts-auth-index.ts> [exemptions.json]')
            process.exit(2)
          }

          // ---------------------------------------------------------------- the registry
          const registryText = readFileSync(contractsIndex, 'utf8')
          const scopesBlockStart = registryText.indexOf('export const SCOPES')
          const scopesBlockEnd = registryText.indexOf('as const', scopesBlockStart)
          if (scopesBlockStart < 0 || scopesBlockEnd < 0) {
            console.error(`scope-audit: cannot find the SCOPES registry in ${contractsIndex}`)
            process.exit(2)
          }
          const REGISTRY = new Set(
            [...registryText.slice(scopesBlockStart, scopesBlockEnd).matchAll(/'([a-z][a-z0-9:-]+)':\s*Object\.freeze\(/g)].map(
              (m) => m[1],
            ),
          )
          if (REGISTRY.size === 0) {
            console.error(`scope-audit: parsed zero scopes out of ${contractsIndex} — the parser is broken, not the estate`)
            process.exit(2)
          }

          // ---------------------------------------------------------------- source collection
          function collect(dir, out = []) {
            for (const name of readdirSync(dir)) {
              const p = join(dir, name)
              const st = statSync(p)
              if (st.isDirectory()) {
                if (/testsupport|node_modules|dist/.test(name)) continue
                collect(p, out)
              } else if (
                /\.(ts|tsx|mts|js|mjs)$/.test(name) &&
                !/\.(test|spec)\.(ts|tsx|mts|js|mjs)$/.test(name) &&
                !/\.d\.ts$/.test(name) &&
                !/testsupport/.test(name)
              ) {
                out.push(p)
              }
            }
            return out
          }

          // Comments are stripped BEFORE matching — six guards in this estate have fired on their own
          // prose. Strings and template literals (including nested ${}) are preserved: the literals are
          // the data.
          function stripComments(text) {
            let out = ''
            let i = 0
            const n = text.length
            const templateDepth = [] // ${} nesting inside template literals
            while (i < n) {
              const c = text[i]
              const d = text[i + 1]
              if (c === '/' && d === '/') {
                while (i < n && text[i] !== '\n') i++
                continue
              }
              if (c === '/' && d === '*') {
                i += 2
                while (i < n && !(text[i] === '*' && text[i + 1] === '/')) {
                  if (text[i] === '\n') out += '\n' // keep line numbers stable
                  i++
                }
                i += 2
                continue
              }
              if (c === "'" || c === '"') {
                out += c
                i++
                while (i < n && text[i] !== c) {
                  if (text[i] === '\\') {
                    out += text[i] + (text[i + 1] ?? '')
                    i += 2
                    continue
                  }
                  out += text[i]
                  i++
                }
                out += text[i] ?? ''
                i++
                continue
              }
              if (c === '`') {
                out += c
                i++
                while (i < n && text[i] !== '`') {
                  if (text[i] === '\\') {
                    out += text[i] + (text[i + 1] ?? '')
                    i += 2
                    continue
                  }
                  if (text[i] === '$' && text[i + 1] === '{') {
                    // an interpolation may contain anything, including strings; balance braces
                    out += '${'
                    i += 2
                    let depth = 1
                    while (i < n && depth > 0) {
                      if (text[i] === '{') depth++
                      if (text[i] === '}') depth--
                      if (depth > 0) out += text[i]
                      i++
                    }
                    out += '}'
                    continue
                  }
                  out += text[i]
                  i++
                }
                out += text[i] ?? ''
                i++
                continue
              }
              out += c
              i++
            }
            void templateDepth
            return out
          }

          const files = collect(srcDir).map((path) => ({ path, text: stripComments(readFileSync(path, 'utf8')) }))

          const lineOf = (text, offset) => text.slice(0, offset).split('\n').length

          // ---------------------------------------------------------------- small parsers

          /** Split the argument list starting just after an opening paren. Returns { args, end }. */
          function parseArgs(text, openParen) {
            const args = []
            let depth = 1
            let current = ''
            let i = openParen + 1
            while (i < text.length && depth > 0) {
              const c = text[i]
              if (c === "'" || c === '"' || c === '`') {
                const quote = c
                current += c
                i++
                while (i < text.length && text[i] !== quote) {
                  if (text[i] === '\\') {
                    current += text[i] + (text[i + 1] ?? '')
                    i += 2
                    continue
                  }
                  current += text[i]
                  i++
                }
                current += text[i] ?? ''
                i++
                continue
              }
              if (c === '(' || c === '[' || c === '{') depth++
              if (c === ')' || c === ']' || c === '}') {
                depth--
                if (depth === 0) break
              }
              if (c === ',' && depth === 1) {
                args.push(current.trim())
                current = ''
                i++
                continue
              }
              current += c
              i++
            }
            args.push(current.trim())
            return { args: args.filter((a) => a !== ''), end: i }
          }

          /** Parameter names of a declaration's parameter list (types/defaults stripped; destructuring skipped). */
          function paramNames(paramsText) {
            const { args } = parseArgs('(' + paramsText + ')', 0)
            return args.map((a) => {
              const name = a.replace(/^\.\.\./, '').match(/^([A-Za-z_$][\w$]*)/)
              return name ? name[1] : null
            })
          }

          /**
           * Every NAMED function in a file, with its parameter names and body span. Handles
           * `function name(...)`, `const name = (...) =>` and union return types whose members are object
           * literals (the `{` that starts the body is the one not followed by `|` or `&`).
           */
          function functionsIn(text) {
            const out = []
            const decl = /(?:^|[^\w$.])(?:export\s+)?(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(|(?:^|[^\w$.])(?:export\s+)?const\s+([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?\(/g
            let m
            while ((m = decl.exec(text))) {
              const name = m[1] ?? m[2]
              const open = text.indexOf('(', m.index + m[0].length - 1)
              if (open < 0) continue
              const params = parseArgs(text, open)
              let i = params.end + 1
              // skip a return-type annotation (or the `=>` of an arrow) to the body's opening brace
              let bodyStart = -1
              let angle = 0
              let paren = 0
              while (i < text.length) {
                const c = text[i]
                if (c === '<') angle++
                else if (c === '>' && text[i - 1] !== '=') angle = Math.max(0, angle - 1)
                else if (c === '(') paren++
                else if (c === ')') paren--
                else if (c === '{' && angle === 0 && paren === 0) {
                  // a `{` here is either the body or an object TYPE in a union return annotation; a type
                  // member is followed by `|` or `&` after its closing brace
                  let depth = 1
                  let j = i + 1
                  while (j < text.length && depth > 0) {
                    if (text[j] === '{') depth++
                    if (text[j] === '}') depth--
                    j++
                  }
                  const after = text.slice(j).match(/^\s*([|&])/)
                  if (after) {
                    i = j
                    continue
                  }
                  bodyStart = i
                  break
                } else if (
                  (c === ';' && angle === 0 && paren === 0) ||
                  (c === '=' && text[i + 1] === '>' && angle === 0 && paren === 0)
                ) {
                  if (c === ';') break
                  // arrow: body is a block or an expression
                  const arrowBody = text.indexOf('{', i)
                  const nl = text.indexOf('\n', i)
                  if (arrowBody >= 0 && (nl < 0 || arrowBody < nl)) {
                    bodyStart = arrowBody
                  }
                  break
                }
                i++
              }
              if (bodyStart < 0) continue
              let depth = 1
              let j = bodyStart + 1
              while (j < text.length && depth > 0) {
                if (text[j] === "'" || text[j] === '"' || text[j] === '`') {
                  const quote = text[j]
                  j++
                  while (j < text.length && text[j] !== quote) j += text[j] === '\\' ? 2 : 1
                } else if (text[j] === '{') depth++
                else if (text[j] === '}') depth--
                j++
              }
              out.push({ name, params: paramNames(params.args.join(',')), bodyStart, bodyEnd: j, declStart: m.index })
            }
            return out
          }

          const fnIndex = new Map(files.map((f) => [f.path, functionsIn(f.text)]))

          /** The innermost..outermost named functions containing an offset. */
          function enclosing(file, offset) {
            return (fnIndex.get(file.path) ?? [])
              .filter((fn) => fn.bodyStart < offset && offset < fn.bodyEnd)
              .sort((a, b) => b.bodyStart - a.bodyStart)
          }

          // ---------------------------------------------------------------- the demand graph
          const errors = []
          const demands = new Map() // scope -> [provenance]
          const gates = [] // { fn, idx, array }
          const seen = new Set()

          function addGate(fn, idx, array = false) {
            const key = `${fn}@${idx}${array ? ':array' : ''}`
            if (seen.has(key)) return
            seen.add(key)
            gates.push({ fn, idx, array })
          }

          addGate('requireScope', 1)
          addGate('requireAllScopes', 1, true)
          addGate('hasScope', 1)

          const SCOPE_SHAPE = /^[a-z][a-z0-9-]*(:[a-z0-9-]+){1,2}$/

          function demand(scope, where) {
            if (!SCOPE_SHAPE.test(scope)) {
              errors.push(`${where}: '${scope}' does not look like a service scope — the derivation is wrong, fix the checker`)
              return
            }
            if (!demands.has(scope)) demands.set(scope, [])
            demands.get(scope).push(where)
          }

          /** The closed set of values a computed family's placeholder may take, or null. */
          function closedSetFor(file, argIdent, callOffset) {
            // the demand site's own file must validate the variable against an enumerated set:
            //   SETNAME.has(argIdent ...)  or  SETNAME.includes(argIdent ...)
            const guard = new RegExp(`([A-Za-z_$][\\w$]*)\\.(?:has|includes)\\(\\s*${argIdent}\\b`)
            const m = guard.exec(file.text)
            if (!m) return null
            const setName = m[1]
            for (const f of files) {
              const decl = new RegExp(`\\b${setName}\\s*(?::[^=\\n]{0,80})?=\\s*(?:new\\s+Set(?:<[^>]{0,80}>)?\\()?\\s*\\[`).exec(f.text)
              if (!decl) continue
              const open = f.text.indexOf('[', decl.index)
              const { args } = parseArgs(f.text, open) // parseArgs balances [ ] by depth, splitting at depth 1
              const literals = []
              for (const a of args) {
                const lit = a.match(/^['"]([^'"]+)['"]$/)
                if (!lit) return null // a member that is not a literal means the set is not closed
                literals.push(lit[1])
              }
              if (literals.length > 0) return literals
            }
            void callOffset
            return null
          }

          function resolveTemplate(file, template, argIdent, where) {
            // `prefix${x}`-shaped only; anything richer is a shape the estate does not have yet
            const m = template.match(/^`([^`$]*)\$\{\s*[A-Za-z_$][\w$.]*\s*\}([^`$]*)`$/)
            if (!m) {
              errors.push(`${where}: computed scope ${template} has a shape this checker cannot close — fail, do not guess`)
              return
            }
            const values = argIdent ? closedSetFor(file, argIdent, 0) : null
            if (!values) {
              errors.push(
                `${where}: computed scope family ${template} is not provably closed — no enumerated set constrains its input at the demand site`,
              )
              return
            }
            for (const v of values) demand(`${m[1]}${v}${m[2]}`, `${where} (closed over {${values.join(', ')}})`)
          }

          function resolveExpr(expr, file, offset, depth = 0) {
            const where = `${file.path}:${lineOf(file.text, offset)}`
            if (depth > 6) {
              errors.push(`${where}: resolution recursed past any shape the estate has — refusing to guess`)
              return
            }
            const trimmed = expr.trim()
            const literal = trimmed.match(/^['"]([^'"]+)['"]$/)
            if (literal) {
              demand(literal[1], where)
              return
            }
            if (trimmed.startsWith('[')) {
              const { args } = parseArgs(trimmed, 0)
              for (const a of args) resolveExpr(a, file, offset, depth + 1)
              return
            }
            if (trimmed.startsWith('`')) {
              resolveTemplate(file, trimmed, null, where)
              return
            }
            const call = trimmed.match(/^([A-Za-z_$][\w$]*)\((.*)\)$/s)
            if (call) {
              const [, fnName, inner] = call
              const innerIdent = inner.trim().match(/^([A-Za-z_$][\w$]*)$/)?.[1] ?? null
              for (const f of files) {
                const fn = (fnIndex.get(f.path) ?? []).find((d) => d.name === fnName)
                if (!fn) continue
                const body = f.text.slice(fn.bodyStart, fn.bodyEnd)
                const ret = body.match(/return\s+(`[^`]*`)/)
                if (!ret) break
                resolveTemplate(file, ret[1], innerIdent, where)
                return
              }
              errors.push(`${where}: cannot resolve the scope computed by ${fnName}(…) — fail, do not guess`)
              return
            }
            const ident = trimmed.match(/^[A-Za-z_$][\w$]*$/)?.[0]
            if (!ident) {
              errors.push(`${where}: '${trimmed}' is a scope expression this checker cannot resolve — fail, do not guess`)
              return
            }
            // a parameter of an enclosing function makes that function a gate at that position
            for (const fn of enclosing(file, offset)) {
              const idx = fn.params.indexOf(ident)
              if (idx >= 0) {
                addGate(fn.name, idx)
                return
              }
            }
            // otherwise a constant, declared anywhere in this repository
            for (const f of files) {
              const decl = new RegExp(`\\b${ident}\\s*(?::\\s*[A-Za-z_$][\\w$.<>\\[\\] |']*?)?=\\s*(['"\`][^\\n]*)`, 'g')
              let m
              while ((m = decl.exec(f.text))) {
                const init = m[1].trim()
                const lit = init.match(/^(['"])([^'"]+)\1/)
                if (lit) {
                  demand(lit[2], `${where} (= ${ident} at ${f.path}:${lineOf(f.text, m.index)})`)
                  return
                }
                if (init.startsWith('`')) {
                  resolveTemplate(f, init.match(/^`[^`]*`/)?.[0] ?? init, null, where)
                  return
                }
              }
            }
            errors.push(`${where}: '${ident}' resolves to no string constant in this repository — fail, do not guess`)
          }

          // seed pattern: <ident>.scopes.includes(X) — a service principal's scopes, matched directly.
          // `key.scopes` is excluded: devplatform's customer API keys carry their own vocabulary, minted
          // by that service and deliberately not in the contracts registry.
          for (const file of files) {
            const member = /([A-Za-z_$][\w$]*)\.scopes\.includes\s*\(/g
            let m
            while ((m = member.exec(file.text))) {
              if (m[1] === 'key') continue
              const open = file.text.indexOf('(', m.index + m[0].length - 1)
              const { args } = parseArgs(file.text, open)
              if (args.length >= 1) resolveExpr(args[0], file, m.index)
            }
            // grantsScope/grantsAllScopes seed ONLY when the granted argument is `<ident>.scopes` — a bare
            // array parameter is mint-time validation (identity), and `caller.key.scopes` is an API key.
            const grants = /\b(grantsScope|grantsAllScopes)\s*\(/g
            while ((m = grants.exec(file.text))) {
              if (/function\s+$/.test(file.text.slice(Math.max(0, m.index - 20), m.index + 1))) continue
              const open = file.text.indexOf('(', m.index + m[1].length)
              const { args } = parseArgs(file.text, open)
              if (args.length < 2) continue
              if (!/^[A-Za-z_$][\w$]*\.scopes$/.test(args[0].trim())) continue
              resolveExpr(args[1], file, m.index)
            }
          }

          // worklist: named gates, including ones discovered by parameter flow
          for (let g = 0; g < gates.length; g++) {
            const { fn, idx, array } = gates[g]
            for (const file of files) {
              const call = new RegExp(`(^|[^\\w$.])${fn}\\s*\\(`, 'g')
              let m
              while ((m = call.exec(file.text))) {
                const at = m.index + m[1].length
                if (/function\s+$/.test(file.text.slice(Math.max(0, at - 20), at))) continue // the declaration
                if (/const\s+$/.test(file.text.slice(Math.max(0, at - 20), at))) continue
                const open = file.text.indexOf('(', at + fn.length - 1)
                const { args } = parseArgs(file.text, open)
                if (args.length <= idx) continue
                const arg = args[idx]
                if (array && arg.trim().startsWith('[')) {
                  const { args: members } = parseArgs(arg.trim(), 0)
                  for (const member of members) resolveExpr(member, file, at)
                } else {
                  resolveExpr(arg, file, at)
                }
              }
            }
          }

          // ---------------------------------------------------------------- exemptions
          // The NON_NOTIFYING_TOPICS pattern: an exemption is a decision with its reasoning written down.
          // Under 40 characters is not reasoning. An exemption for a scope that is registered, or that no
          // gate demands, is stale and fails.
          const exemptions = new Map()
          if (exemptionsPath && existsSync(exemptionsPath)) {
            let parsed
            try {
              parsed = JSON.parse(readFileSync(exemptionsPath, 'utf8'))
            } catch {
              errors.push(`${exemptionsPath}: not valid JSON`)
              parsed = {}
            }
            for (const [scope, reason] of Object.entries(parsed)) {
              if (typeof reason !== 'string' || reason.trim().length < 40) {
                errors.push(`${exemptionsPath}: the exemption for '${scope}' has no real reason — under 40 characters is a hole, not a decision`)
                continue
              }
              if (REGISTRY.has(scope)) {
                errors.push(`${exemptionsPath}: '${scope}' is exempted AND registered — the exemption is stale, delete it`)
                continue
              }
              exemptions.set(scope, reason)
            }
            for (const scope of exemptions.keys()) {
              if (!demands.has(scope)) {
                errors.push(`${exemptionsPath}: '${scope}' is exempted but no gate demands it — the exemption is stale, delete it`)
              }
            }
          }

          // ---------------------------------------------------------------- the verdict
          const derived = [...demands.keys()].sort()
          for (const scope of derived) {
            const status = REGISTRY.has(scope) ? 'registered' : exemptions.has(scope) ? 'exempted' : 'MISSING'
            console.log(`${status.padEnd(10)} ${scope}`)
            for (const where of demands.get(scope)) console.log(`             ${where}`)
          }

          const missing = derived.filter((s) => !REGISTRY.has(s) && !exemptions.has(s))
          for (const scope of missing) {
            errors.push(
              `'${scope}' is demanded by a gate but absent from @cloudsforge/contracts-auth SCOPE_NAMES — identity can never mint it. Register it in contracts/packages/auth/src/index.ts, or exempt it here with a written reason.`,
            )
          }

          if (errors.length > 0) {
            console.error(`\nscope-audit: FAILED`)
            for (const e of errors) console.error(`  ${e}`)
            process.exit(1)
          }
          console.log(`\nscope-audit: ok — ${derived.length} demanded scope(s), all registered or exempted (registry has ${REGISTRY.size})`)
          SCOPE_AUDIT_SCRIPT
          node "$RUNNER_TEMP/scope-audit.mjs" "service/$SRC" contracts/packages/auth/src/index.ts service/scope-exemptions.json

      - name: Test
        working-directory: service
        # The DSN is exported under the service's OWN variables, resolved exactly as the `rules`
        # job resolves them. A generic DATABASE_URL alone would not do: every suite in this estate
        # reads `<SERVICE>_TEST_DATABASE_URL` and skips when it is absent.
        #
        # THAT SKIP IS WHY THIS STEP IS SHAPED LIKE THIS. Before the service container existed,
        # the variable was never set, so every database-backed test in fifteen services skipped
        # and CI went green. Green while proving nothing is materially worse than red: the estate
        # believed its ledger's deferred constraints, its custody overdraft trigger and its
        # settlement lease were covered by CI, and not one of those assertions had executed there.
        # So the run is checked for the skip afterwards and the build fails if it happened.
        env:
          CI_DSN: postgres://ci:ci@127.0.0.1:5432/ci_test
          SERVICE: ${{ inputs.service }}
          DECLARED: ${{ inputs.database-env-var }}
          NEEDS_DB: ${{ inputs.postgres }}
        run: |
          set -uo pipefail
          if [ "$NEEDS_DB" = "true" ]; then
            want="$DECLARED"
            if [ -z "$want" ]; then
              want="$(printf '%s' "$SERVICE" | tr '[:lower:]-' '[:upper:]_')_DATABASE_URL"
            fi
            # The suite's variable is the declared one with _TEST_ in it: LEDGER_DATABASE_URL ->
            # LEDGER_TEST_DATABASE_URL. Both are exported, because migration helpers read the
            # first and testsupport.ts reads the second.
            test_var="${want/_DATABASE_URL/_TEST_DATABASE_URL}"
            echo "database exported as ${want} and ${test_var}"
            export "$want=$CI_DSN"
            export "$test_var=$CI_DSN"
            export DATABASE_URL="$CI_DSN"
          fi

          set -o pipefail
          ${{ inputs.package-manager }} run test 2>&1 | tee /tmp/test-output.txt
          status=$?

          # THE SKIP SCAN, AND WHY IT IS NO LONGER ONE GREP.
          #
          # The pattern was `set [A-Z_]*TEST_DATABASE_URL`, and the wildcard matched ANY service's
          # DSN name rather than the one this job exports. So it could not tell the disaster it was
          # written for — this service's own database absent, nothing ran, green would have been a
          # lie — from a cross-service tier standing down, which is a different thing entirely.
          #
          # micro-ledger is where it bit: 195 tests, 191 passing, 0 failing, every database-backed
          # case run against the real Postgres this job provides — and red, because four cases in
          # `chainbacking.test.ts` are gated on `INDEXER_TEST_DATABASE_URL` and a micro-indexer
          # checkout beside it. `INDEXER_` satisfies `[A-Z_]*` exactly as well as `LEDGER_` does.
          # Four repositories carry such a tier today: ledger, indexer, conformance and
          # service-template.
          #
          # So each reporting line is read for the variables it NAMES, and judged:
          #
          #   * names a variable other than the one exported here → a cross-service tier stood
          #     down. NOT a failure — this job provides one database and that tier needs two — but
          #     not silence either. It is surfaced as a notice, because an estate-level integration
          #     that is not being exercised is information, and a skip nobody can see is how this
          #     file's own rules keep discovering they had blind spots.
          #   * names only this service's variable, or names none at all ("database tests are
          #     disabled") → the original disaster, unchanged and still fatal.
          #
          # A line naming BOTH counts as a stand-down, and that is sound rather than lenient:
          # `indexer/src/chainbacking.test.ts` prints both names in one sentence, and this job
          # has just exported the own half itself, so the own half cannot be why anything skipped.
          if [ "$NEEDS_DB" = "true" ]; then
            reported=$(grep -iE 'set [A-Z_]*TEST_DATABASE_URL|database tests are disabled' /tmp/test-output.txt | sort -u || true)
            blind=''
            standdown=''
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              named=$(printf '%s\n' "$line" | grep -oE '[A-Z][A-Z_]*_TEST_DATABASE_URL' | sort -u || true)
              foreign=$(printf '%s\n' "$named" | grep -vxF "$test_var" || true)
              if [ -n "$foreign" ]; then
                standdown="${standdown}${line}"$'\n'
              else
                blind="${blind}${line}"$'\n'
              fi
            done < <(printf '%s\n' "$reported")

            if [ -n "$standdown" ]; then
              echo "::notice::a cross-service test tier stood down — it needs a database this job does not provide"
              printf '%s' "$standdown"
              echo "This is not a failure: ${SERVICE}'s own database-backed suite ran. It is recorded"
              echo "because an estate-level integration that CI never exercises is worth knowing about."
            fi
            if [ -n "$blind" ]; then
              echo "::error::the database-backed tests SKIPPED — CI would have gone green without running them"
              printf '%s' "$blind"
              echo "The suite could not see a usable DSN. It must contain 'test' in the database name;"
              echo "check that this service reads ${test_var} and that inputs.service matches."
              exit 1
            fi
          fi
          exit $status

  rules:
    name: The rules that repository walls used to enforce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rule 1 — a service owns exactly one database and reads no other.
      #
      # The estate's most valuable property is that no service reads another's tables. It held
      # because it was awkward to break, not because anything stopped you. A second connection
      # string in a repository is the first step of every distributed monolith ever built, and
      # once one service reads another's schema, neither can migrate independently again.
      # The variable this service is entitled to read, resolved once and used by the two guards
      # below. It is a PREFIX question, not a string equality one: a service's own TEST database is
      # its own database. The check used to compare against `$want` exactly, so
      # `LEDGER_TEST_DATABASE_URL` — which every testsupport.ts in the estate reads, by
      # construction — counted as "another service's database". Rule 1 as written rejected all
      # fifteen services it was meant to protect, and nobody had noticed because no repository's CI
      # had run this workflow yet.
      - name: The database variable this service declares
        id: dbvar
        env:
          SERVICE: ${{ inputs.service }}
          DECLARED: ${{ inputs.database-env-var }}
        run: |
          set -uo pipefail
          want="$DECLARED"
          if [ -z "$want" ]; then
            want="$(printf '%s' "$SERVICE" | tr '[:lower:]-' '[:upper:]_')_DATABASE_URL"
          fi
          {
            echo "want=$want"
            echo "prefix=${want%_DATABASE_URL}"
          } >> "$GITHUB_OUTPUT"
          echo "ok: ${SERVICE} declares ${want}"

      # Every *_DATABASE_URL / *_DB_URL style variable the source reads, judged against the
      # namespace this service owns.
      #
      # COMMENTS ARE BLANKED BY THE ACTION, not by an `awk` written here. Writing
      # `LEDGER_DATABASE_URL` inside a comment explaining why this service does NOT read the
      # ledger's database used to fail the build — the rule fired on its own rationale — and the
      # `awk` that fixed it was the first of seven independent repairs of one defect across this
      # estate (micro-org#303). That `awk` also had the failure mode that is worse than the bug: it
      # was not string-aware, so it treated the slashes in `'postgres://…'` as opening a comment
      # and blanked the rest of the line, which silently weakened this very guard. The shared
      # implementation is string-aware and has that case pinned as a regression test.
      #
      # Test files are excluded. A test is where a service legitimately NAMES another service's
      # variable — to prove it is ignored. micro-market has precisely that test, and had to
      # assemble the name from `['LEDGER','DATABASE','URL'].join('_')` to get past this check: the
      # rule forced a test that agrees with the rule to obscure what it asserts.
      - name: One database, and only its own
        uses: cloudsforge-online/micro-org/.github/actions/source-scan@main
        with:
          paths: ${{ inputs.source-dir }}
          pattern: '\b[A-Z][A-Z0-9_]*_(DATABASE_URL|DB_URL|POSTGRES_URL)\b'
          allow-match: '^${{ steps.dbvar.outputs.prefix }}_(TEST_)?(DATABASE_URL|DB_URL|POSTGRES_URL)$'
          exclude-files: '\.(test|spec)\.'
          title: ${{ inputs.service }} reads a database that is not its own
          ok: 'ok: reads ${{ steps.dbvar.outputs.want }} and nothing else'
          guidance: |
            Rule 1: a service owns exactly one database and reads no other. The answer to needing
            another service's data is an HTTP call typed by a published contract, never a second DSN.

      # A hard-coded DSN bypasses the variable check entirely, and is also a credential in a
      # repository. Tests and examples are exempt; they point at throwaway databases.
      #
      # `testsupport.ts` IS a test file, and the exemption already describes it exactly — it is the
      # estate's convention name for the fixtures a suite shares, it is imported by nothing but
      # `*.test.ts`, and the DSN in it is a loopback address for a database that lives for the
      # length of one run. It was excluded from the READ-VARS half of this rule by the prefix
      # comparison and from the SCOPE AUDIT in this same file (which skips
      # /testsupport|node_modules|dist/), and only this one grep still counted it as source. So two
      # checks in one file disagreed about whether it is test code, and the third read it the way
      # that fails correct work: micro-studio's `BASE_ENV` fixture — four values a `loadEnv` test
      # needs to be otherwise valid — would have failed the build.
      #
      # A DSN inside a COMMENT is not caught here, and that is deliberate rather than a gap: an
      # example connection string in prose is documentation, and secret-hygiene.yml scans comments
      # and everything else for credentials that are real. The two guards divide the work on
      # purpose, and secret-hygiene.yml must never adopt comment blanking for that reason.
      - name: No connection string written into the source
        uses: cloudsforge-online/micro-org/.github/actions/source-scan@main
        with:
          paths: ${{ inputs.source-dir }}
          pattern: '(postgres|postgresql|mysql)://[a-zA-Z0-9_]+:'
          exclude-files: '\.(test|spec)\.[jt]s|testsupport|example'
          title: a connection string is written into the source
          ok: 'ok: no connection string in ${{ inputs.source-dir }}'
          guidance: |
            A DSN in source is a credential in a repository and a database this service can reach
            without declaring it. Read it from the environment.

      # Rule 2 — no service imports another service's source.
      #
      # With one repository per service this is physically true on day one. It stops being true
      # the first time a 'shared helper' is convenient: a path import into a sibling checkout, or
      # a package in the @cloudsforge scope that is really a service's internals. The answer is a
      # package in micro-runtime, or duplication. Never a cross-repo path import.
      # Three separate steps, and the second and third run even when an earlier one has failed.
      # This was one step that collected all three answers before exiting, and that property is
      # worth keeping: a contributor fixing one import wants to see the other two in the same run,
      # not one per push. `!cancelled()` is the narrowest way to say it — the only steps ahead of
      # these in the job are the checkout and the two guards above.
      - name: No import escapes this repository
        if: ${{ !cancelled() }}
        uses: cloudsforge-online/micro-org/.github/actions/source-scan@main
        with:
          paths: ${{ inputs.source-dir }}
          pattern: "from '(\\.\\./){3,}"
          title: an import escapes this repository
          ok: 'ok: no import climbs out of this repository'
          guidance: |
            A relative import climbing three or more levels has left this checkout. The answer is a
            package in micro-runtime, or duplication. Never a cross-repo path import.

      - name: No import reaches into another repository's checkout
        if: ${{ !cancelled() }}
        uses: cloudsforge-online/micro-org/.github/actions/source-scan@main
        with:
          paths: ${{ inputs.source-dir }}
          pattern: "from '[^']*(repos|micro)/[a-z0-9-]+/(src|services|packages)"
          title: an import reaches into another repository's checkout
          ok: 'ok: no import names a sibling checkout'
          guidance: |
            A path import naming another checkout compiles on one machine and on no other.

      # The @cloudsforge scope is for published contracts and runtime libraries only. The allow
      # list is the same one in micro-org tools/registry.ts (ALLOWED_SCOPED_PACKAGES); cfctl doctor
      # checks package.json against it, and this checks the imports.
      #
      # Quoted only, and comments are blanked before matching. Both halves are needed. The quoting
      # requirement alone was the previous mitigation, and it fails the moment prose quotes the
      # package it is telling you not to import — which is the natural way to write that sentence.
      - name: Only published contract and runtime packages
        if: ${{ !cancelled() }}
        uses: cloudsforge-online/micro-org/.github/actions/source-scan@main
        with:
          paths: ${{ inputs.source-dir }}
          pattern: "['\"]@cloudsforge/[a-z0-9-]+['\"]"
          allow-match: "^['\"]@cloudsforge/(contracts-auth|contracts-money|contracts-chain|contracts-market|contracts-worlds|contracts-create|contracts-events|contracts-devplatform|telemetry|http|jobs|auth|db|lifecycle|secrets|policy-client|ui|ui-charts|sdk|cli|hearth-node)['\"]$"
          title: not a published contract or runtime package
          ok: 'ok: every @cloudsforge import is a published package'
          guidance: |
            A cross-service import wearing a package name is still a cross-service import.
            The allow list lives in micro-org tools/registry.ts (ALLOWED_SCOPED_PACKAGES).

      # Rule 4 — every service exposes /livez, /readyz and /metrics.
      #
      # Three endpoints because they answer three different questions to three different callers.
      # A service that serves one /health for all of them cannot be drained: the load balancer
      # cannot be told to stop sending traffic without the orchestrator also deciding the process
      # is dead and restarting it mid-drain.
      - name: /livez, /readyz and /metrics are all served
        run: |
          set -uo pipefail
          src="${{ inputs.source-dir }}"
          missing=''
          for route in /livez /readyz /metrics; do
            grep -rqF "$route" "$src" 2>/dev/null || missing="$missing $route"
          done
          if [ -n "$missing" ]; then
            echo "::error::${{ inputs.service }} does not serve:$missing"
            echo "/livez is static (is the process alive). /readyz checks Postgres, JWKS and every declared"
            echo "upstream (should it get traffic). /metrics is Prometheus text format. AD-17, rule 4."
            exit 1
          fi
          echo "ok: all three are served"

      # Rule 9 — secrets are per-service, and env_file fan-out is banned.
      #
      # The estate's highest-severity finding and close to free to fix: every container received
      # every secret in the file, so a compromise of the marketing site handed over the custody
      # master secret. A repository declares the variables it needs; the deploy provides exactly
      # those.
      #
      # A compose file's comments are blanked too — `#` after whitespace, YAML's own rule. This
      # guard is the clearest remaining case of micro-org#303 outside TypeScript: the sentence a
      # maintainer would naturally write, `# never use env_file: .env — rule 9`, matched the first
      # alternative below and failed the build for saying so.
      - name: No env_file fan-out
        uses: cloudsforge-online/micro-org/.github/actions/source-scan@main
        with:
          paths: .
          extensions: yml,yaml
          include-files: '(docker-)?compose[^/]*\.ya?ml$'
          empty-scan: ok
          # `[ \t]` rather than `\s`, because `\s` matches a newline in JavaScript and these two
          # alternatives are line-anchored. The `m` flag is what makes `^` and `$` mean what they
          # meant to the line-based grep this replaces.
          pattern: 'env_file:[ \t]*\.?/?\.env[ \t]*$|^[ \t]*-[ \t]*\.?/?\.env[ \t]*$'
          flags: m
          title: a compose file hands this container the whole estate's .env
          ok: 'ok: no env_file fan-out'
          guidance: |
            Rule 9: name the variables, or point at .env.${{ inputs.service }}. The estate's
            highest-severity finding and close to free to fix — every container received every
            secret in the file, so a compromise of the marketing site handed over the custody
            master secret.

      # `.env.example` states the port the service actually defaults to.
      #
      # Not pedantry: `.env.example` is what a person copies to `.env` before running the thing.
      # `micro-notify` shipped `PORT=4600` while `src/env.ts` defaulted to 4012, and
      # `micro-settlement` shipped `PORT=4008` — the port `micro-custody` and `micro-indexer` both
      # bind — while its own code defaulted to 4000. Copying that file verbatim put three services
      # on one port, and the file and the code disagreed with no note saying which was right.
      #
      # This checks agreement, NOT any particular number. A service is free to choose any port; it
      # is not free to document a different one than it uses. If the example deliberately differs,
      # the right move is to say so in the file — and then this fails, which is the conversation.
      - name: The example config states the port the code actually uses
        run: |
          set -uo pipefail
          [ -f .env.example ] || { echo "ok: no .env.example"; exit 0; }
          [ -f src/env.ts ] || { echo "ok: no src/env.ts"; exit 0; }

          # The declared default, read out of the integer() call rather than from a comment.
          coded=$(grep -oE "'PORT', *[0-9]+" src/env.ts | grep -oE '[0-9]+$' | head -1 || true)
          # The example's value, ignoring commented-out lines and any *_PORT (SMTP_PORT et al).
          example=$(grep -E '^PORT=[0-9]+' .env.example | head -1 | cut -d= -f2 || true)

          if [ -z "$coded" ] || [ -z "$example" ]; then
            echo "ok: nothing to compare (coded='${coded:-none}' example='${example:-none}')"
            exit 0
          fi
          if [ "$coded" != "$example" ]; then
            echo "::error::.env.example says PORT=${example}, but src/env.ts defaults to ${coded}"
            echo "A person copies .env.example to .env and runs the service. Whichever is right,"
            echo "they must agree — micro-notify said 4600 and meant 4012, and micro-settlement"
            echo "said 4008, which is a port two other services bind."
            exit 1
          fi
          echo "ok: .env.example and src/env.ts agree on PORT=${coded}"

      # Rule 8 — every background timer is a leased job.
      #
      # setInterval doing domain work is correct with exactly one replica and wrong with two:
      # both timers fire, both claim the same work, and for a withdrawal that means two
      # signatures against one nonce, which loses a payment permanently. The lease key names the
      # contended resource, not the row.
      # A call, not a mention: `setInterval(` rather than `setInterval`, and never in prose. The
      # rule has to be explainable in a comment without the comment failing the build.
      #
      # This step used to strip comments itself, with `grep -vE ':[0-9]+:\s*(//|\*|/\*)'`, and that
      # is only half a fix: it drops a line that BEGINS with a comment, so a trailing
      # `stop() // never setInterval() here` still failed the build, and so did any block-comment
      # body whose continuation lines do not start with an asterisk. The shared action blanks
      # comment TEXT instead, which keeps the code on a line that also carries prose.
      - name: No setInterval doing domain work
        uses: cloudsforge-online/micro-org/.github/actions/source-scan@main
        with:
          paths: ${{ inputs.source-dir }}
          pattern: 'setInterval\s*\('
          exclude-files: '\.(test|spec)\.[jt]s'
          allow-line: 'cfctl-allow setInterval'
          title: setInterval in ${{ inputs.service }}
          ok: 'ok: no unmarked setInterval'
          guidance: |
            Rule 8: background work is a leased job claimed FOR UPDATE SKIP LOCKED
            (@cloudsforge/jobs). setInterval doing domain work is correct with exactly one replica
            and wrong with two: both timers fire, both claim the same work, and for a withdrawal
            that means two signatures against one nonce, which loses a payment permanently.
            If this timer genuinely does no domain work — a metrics flush, a cache sweep — mark the
            line 'cfctl-allow setInterval' and say why.

      # ---------------------------------------------------------------- README --
      - name: The repository documents itself
        # TWELVE REPOSITORIES HAD NO README AT ALL — activity, billing, contracts, docs, identity,
        # indexer, ledger, mint, notify, policy, pricing and worlds — and every one of them was
        # green. Nothing anywhere asserted that a deployable explains itself, so the omission was
        # invisible exactly the way four frontends shipping with no favicon was invisible until
        # `brand-chrome.test.ts` existed.
        #
        # CALIBRATED AGAINST THE READMEs THAT ARE ALREADY GOOD, deliberately. Ten were measured
        # first: route tables and configuration tables are NOT universal — micro-lantern and
        # micro-emberkin document neither and are both strong — so requiring them would fail
        # correct work, which is how six guards in this estate came to fire on their own prose.
        # What every good one does have is substance and a way to run the thing. That is the bar.
        #
        # It is a floor, not a specification. A README that clears it can still be poor; one that
        # does not clear it is certainly missing.
        run: |
          set -uo pipefail
          if [ ! -f README.md ]; then
            echo "::error::this repository has no README.md"
            echo "A deployable that does not explain itself is one nobody can operate or extend."
            echo "The shape and the reasoning are in micro-org: templates/README.template.md"
            exit 1
          fi

          bytes=$(wc -c < README.md | tr -d ' ')
          if [ "$bytes" -lt 4000 ]; then
            echo "::error::README.md is ${bytes} bytes — a stub, not documentation"
            echo "The smallest genuinely-documented service in this estate is about 6 kB."
            exit 1
          fi

          # Every well-documented repository here says how to run and test it. It is the one
          # section that is universal, and the first thing a new reader needs.
          if ! grep -qiE 'pnpm (test|dev|install)|docker (run|compose)' README.md; then
            echo "::error::README.md never says how to run or test this repository"
            echo "Include the real commands, including the Postgres the suite needs."
            exit 1
          fi
          echo "ok: README.md is ${bytes} bytes and says how to run the repository"

  image:
    name: Docker image
    if: inputs.build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # ────────────────────────────────────────────────────────────────────────────────────────────
    # THE NINTH DEFECT: this smoke test could not have passed for any service in the estate.
    #
    # It started the image with a DSN pointing at 127.0.0.1:5432 — where, under `docker run`'s
    # default bridge network, NOTHING listens, because that address is the container itself and no
    # Postgres was ever started for this job — and then waited thirty seconds for a `/livez` the
    # container could never serve. Every service here asserts its schema at boot (`index.ts` calls
    # `assertSchemaAtLeast` and exits otherwise, deliberately) and validates its environment at
    # import (`env.ts` exits on a missing variable), so with no database and none of its declared
    # env the process exits long before it binds a socket. Like the eight defects before it, this
    # one survived only because no repository had pushed and run the job.
    #
    # The fix gives the smoke test what a real service is entitled to expect: the same Postgres the
    # test job gets, reached over host networking, migrated with the image's own one-shot migrator,
    # and the service's declared configuration via `smoke-env`. A service with no database
    # (postgres:false) keeps the old bridge-network path and needs none of it.
    # ────────────────────────────────────────────────────────────────────────────────────────────
    services:
      postgres:
        image: ${{ inputs.postgres && format('postgres:{0}', inputs.postgres-version) || '' }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # The runtime and contracts are checked out as NAMED BUILD CONTEXTS, not into the source tree:
      # the estate's Dockerfiles resolve their `link:` dependencies with `COPY --from=runtimepkgs`
      # (and, where a service uses money contracts, `--from=contractspkgs`). Without them the build
      # fails at the first COPY — the image half of the same `link:`-has-no-sibling defect the build
      # job hit. Passing a context the Dockerfile does not reference is harmless.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-runtime
          path: runtime-ctx
          token: ${{ secrets.estate_token || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-contracts
          path: contracts-ctx
          token: ${{ secrets.estate_token || github.token }}
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          build-contexts: |
            runtimepkgs=${{ github.workspace }}/runtime-ctx
            contractspkgs=${{ github.workspace }}/contracts-ctx
          # `push: false` IS CORRECT HERE, and it is not the reason the estate has no published
          # images. This job is a GATE: it builds the image in order to boot it against Postgres
          # and read /livez, which needs `load: true` — the image in the runner's own daemon. The
          # PRODUCER is a separate workflow, publish-image.yml, and it has to be separate: every
          # one of the 35 repositories that calls this file grants the calling job
          # `permissions: {contents: read, packages: read}`, and a called workflow's token can only
          # be reduced, never elevated. Declaring `packages: write` in THIS file would not fail to
          # push — it would fail all 35 repositories at STARTUP, on pull requests as well as on
          # main. Measured: micro-org runs 30900277471 (capped -> startup_failure) and 30900280323
          # (granted -> success). See publish-image.yml's header.
          push: false
          load: true
          tags: ${{ inputs.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A built image proves the Dockerfile parses. It does not prove the image can START, and
      # 'container is unhealthy' with no logs is the shape of silent failure this estate has been
      # bitten by more than once. So: give it a database and its declared config, migrate, start it,
      # and read the endpoint the load balancer reads.
      - name: The image migrates, starts and answers /livez
        env:
          NEEDS_DB: ${{ inputs.postgres }}
          DECLARED: ${{ inputs.database-env-var }}
          SERVICE: ${{ inputs.service }}
          PORT: ${{ inputs.port }}
          MIGRATE: ${{ inputs.migrate-command }}
          SMOKE_ENV: ${{ inputs.smoke-env }}
        run: |
          set -uo pipefail
          image="${SERVICE}:ci"
          name="ci-${SERVICE}"

          # The declared database variable, defaulted the same way every other job defaults it.
          dbvar="$DECLARED"
          if [ -z "$dbvar" ]; then
            dbvar="$(printf '%s' "$SERVICE" | tr '[:lower:]-' '[:upper:]_')_DATABASE_URL"
          fi

          # The service's declared configuration, one `-e` per non-empty line.
          #
          # `KEY=@generate` is replaced with a fresh `openssl rand -base64 48`, and it exists
          # because of micro-org #142. Every service now runs @cloudsforge/secrets at boot, which
          # refuses a value that is not shaped like a generated secret — no NODE_ENV exemption and
          # no CI branch, deliberately, because an escape hatch is reached for in exactly the hurry
          # that produced the defect. That left 23 workflows setting
          # `OUTBOX_SIGNING_SECRET=ci-only-not-a-real-secret-…`, which the guard refuses.
          #
          # The answer is not to weaken the guard for CI. CI does not need a WEAK secret, it needs
          # A secret — nothing in the smoke test verifies a signature against anything else — so it
          # generates a real one per run and throws it away. That is honest in a way the literal
          # never was: the literal claimed to be a secret and was not, which is the same category
          # of lie as the placeholder in the compose file.
          #
          # Generated HERE rather than committed as a high-entropy literal, so no repository ever
          # holds a string that looks like a key: a per-run value cannot be mistaken for one, cannot
          # be copied into a deploy, and leaves nothing for a future reader to wonder about.
          env_args=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              *=@generate) line="${line%@generate}$(openssl rand -base64 48)" ;;
              # `KEY=@credential` mints a SERVICE CREDENTIAL shape: `cfsc_` + 43 base64url
              # characters, which is 32 bytes of key material and exactly the floor
              # `assertServiceCredential` enforces.
              #
              # It exists because `@generate` cannot serve this class. A credential is base64url
              # and carries a `cfsc_` prefix, so a base64 value fails the prefix check, and a
              # service that genuinely READS a credential — admin-api presents one as a Bearer on
              # every ledger call — has nothing it can put in `smoke-env`. The gap was being filled
              # with a literal `cfsc_ci-only-NOT-a-real-credential-…`, which only worked because
              # `assertServiceCredential` had no marker check. Closing that hole (secrets 1.2.0)
              # correctly refuses the literal, so the mechanism has to exist instead.
              #
              # `tr '+/' '-_'` converts the base64 alphabet to base64url, which is what identity's
              # minter emits — and it is why a per-run value here sometimes contains a hyphen and
              # sometimes does not, exactly like the two live estates.
              *=@credential)
                cred=$(openssl rand -base64 33 | tr '+/' '-_' | tr -d '=\n' | cut -c1-43)
                line="${line%@credential}cfsc_${cred}" ;;
              # `KEY=@token` mints a MINTED-TOKEN shape: the two base64url segments and the dot
              # that `/^ey[A-Za-z0-9_-]*\./` matches. It is not signed and nothing can verify it.
              #
              # It exists for the slots that read a ten-minute JWT and present it verbatim as a
              # Bearer — `emberkin/src/env.ts` is the one that forced it, and market, trade,
              # foresight and faucet hold the same shape. Neither `@generate` nor `@credential`
              # can serve them: a base64 key has no dot and a `cfsc_` credential is precisely the
              # wrong answer, because handing one to a slot that presents it verbatim earns a 401
              # with nothing in either log naming the cause.
              #
              # THIS IS NOT A HOLE IN THE GUARD, AND THE DISTINCTION IS WORTH STATING. The smoke
              # test dials no upstream — /livez needs none — so a token that cannot authenticate
              # proves exactly what CI needs proved: that the service boots on a value of the right
              # SHAPE. What the boot guard refuses, and what CI must therefore never write here, is
              # a TYPED placeholder like `estate-placeholder-token-0000000000000000`, which is what
              # the compose file falls back to when the bootstrap has not run.
              #
              # The signature segment is generated per run for the same reason `@generate` is: no
              # repository should hold a literal that looks like key material.
              *=@token)
                jwt_h=$(printf '{"alg":"EdDSA","typ":"JWT"}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')
                jwt_p=$(printf '{"sub":"ci","iss":"ci","exp":0}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')
                jwt_s=$(openssl rand -base64 33 | tr '+/' '-_' | tr -d '=\n' | cut -c1-43)
                line="${line%@token}${jwt_h}.${jwt_p}.${jwt_s}" ;;
            esac
            env_args+=(-e "$line")
          done <<< "$SMOKE_ENV"
          env_args+=(-e "PORT=${PORT}")

          net=(-p "127.0.0.1:${PORT}:${PORT}")
          if [ "$NEEDS_DB" = "true" ]; then
            dsn="postgres://ci:ci@127.0.0.1:5432/ci_test"
            # HOST networking so the container reaches the Postgres SERVICE on the runner's
            # 127.0.0.1:5432. Bridge networking is exactly what put 127.0.0.1 inside the container,
            # where nothing listened — the heart of this defect. `-p` is meaningless under host mode,
            # so it is dropped in favour of the port binding directly on the host.
            net=(--network host)
            env_args+=(-e "${dbvar}=${dsn}")
            echo "migrating the schema the service will assert, using the image's own migrator"
            docker run --rm --network host "${env_args[@]}" "$image" $MIGRATE
          fi

          docker run -d --name "$name" "${net[@]}" "${env_args[@]}" "$image"

          for attempt in $(seq 1 30); do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/livez" || true)
            [ "$code" = "200" ] && { echo "ok: /livez answered after ${attempt}s"; exit 0; }
            # A container that has already exited will never answer; stop waiting and show why.
            #
            # ASKED OF DOCKER RATHER THAN GREPPED OUT OF A PIPE, and that is not a style preference.
            # This was `docker ps --format '{{.Names}}' | grep -qx "$name"`, and under the
            # `set -uo pipefail` above that is a SIGPIPE race: `grep -q` exits the instant it matches
            # — documented behaviour, not an accident — the writer upstream gets EPIPE, and pipefail
            # turns the whole pipeline non-zero. Here that reads as "the container is gone", breaks
            # the wait loop, and reports `the image never answered /livez` about a container that was
            # answering. The same shape was seen failing in micro-devportal-web and then passing on
            # re-run with nothing changed. A gate that is intermittently red for NO reason teaches
            # people to press re-run instead of reading it, and this one is in the reusable workflow
            # every service in the estate calls, so it would look like flaky infrastructure rather
            # than one fixable line.
            #
            # `--filter name=` takes a regex, so `^…$` is exactly `grep -qx`, and `docker ps` already
            # lists only running containers. No pipe, so nothing can close one early.
            [ -n "$(docker ps --quiet --filter "name=^${name}$")" ] || break
            sleep 1
          done
          echo "::error::the image never answered /livez"
          docker logs --tail 80 "$name" || true
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker logs --tail 100 "ci-${{ inputs.service }}" || true
      - name: Down
        if: always()
        run: docker rm -f "ci-${{ inputs.service }}" || true
